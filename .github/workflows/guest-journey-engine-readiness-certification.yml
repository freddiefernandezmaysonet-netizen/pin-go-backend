name: Guest Journey Engine Readiness Certification

on:
  push:
    branches:
      - sprint/guest-journey-engine-readiness-v1
    paths:
      - ".github/workflows/guest-journey-engine-readiness-certification.yml"
      - "prisma/schema.prisma"
      - "prisma/migrations/20260806021200_extend_guest_journey_terminal_lifecycle/**"
      - "prisma/migrations/20260806135300_add_guest_journey_coordination_intents/**"
      - "src/services/guest-journey-contract.ts"
      - "src/services/guest-journey-evaluator.ts"
      - "src/services/guest-journey-evaluator.test.ts"
      - "src/services/guest-journey-coordination-intent.service.ts"
      - "src/services/guest-journey-coordination-intent.service.test.ts"
      - "src/services/guest-journey-evidence.service.ts"
      - "src/services/guest-journey-evidence.service.test.ts"
      - "src/services/guest-journey-reconciler.service.ts"
      - "src/services/guest-journey-reconciler.service.test.ts"
      - "src/services/guest-agreement.service.ts"
      - "src/services/cancellation-policy.service.ts"
      - "src/services/guest-journey-compliance-intent.service.ts"
      - "src/services/guest-journey-compliance-intent.service.test.ts"
      - "src/services/guest-journey.service.ts"
      - "src/services/guest-journey.service.test.ts"
      - "src/services/guest-journey-terminal-lifecycle.test.ts"
      - "src/services/guest-journey-cancelled-initialization.test.ts"
      - "src/workers/reservation.worker.ts"

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/guest-journey-engine-readiness-certification.yml"
      - "prisma/schema.prisma"
      - "prisma/migrations/20260806021200_extend_guest_journey_terminal_lifecycle/**"
      - "prisma/migrations/20260806135300_add_guest_journey_coordination_intents/**"
      - "src/services/guest-journey-contract.ts"
      - "src/services/guest-journey-evaluator.ts"
      - "src/services/guest-journey-evaluator.test.ts"
      - "src/services/guest-journey-coordination-intent.service.ts"
      - "src/services/guest-journey-coordination-intent.service.test.ts"
      - "src/services/guest-journey-evidence.service.ts"
      - "src/services/guest-journey-evidence.service.test.ts"
      - "src/services/guest-journey-reconciler.service.ts"
      - "src/services/guest-journey-reconciler.service.test.ts"
      - "src/services/guest-agreement.service.ts"
      - "src/services/cancellation-policy.service.ts"
      - "src/services/guest-journey-compliance-intent.service.ts"
      - "src/services/guest-journey-compliance-intent.service.test.ts"
      - "src/services/guest-journey.service.ts"
      - "src/services/guest-journey.service.test.ts"
      - "src/services/guest-journey-terminal-lifecycle.test.ts"
      - "src/services/guest-journey-cancelled-initialization.test.ts"
      - "src/workers/reservation.worker.ts"

  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_ci

jobs:
  certify:
    name: Guest Journey Engine Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Run Guest Journey readiness tests
        run: |
          npx tsx --test \
            src/services/guest-journey.service.test.ts \
            src/services/guest-journey-terminal-lifecycle.test.ts \
            src/services/guest-journey-cancelled-initialization.test.ts \
            src/services/guest-journey-evaluator.test.ts \
            src/services/guest-journey-coordination-intent.service.test.ts \
            src/services/guest-journey-evidence.service.test.ts \
            src/services/guest-journey-reconciler.service.test.ts \
            src/services/guest-journey-compliance-intent.service.test.ts

      - name: Run focused Guest Journey TypeScript build
        run: |
          npx tsc \
            --noEmit \
            --module preserve \
            --moduleResolution bundler \
            --target esnext \
            --strict \
            --skipLibCheck \
            --types node \
            src/services/guest-journey-contract.ts \
            src/services/guest-journey-evaluator.ts \
            src/services/guest-journey-evaluator.test.ts \
            src/services/guest-journey-coordination-intent.service.ts \
            src/services/guest-journey-coordination-intent.service.test.ts \
            src/services/guest-journey-evidence.service.ts \
            src/services/guest-journey-evidence.service.test.ts \
            src/services/guest-journey-reconciler.service.ts \
            src/services/guest-journey-reconciler.service.test.ts \
            src/services/guest-agreement.service.ts \
            src/services/cancellation-policy.service.ts \
            src/services/guest-journey-compliance-intent.service.ts \
            src/services/guest-journey-compliance-intent.service.test.ts \
            src/services/guest-journey.service.ts \
            src/services/guest-journey.service.test.ts \
            src/services/guest-journey-terminal-lifecycle.test.ts \
            src/services/guest-journey-cancelled-initialization.test.ts
