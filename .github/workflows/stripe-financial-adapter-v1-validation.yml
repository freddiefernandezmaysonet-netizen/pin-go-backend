name: Stripe Financial Adapter V1 Validation

on:
  push:
    branches:
      - agent/stripe-financial-adapter-v1
    paths:
      - ".github/workflows/stripe-financial-adapter-v1-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stripe-financial-adapter-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply host-transfer correlation patch
        run: node scripts/patch-stripe-financial-adapter-v1-transfer-correlation.mjs
      - name: Install dependencies
        run: npm ci
      - name: Stripe financial adapter tests
        run: npx tsx --test src/services/stripe-financial-adapter.service.test.ts
      - name: Bundle Stripe financial adapter
        run: npx esbuild src/services/stripe-financial-adapter.service.ts --bundle --platform=node --packages=external --outfile=/tmp/stripe-financial-adapter.service.js
      - name: Bundle Admin Financial route
        run: npx esbuild src/routes/admin.financial.routes.ts --bundle --platform=node --packages=external --outfile=/tmp/admin.financial.routes.js
      - name: Bundle backend server
        run: npx esbuild src/server.ts --bundle --platform=node --packages=external --outfile=/tmp/server.js
      - name: Verify and commit validated product change
        run: |
          git diff --check
          git config user.name "freddiefernandezmaysonet-netizen"
          git config user.email "freddiefernandezmaysonet@gmail.com"
          git add src/services/stripe-financial-adapter.service.ts src/services/stripe-financial-adapter.service.test.ts
          git diff --cached --check
          git commit -m "Correlate Stripe host transfers to reservations"
          git push origin HEAD:agent/stripe-financial-adapter-v1
