name: Stripe Financial Event Ledger V1 Apply

on:
  push:
    branches:
      - agent/stripe-financial-event-ledger-v1
    paths:
      - ".github/workflows/stripe-financial-event-ledger-v1-apply.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stripe-financial-event-ledger-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Stripe financial ledger patch
        run: node scripts/apply-stripe-financial-event-ledger-v1.mjs
      - run: npm ci
      - name: Stripe financial ledger tests
        run: npx tsx --test src/services/stripe-financial-event-ledger.service.test.ts src/services/stripe-financial-event-ledger.webhook.contract.test.ts
      - name: Bundle Stripe financial ledger service
        run: npx esbuild src/services/stripe-financial-event-ledger.service.ts --bundle --platform=node --packages=external --outfile=/tmp/stripe-financial-event-ledger.service.js
      - name: Bundle Stripe webhook
        run: npx esbuild src/webhooks/stripe.webhook.ts --bundle --platform=node --packages=external --outfile=/tmp/stripe.webhook.js
      - name: Commit validated webhook change only
        run: |
          git config user.name "freddiefernandezmaysonet-netizen"
          git config user.email "freddiefernandezmaysonet@gmail.com"
          git add src/webhooks/stripe.webhook.ts
          git diff --cached --check
          git commit -m "Add Stripe financial event ledger"
          git push origin HEAD:agent/stripe-financial-event-ledger-v1
