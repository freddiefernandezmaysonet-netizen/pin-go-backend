name: Property Protection V1 Certification

on:
  pull_request:
    paths:
      - "src/routes/public-booking.routes.ts"
      - "src/routes/public-booking.property-protection.contract.test.ts"
      - "src/routes/public-booking.property-protection-consent.contract.test.ts"
      - "src/routes/public-booking.property-protection-card-on-file.contract.test.ts"
      - "src/routes/public-booking.property-protection-guest-portal.contract.test.ts"
      - "src/services/guest-cancellation.service.ts"
      - "src/services/direct-booking.service.ts"
      - "src/services/damage-case-policy.service.ts"
      - "src/services/damage-case-checkout.policy.ts"
      - "src/services/damage-case-checkout.policy.test.ts"
      - "src/services/damage-case-policy.service.test.ts"
      - "src/services/damage-case-guest-notification.service.ts"
      - "src/services/damage-case-guest-notification.contract.test.ts"
      - "src/services/damage-case-guest-closure-notification.service.ts"
      - "src/services/damage-case-guest-closure-notification.contract.test.ts"
      - "src/services/damage-case-guest-response.service.ts"
      - "src/services/damage-case-guest-response.contract.test.ts"
      - "src/services/damage-case-host-response-notification.service.ts"
      - "src/services/damage-case-host-response-notification.contract.test.ts"
      - "src/services/damage-case-mission-control.service.ts"
      - "src/services/damage-case-mission-control.service.test.ts"
      - "src/services/damage-case-mission-control.contract.test.ts"
      - "src/services/damage-case-mission-control-reconciliation.service.ts"
      - "src/services/damage-case-mission-control-reconciliation.service.test.ts"
      - "src/services/damage-case-mission-control-reconciliation.contract.test.ts"
      - "src/services/damage-case-mission-control-reconciliation.db.test.ts"
      - "src/services/email-delivery.service.ts"
      - "src/lib/mailer.ts"
      - "src/workers/message.retry.worker.ts"
      - "src/routes/dashboard.damage-cases.routes.ts"
      - "src/routes/dashboard.damage-cases.contract.test.ts"
      - "src/routes/dashboard.reservations.route.ts"
      - "src/routes/dashboard.reservations.property-protection.contract.test.ts"
      - "src/server.ts"
      - "src/routes/dashboard.properties.route.ts"
      - "src/routes/dashboard.properties.property-protection.test.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - ".github/workflows/property-protection-v1-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate and validate Prisma client without database operations
        env:
          DATABASE_URL: postgresql://property_protection_ci:property_protection_ci@127.0.0.1:5432/property_protection_ci
        run: |
          ./node_modules/.bin/prisma generate --schema ./prisma
          ./node_modules/.bin/prisma validate --schema ./prisma

      - name: Certify Property Protection and non-charging Damage Case contracts
        run: |
          node --import tsx --test src/routes/public-booking.property-protection.contract.test.ts
          node --import tsx --test src/routes/public-booking.property-protection-consent.contract.test.ts
          node --import tsx --test src/routes/public-booking.property-protection-card-on-file.contract.test.ts
          node --import tsx --test src/routes/public-booking.property-protection-guest-portal.contract.test.ts
          node --import tsx --test src/services/damage-case-policy.service.test.ts
          node --import tsx --test src/services/damage-case-checkout.policy.test.ts
          node --import tsx --test src/services/damage-case-guest-notification.contract.test.ts
          node --import tsx --test src/services/damage-case-guest-closure-notification.contract.test.ts
          node --import tsx --test src/services/damage-case-guest-response.contract.test.ts
          node --import tsx --test src/services/damage-case-host-response-notification.contract.test.ts
          node --import tsx --test src/services/damage-case-mission-control.service.test.ts
          node --import tsx --test src/services/damage-case-mission-control.contract.test.ts
          node --import tsx --test src/services/damage-case-mission-control-reconciliation.service.test.ts
          node --import tsx --test src/services/damage-case-mission-control-reconciliation.contract.test.ts
          node --import tsx --test src/routes/dashboard.damage-cases.contract.test.ts
          node --import tsx --test src/routes/dashboard.reservations.property-protection.contract.test.ts

      - name: Type-check Property Protection and Damage Case boundaries
        run: npx tsc --noEmit --skipLibCheck --module nodenext --moduleResolution nodenext --target es2022 src/routes/public-booking.property-protection.contract.test.ts src/routes/public-booking.property-protection-consent.contract.test.ts src/routes/public-booking.property-protection-card-on-file.contract.test.ts src/routes/public-booking.property-protection-guest-portal.contract.test.ts src/services/damage-case-policy.service.test.ts src/services/damage-case-guest-notification.contract.test.ts src/services/damage-case-guest-closure-notification.service.ts src/services/damage-case-guest-closure-notification.contract.test.ts src/services/damage-case-guest-response.service.ts src/services/damage-case-guest-response.contract.test.ts src/services/damage-case-host-response-notification.service.ts src/services/damage-case-host-response-notification.contract.test.ts src/services/damage-case-mission-control.service.ts src/services/damage-case-mission-control.service.test.ts src/services/damage-case-mission-control.contract.test.ts src/services/damage-case-mission-control-reconciliation.service.ts src/services/damage-case-mission-control-reconciliation.service.test.ts src/services/damage-case-mission-control-reconciliation.contract.test.ts src/routes/dashboard.damage-cases.contract.test.ts src/routes/dashboard.reservations.property-protection.contract.test.ts
