name: Apply PMS Ingest Recovery Worker Once

on:
  push:
    branches:
      - agent/mission-control-engine-readiness-v1-backend
    paths:
      - ".github/workflows/apply-pms-ingest-recovery-worker-once.yml"

permissions:
  contents: write

concurrency:
  group: mission-control-pms-ingest-recovery-one-shot
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact sprint branch
        uses: actions/checkout@v4
        with:
          ref: agent/mission-control-engine-readiness-v1-backend
          fetch-depth: 2

      - name: Verify immutable starting point
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="899ae0db90ed00737d122785bf409ce8da9e5b65"
          expected_worker_blob="bbcecacf3f729276ce761deb4f56838778503029"
          workflow_path=".github/workflows/apply-pms-ingest-recovery-worker-once.yml"

          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git hash-object src/workers/reservation.worker.ts)" = "$expected_worker_blob"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow_path"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pingo

      - name: Apply exact PMS recovery worker integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/workers/reservation.worker.ts")
          text = path.read_text()

          replacements = [
              (
                  '''import {
            reconcileGuestJourneyOperationalIssues,
          } from "../services/guest-journey-operational.service";


          console.log("[reservation.worker] BOOT", new Date().toISOString());
          ''',
                  '''import {
            reconcileGuestJourneyOperationalIssues,
          } from "../services/guest-journey-operational.service";
          import {
            processPmsIngestRecovery,
          } from "../services/pms-ingest-recovery.service";


          console.log("[reservation.worker] BOOT", new Date().toISOString());
          ''',
              ),
              (
                  '''const GUEST_JOURNEY_OPERATIONAL_POLL_MS = Number(
            process.env.GUEST_JOURNEY_OPERATIONAL_POLL_MS ??
              60_000
          );
          const REMINDER_ON =
          ''',
                  '''const GUEST_JOURNEY_OPERATIONAL_POLL_MS = Number(
            process.env.GUEST_JOURNEY_OPERATIONAL_POLL_MS ??
              60_000
          );
          const PMS_INGEST_RECOVERY_POLL_MS = Number(
            process.env.PMS_INGEST_RECOVERY_POLL_MS ??
              60_000
          );
          const REMINDER_ON =
          ''',
              ),
              (
                  '''let shuttingDown = false;
          let tickRunning = false;
          let guestJourneyOperationalNextRunAt = 0;

          async function processGuestJourneyOperationalReconciliation(
          ''',
                  '''let shuttingDown = false;
          let tickRunning = false;
          let guestJourneyOperationalNextRunAt = 0;
          let pmsIngestRecoveryNextRunAt = 0;

          async function processGuestJourneyOperationalReconciliation(
          ''',
              ),
              (
                  '''  }
          }

          async function tick() {
          ''',
                  '''  }
          }

          async function processPmsIngestRecoveryCycle(
            now: Date
          ) {
            if (
              now.getTime() <
              pmsIngestRecoveryNextRunAt
            ) {
              return;
            }

            pmsIngestRecoveryNextRunAt =
              now.getTime() +
              PMS_INGEST_RECOVERY_POLL_MS;

            const result =
              await processPmsIngestRecovery(
                prisma,
                now
              );

            if (
              result.staleReleased > 0 ||
              result.scanned > 0 ||
              result.failed > 0
            ) {
              log(
                "pms-ingest-recovery",
                result
              );
            }
          }

          async function tick() {
          ''',
              ),
              (
                  '''    try {
                await processGuestJourneyOperationalReconciliation(
                  now
                );
              } catch (e) {
                errLog(
                  "guest-journey-operational crashed:",
                  toErrString(e)
                );
              }

              try {
                const result = await retryPendingNfcSync(
          ''',
                  '''    try {
                await processGuestJourneyOperationalReconciliation(
                  now
                );
              } catch (e) {
                errLog(
                  "guest-journey-operational crashed:",
                  toErrString(e)
                );
              }

              try {
                await processPmsIngestRecoveryCycle(
                  now
                );
              } catch (e) {
                errLog(
                  "pms-ingest-recovery crashed:",
                  toErrString(e)
                );
              }

              try {
                const result = await retryPendingNfcSync(
          ''',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(
                      "Expected PMS recovery worker block was not found exactly once"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          test "$(git diff --name-only)" = "src/workers/reservation.worker.ts"
          git diff --check

      - name: Compile and test PMS recovery
        run: |
          npx --yes esbuild@0.28.1 src/workers/reservation.worker.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --target=node22 \
            --packages=external \
            --log-level=warning \
            --outfile=/tmp/reservation-worker.mjs

          npx tsx --test \
            src/pms/__tests__/webhook-claim.test.ts \
            src/services/__tests__/pms-ingest-recovery.test.ts

      - name: Commit only the reservation worker
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/mission-control-engine-readiness-v1-backend"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workers/reservation.worker.ts
          git diff --cached --check
          git commit -m "feat: run durable PMS ingest recovery"
          git push origin HEAD:"$branch"

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/mission-control-engine-readiness-v1-backend"
          workflow_path=".github/workflows/apply-pms-ingest-recovery-worker-once.yml"

          git rm "$workflow_path"
          git commit -m "chore: remove PMS recovery one-shot workflow"
          git push origin HEAD:"$branch"
