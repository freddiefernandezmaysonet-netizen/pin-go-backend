name: Listing Experience Tags V1

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/20260925221500_add_listing_experience_tags_v1/migration.sql"
      - "src/services/property-listing-details.service.ts"
      - "src/services/property-listing-details.service.test.ts"
      - "src/routes/dashboard.property-listing-details.routes.ts"
      - "src/routes/dashboard.property-listing-details.routes.test.ts"
      - ".github/workflows/listing-experience-tags-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pingo_schema_validation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma validate
      - name: Run focused Listing Details tests
        run: npm run test:property-listing-details-v1
      - name: Compile focused modules
        run: |
          node --import tsx -e "await import('./src/services/property-listing-details.service.ts')"
          node --import tsx -e "await import('./src/routes/dashboard.property-listing-details.routes.ts')"
