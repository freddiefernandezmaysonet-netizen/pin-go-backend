name: Temporary Booking Public Web Surface Hardening Apply

on:
  push:
    branches:
      - agent/booking-public-web-surface-hardening
    paths:
      - ".github/workflows/booking-public-web-surface-hardening-apply.yml"
      - ".github/scripts/apply_booking_public_web_surface_hardening.py"

permissions:
  contents: write

jobs:
  apply-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/booking-public-web-surface-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply anchored hardening patch
        run: python .github/scripts/apply_booking_public_web_surface_hardening.py
      - name: Verify public surface routes
        run: |
          grep -F 'app.get("/robots.txt"' src/booking-search.staging.server.ts
          grep -F 'app.get("/sitemap.xml"' src/booking-search.staging.server.ts
          grep -F '"/favicon.ico", "/apple-touch-icon.png", "/apple-touch-icon-precomposed.png"' src/booking-search.staging.server.ts
      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund
      - name: Verify TypeScript syntax/transpilation
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          const source = fs.readFileSync('src/booking-search.staging.server.ts', 'utf8');
          const out = ts.transpileModule(source, {
            compilerOptions: {
              target: ts.ScriptTarget.ES2020,
              module: ts.ModuleKind.CommonJS,
              esModuleInterop: true,
            },
            reportDiagnostics: true,
            fileName: 'src/booking-search.staging.server.ts',
          });
          const errors = (out.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
          if (errors.length) {
            for (const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
            process.exit(1);
          }
          NODE
      - name: Verify scoped change only
        run: |
          git diff -- src/booking-search.staging.server.ts
          test -z "$(git status --porcelain | grep -vE 'src/booking-search.staging.server.ts|.github/workflows/booking-public-web-surface-hardening-apply.yml|.github/scripts/apply_booking_public_web_surface_hardening.py' || true)"
      - name: Commit only server hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/booking-search.staging.server.ts
          test -n "$(git status --porcelain src/booking-search.staging.server.ts)"
          git commit -m "Harden Booking Search public web surface"
          git push origin HEAD:agent/booking-public-web-surface-hardening
