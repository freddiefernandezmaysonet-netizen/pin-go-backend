name: E14.1 Sibling Truncation Patch Gate

on:
  push:
    branches:
      - agent/apms-enterprise-guest-journey-e14-access-admission-fencing
    paths:
      - ".github/workflows/e14-1-sibling-truncation-patch.yml"

permissions:
  contents: write

concurrency:
  group: e14-1-sibling-truncation-patch
  cancel-in-progress: false

jobs:
  patch-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apms-enterprise-guest-journey-e14-access-admission-fencing
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact E14-only truncation correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("src/workers/reservation.worker.ts")
          source = path.read_text(encoding="utf-8")

          expected_blob = "3aa2c657700f2c5e34eae7783deec69ada9e93ba"
          actual_blob = subprocess.check_output(
              ["git", "hash-object", str(path)], text=True
          ).strip()
          if actual_blob != expected_blob:
              raise SystemExit(
                  f"WORKER_BLOB_MISMATCH expected={expected_blob} actual={actual_blob}"
              )

          function_anchor = "async function fetchDueCheckins(now: Date) {"
          next_function_anchor = "\nasync function fetchDueCheckouts"
          if source.count(function_anchor) != 1:
              raise SystemExit("FETCH_DUE_CHECKINS_ANCHOR_INVALID")

          function_start = source.index(function_anchor)
          function_end = source.find(next_function_anchor, function_start)
          if function_end < 0:
              raise SystemExit("FETCH_DUE_CHECKINS_END_ANCHOR_INVALID")

          fetch_due_checkins = source[function_start:function_end]
          limit_anchor = '''        orderBy: {
                    startsAt: "asc",
                  },
                  take: 5,
                  include: {'''
          limit_replacement = '''        orderBy: {
                    startsAt: "asc",
                  },
                  ...(GUEST_ACCESS_ADMISSION_E14_CONFIG.enabled
                    ? {}
                    : { take: 5 }),
                  include: {'''

          if fetch_due_checkins.count(limit_anchor) != 1:
              raise SystemExit("E14_SIBLING_LIMIT_ANCHOR_INVALID")

          fetch_due_checkins = fetch_due_checkins.replace(
              limit_anchor,
              limit_replacement,
              1,
          )
          source = (
              source[:function_start]
              + fetch_due_checkins
              + source[function_end:]
          )

          required = [
              "...(GUEST_ACCESS_ADMISSION_E14_CONFIG.enabled",
              "? {}",
              ": { take: 5 }),",
          ]
          for marker in required:
              if marker not in fetch_due_checkins:
                  raise SystemExit(f"MISSING_WORKER_MARKER:{marker}")

          if "selectGuestAccessReservationTarget(" not in source:
              raise SystemExit("CANONICAL_TARGET_SELECTOR_MISSING")

          if "\n        take: 5,\n        include: {" in fetch_due_checkins:
              raise SystemExit("UNCONDITIONAL_FIVE_GRANT_LIMIT_REMAINS")

          path.write_text(source, encoding="utf-8")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          if changed != ["src/workers/reservation.worker.ts"]:
              raise SystemExit(f"UNEXPECTED_CHANGED_FILES:{changed}")
          PY

      - run: npm ci
      - run: npx prisma generate

      - name: E14 truncation and regression tests
        run: |
          node --import tsx --test \
            src/e14/guest-access-reservation-target.e14.test.ts \
            src/e14/guest-access-admission-fence.e14.test.ts \
            src/e14/guest-access-reservation-singleton-fence.e14.test.ts \
            src/e14/guest-access-readiness-mission-control.e14.test.ts \
            src/e14/guest-access-e14-structural.e14.test.ts \
            src/e14/guest-access-worker-integration.e14.test.ts

      - name: E14 strict TypeScript
        run: npx tsc -p tsconfig.guest-journey-enterprise-e14.json

      - name: Reservation worker bundle boundary
        run: |
          npx esbuild src/workers/reservation.worker.ts \
            --bundle \
            --platform=node \
            --packages=external \
            --outfile=/tmp/reservation.worker.e14.1.js

      - name: Prisma schema validation without migration
        env:
          DATABASE_URL: postgresql://pin_go_e14_ci:pin_go_e14_ci@127.0.0.1:5432/pin_go_e14_ci?schema=public
        run: npx prisma validate --schema ./prisma

      - name: Publish worker correction and remove temporary gate
        shell: bash
        run: |
          git diff --check
          git rm -- .github/workflows/e14-1-sibling-truncation-patch.yml
          python - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD"], text=True
          ).splitlines()
          expected = {
              ".github/workflows/e14-1-sibling-truncation-patch.yml",
              "src/workers/reservation.worker.ts",
          }
          if set(changed) != expected:
              raise SystemExit(f"UNEXPECTED_FINAL_CHANGED_FILES:{changed}")
          PY
          git config user.name "freddiefernandezmaysonet-netizen"
          git config user.email "freddiefernandezmaysonet@gmail.com"
          git add -- src/workers/reservation.worker.ts
          git commit -m "Remove E14 sibling truncation when enabled"
          git push origin HEAD:agent/apms-enterprise-guest-journey-e14-access-admission-fencing
