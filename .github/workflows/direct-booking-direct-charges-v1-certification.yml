name: Direct Booking Direct Charges V1 Certification

on:
  push:
    branches:
      - agent/direct-booking-direct-charges-v1
  pull_request:
    paths:
      - "src/billing/stripe.ts"
      - "src/services/direct-booking-stripe-charge-mode.service.ts"
      - "src/services/direct-booking-stripe-charge-mode.service.test.ts"
      - "src/services/direct-booking-stripe-resource-context.service.ts"
      - "src/services/direct-booking-stripe-resource-context.service.test.ts"
      - "src/services/direct-booking-stripe-refund.service.ts"
      - "src/services/direct-booking-stripe-refund.service.test.ts"
      - "src/services/direct-booking-refund.service.ts"
      - "src/services/direct-booking-refund-direct-charges.contract.test.ts"
      - "tsconfig.direct-booking-direct-charges-v1.json"
      - ".github/workflows/direct-booking-direct-charges-v1-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit test Direct Booking Stripe policies and wiring
        run: >-
          node --import tsx --test
          src/services/direct-booking-stripe-charge-mode.service.test.ts
          src/services/direct-booking-stripe-resource-context.service.test.ts
          src/services/direct-booking-stripe-refund.service.test.ts
          src/services/direct-booking-refund-direct-charges.contract.test.ts

      - name: Type-check Direct Booking Stripe policies
        shell: bash
        run: |
          set -o pipefail
          npx tsc -p tsconfig.direct-booking-direct-charges-v1.json 2>&1 | tee direct-booking-direct-charges-tsc.log

      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-booking-direct-charges-typecheck
          path: direct-booking-direct-charges-tsc.log
