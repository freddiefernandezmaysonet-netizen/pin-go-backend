name: APMS Hierarchical Scope Residual Certification

on:
  push:
    branches:
      - agent/apms-enterprise-tenant-property-scope-integrity
    paths:
      - ".github/workflows/apms-hierarchical-scope-residual-certification.yml"
      - "scripts/patch-apms-hierarchical-scope-residuals.py"

permissions:
  contents: write

concurrency:
  group: apms-hierarchical-scope-residual-certification
  cancel-in-progress: false

jobs:
  patch-test-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apms-enterprise-tenant-property-scope-integrity
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact starting branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=f2aae7ea3c1895073c177ca2aa3491cd8b9a2e80
          EXPECTED_PARENT=49025a46c1272e410cf74b341ac9dc4a75c23cca
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          python - <<'PY'
          import subprocess

          expected_parent = "49025a46c1272e410cf74b341ac9dc4a75c23cca"
          allowed = {
              ".github/workflows/apms-hierarchical-scope-residual-certification.yml",
              "scripts/patch-apms-hierarchical-scope-residuals.py",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{expected_parent}...HEAD"],
              text=True,
          ).splitlines())
          if changed != allowed:
              raise SystemExit(
                  f"UNEXPECTED_RESIDUAL_GATE_DIFF expected={sorted(allowed)} actual={sorted(changed)}"
              )
          PY

      - name: Apply exact residual hierarchy patch
        run: |
          python -m py_compile scripts/patch-apms-hierarchical-scope-residuals.py
          python scripts/patch-apms-hierarchical-scope-residuals.py

      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma

      - name: Hierarchical scope contract and focused regressions
        run: |
          node --import tsx --test src/services/guest-journey-tenant-property-scope.policy.test.ts
          npm run test:guest-journey-enterprise-e6-mission-control
          npm run test:guest-journey-enterprise-e13-runtime-truth
          npx tsc -p tsconfig.guest-journey-enterprise-tenant-scope.json

      - name: Full APMS regression E2 through E13
        run: |
          npm run test:guest-journey-enterprise-e2-shadow
          npm run test:guest-journey-enterprise-e3-reconciler
          npm run test:guest-journey-enterprise-e4-coordination
          npm run test:guest-journey-enterprise-e5-owner-runtime
          npm run test:guest-journey-enterprise-e6-mission-control
          npm run test:guest-journey-enterprise-e7-communications
          npm run test:guest-journey-enterprise-e8-access-owner
          npm run test:guest-journey-enterprise-e9-financial-owner
          npm run test:guest-journey-enterprise-e10-compliance-owner
          npm run test:guest-journey-enterprise-e11-activation-control-plane
          npm run test:guest-journey-enterprise-e12-runtime-enforcement
          npm run test:guest-journey-enterprise-e13-runtime-truth

      - name: E14 regression
        run: |
          node --import tsx --test \
            src/e14/guest-access-reservation-target.e14.test.ts \
            src/e14/guest-access-admission-fence.e14.test.ts \
            src/e14/guest-access-reservation-singleton-fence.e14.test.ts \
            src/e14/guest-access-readiness-mission-control.e14.test.ts \
            src/e14/guest-access-e14-structural.e14.test.ts \
            src/e14/guest-access-worker-integration.e14.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-e14.json

      - name: Legacy yield bundles
        run: |
          npx esbuild src/workers/reservation.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/reservation.worker.scope.js
          npx esbuild src/workers/message.retry.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/message.retry.worker.scope.js
          npx esbuild src/workers/access-grant-expire.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/access-grant-expire.worker.scope.js
          npx esbuild src/workers/passcode-expire.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/passcode-expire.worker.scope.js
          npx esbuild src/routes/access.nfc.routes.ts --bundle --platform=node --packages=external --outfile=/tmp/access.nfc.routes.scope.js

      - name: Verify exact permanent scope and preserve schema
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/pin_go_scope_residual_validation' npx prisma validate --schema prisma/schema.prisma
          git diff --check
          python - <<'PY'
          import subprocess

          parent = "49025a46c1272e410cf74b341ac9dc4a75c23cca"
          expected = {
              ".github/workflows/apms-hierarchical-scope-residual-certification.yml",
              ".github/workflows/guest-journey-enterprise-tenant-scope-certification.yml",
              "scripts/patch-apms-hierarchical-scope-residuals.py",
              "src/apms/mission-control-runtime-health.e13.test.ts",
              "src/services/guest-journey-mission-control-cycle.service.test.ts",
              "src/services/guest-journey-mission-control-cycle.service.ts",
              "src/services/guest-journey-runtime-state.service.test.ts",
              "src/services/guest-journey-runtime-state.service.ts",
              "src/services/guest-journey-tenant-property-scope.policy.test.ts",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{parent}...HEAD"],
              text=True,
          ).splitlines())
          working = set(subprocess.check_output(
              ["git", "diff", "--name-only", parent],
              text=True,
          ).splitlines())
          effective = changed | working
          if effective != expected:
              raise SystemExit(
                  f"UNEXPECTED_RESIDUAL_FINAL_SCOPE expected={sorted(expected)} actual={sorted(effective)}"
              )

          forbidden = [
              "prisma/schema.prisma",
              "package.json",
              "package-lock.json",
          ]
          for path in effective:
              if path in forbidden or path.startswith("prisma/migrations/") or "railway" in path.lower():
                  raise SystemExit(f"FORBIDDEN_RESIDUAL_CHANGE:{path}")
          PY

      - name: Publish certified residual fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -- scripts/patch-apms-hierarchical-scope-residuals.py .github/workflows/apms-hierarchical-scope-residual-certification.yml
          git diff --check
          python - <<'PY'
          import subprocess

          parent = "49025a46c1272e410cf74b341ac9dc4a75c23cca"
          expected = {
              ".github/workflows/guest-journey-enterprise-tenant-scope-certification.yml",
              "src/apms/mission-control-runtime-health.e13.test.ts",
              "src/services/guest-journey-mission-control-cycle.service.test.ts",
              "src/services/guest-journey-mission-control-cycle.service.ts",
              "src/services/guest-journey-runtime-state.service.test.ts",
              "src/services/guest-journey-runtime-state.service.ts",
              "src/services/guest-journey-tenant-property-scope.policy.test.ts",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", parent],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(
                  f"UNEXPECTED_CERTIFIED_RESIDUAL_SCOPE expected={sorted(expected)} actual={sorted(changed)}"
              )
          for path in sorted(changed):
              subprocess.check_call(["git", "add", "--", path])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close hierarchical APMS scope residuals"
          git push origin HEAD:agent/apms-enterprise-tenant-property-scope-integrity
