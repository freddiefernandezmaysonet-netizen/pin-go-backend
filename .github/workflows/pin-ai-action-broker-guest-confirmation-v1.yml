name: Pin AI Action Broker Guest Confirmation V1

on:
  pull_request:
    branches:
      - main
      - agent/pin-ai-reservation-modification-action-adapter-v1
    paths:
      - "src/pin-ai/actions/action-broker.service.ts"
      - "src/pin-ai/actions/action-broker.service.test.ts"
      - "src/pin-ai/actions/action-broker.composition.ts"
      - "src/pin-ai/actions/action-broker.composition.test.ts"
      - "src/routes/public-booking.pin-ai.routes.ts"
      - "src/routes/public-booking.pin-ai.routes.test.ts"
      - "tsconfig.pin-ai-action-broker.json"
      - ".github/workflows/pin-ai-action-broker-guest-confirmation-v1.yml"

permissions:
  contents: read

jobs:
  action-broker-guest-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/pingo_test
      APP_URL: http://localhost:3000

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate and validate Prisma client
        run: |
          npx prisma generate
          npx prisma validate --schema ./prisma/schema.prisma

      - name: Run Action Broker and guest confirmation tests
        run: |
          node --import tsx --test \
            src/pin-ai/actions/action-broker.service.test.ts \
            src/pin-ai/actions/action-broker.composition.test.ts \
            src/routes/public-booking.pin-ai.routes.test.ts

      - name: Type-check Action Broker
        run: npx tsc -p tsconfig.pin-ai-action-broker.json

      - name: Type-check retained Pin AI Guest Gateway
        run: npm run test:pin-ai-guest-gateway-types

      - name: Regress Reservation Modification Action Adapter
        env:
          STRIPE_SECRET_KEY: sk_test_pin_ai_ci_placeholder
        run: |
          node --import tsx --test \
            src/pin-ai/actions/reservation-modification-action-adapter.service.test.ts \
            src/services/guest-reservation-modification.policy.test.ts

      - name: Regress Action Proposal foundation
        run: node --import tsx --test src/pin-ai/actions/action-proposal.service.test.ts

      - name: Regress retained Pin AI Runtime
        run: npm run test:pin-ai-runtime
