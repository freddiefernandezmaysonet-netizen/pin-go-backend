name: TTLock Credential Log Security

on:
  pull_request:
    paths:
      - "src/routes/org.ttlock.connect.v2.router.ts"
      - "src/routes/org.ttlock.connect.v2.logging.contract.test.ts"
      - ".github/workflows/ttlock-credential-log-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-log-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TTLock credential logging contract
        run: npx tsx --test src/routes/org.ttlock.connect.v2.logging.contract.test.ts

      - name: TypeScript check
        run: npx tsc --noEmit
