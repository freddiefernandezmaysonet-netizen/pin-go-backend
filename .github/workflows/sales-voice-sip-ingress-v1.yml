name: Sales Voice SIP Ingress Foundation V1

on:
  pull_request:
    branches:
      - agent/sales-voice-commercial-service-v1-20261013
    paths:
      - 'src/services/sales-voice-sip-ingress.service.ts'
      - 'src/services/sales-voice-sip-ingress.service.test.ts'
      - '.github/workflows/sales-voice-sip-ingress-v1.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingo_sales_sip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pingo_sales_sip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_sales_sip_test
      SALES_SIP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_sales_sip_test
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove isolated scope
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const changes=execFileSync('git',['diff','--name-only',process.env.BASE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n');
          const allowed=new Set([
            'src/services/sales-voice-sip-ingress.service.ts',
            'src/services/sales-voice-sip-ingress.service.test.ts',
            '.github/workflows/sales-voice-sip-ingress-v1.yml',
          ]);
          assert.deepEqual(new Set(changes),allowed);
          console.log('PASS: SIP ingress only');
          NODE
          git diff --check "$BASE_SHA" HEAD
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Prisma and generate client
        run: |
          ./node_modules/.bin/prisma validate
          ./node_modules/.bin/prisma generate
      - name: Typecheck isolated SIP adapter
        run: ./node_modules/.bin/tsc --noEmit --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext --esModuleInterop src/services/sales-voice-sip-ingress.service.ts src/services/sales-voice-sip-ingress.service.test.ts
      - name: Disposable database only
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const db=new URL(process.env.DATABASE_URL);
          assert.equal(db.hostname,'127.0.0.1');
          assert.equal(db.pathname,'/pingo_sales_sip_test');
          assert.equal(process.env.DATABASE_URL,process.env.SALES_SIP_TEST_DATABASE_URL);
          NODE
          ./node_modules/.bin/prisma db push --skip-generate
      - name: Run mock-signature boundary and real PostgreSQL
        run: node --import tsx --test src/services/sales-voice-sip-ingress.service.test.ts
      - name: Record limits of certification
        run: |
          echo '## Isolated SIP adapter' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests use MOCK verifier. Actual OpenAI SDK signature verification and call accept are NOT implemented.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No route mounted, no live calls, credentials, number purchase, forwarding or deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Depends on #412 and #411; DO NOT merge to main.' >> "$GITHUB_STEP_SUMMARY"
