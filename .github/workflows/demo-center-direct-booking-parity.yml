name: Demo Center Direct Booking parity
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/routes/admin.demo.routes.ts'
      - 'src/services/internal-demo-direct-booking-parity.service.ts'
      - 'src/services/internal-demo-secure-precheckin.service.ts'
      - 'src/services/internal-demo-secure-precheckin.service.test.ts'
      - 'src/services/internal-demo-native-secure-precheckin.db.test.ts'
      - 'src/services/ingest.service.ts'
      - 'src/services/direct-booking-ingest-transaction.ts'
      - 'src/services/guest-agreement.service.ts'
      - 'src/services/guest-journey.service.ts'
      - 'src/services/guest-access-readiness.service.ts'
      - 'src/services/cleaner-access-window.service.ts'
      - 'src/services/reservation-complete-flow-audit.service.ts'
      - 'prisma/**'
      - 'tsconfig.demo-center-direct-booking-parity.json'
      - '.github/workflows/demo-center-direct-booking-parity.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/no_runtime_database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install prisma generate --schema ./prisma
      - name: Focused TypeScript build
        run: npx --no-install tsc -p tsconfig.demo-center-direct-booking-parity.json
      - name: Demo Center parity contracts and native identity denial tests
        run: node --import tsx --test src/services/internal-demo-secure-precheckin.service.test.ts
  connected-precheckin:
    name: Native Demo PostgreSQL (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: [baseline, candidate]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingo_demo_precheckin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pingo_demo_precheckin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_demo_precheckin_test
      DEMO_NATIVE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_demo_precheckin_test
      DEMO_NATIVE_EXPECT_LEGACY_REJECTION: ${{ matrix.version == 'baseline' && '1' || '0' }}
      STRIPE_SECRET_KEY: sk_test_synthetic_demo_no_network
      RESEND_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require disposable loopback database before any schema writes
        run: |
          node -e 'const assert=require("node:assert/strict"); const u=new URL(process.env.DATABASE_URL); assert.equal(process.env.NODE_ENV,"test"); assert.equal(process.env.DATABASE_URL,process.env.DEMO_NATIVE_TEST_DATABASE_URL); assert.equal(u.hostname,"127.0.0.1"); assert.equal(u.pathname,"/pingo_demo_precheckin_test"); assert.equal(u.search,"");'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install prisma generate --schema ./prisma
      - name: Apply actual migrations only to the disposable PostgreSQL service
        run: npx --no-install prisma migrate deploy --schema ./prisma
      - name: Load the exact pre-fix validator for the negative-control job
        if: matrix.version == 'baseline'
        run: |
          git fetch --no-tags --depth=1 origin 66cdf20f111b441ec0aa39803f8b13479a3283de
          git show 66cdf20f111b441ec0aa39803f8b13479a3283de:src/services/internal-demo-secure-precheckin.service.ts > src/services/internal-demo-secure-precheckin.service.ts
          test "$(git hash-object src/services/internal-demo-secure-precheckin.service.ts)" = "987e6baa0365d95af77e0c727b52e4b01b43d452"
      - name: Native ingest to real secure pre-check-in, without external HTTP
        run: timeout 120s node --import tsx --test --test-reporter=tap src/services/internal-demo-native-secure-precheckin.db.test.ts
