name: Sales Voice Live Admission V1

on:
  pull_request:
    branches:
      - agent/sales-voice-live-sip-auth-v1-20261013
    paths:
      - 'src/services/sales-voice-live-admission.service.ts'
      - 'src/services/sales-voice-live-admission.service.test.ts'
      - '.github/workflows/sales-voice-live-admission-v1.yml'

permissions:
  contents: read

jobs:
  certify:
    name: Live SIP one-shot admission and conservative budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingo_sales_admission_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pingo_sales_admission_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_sales_admission_test
      SALES_VOICE_ADMISSION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_sales_admission_test
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove exact stacked file scope
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const paths=execFileSync('git',['diff','--name-only',process.env.BASE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          assert.deepEqual(paths,[
            '.github/workflows/sales-voice-live-admission-v1.yml',
            'src/services/sales-voice-live-admission.service.test.ts',
            'src/services/sales-voice-live-admission.service.ts',
          ]);
          console.log('PASS: isolated Live admission only');
          NODE
          git diff --check "$BASE_SHA" HEAD
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Prisma and generate client
        run: |
          ./node_modules/.bin/prisma validate
          ./node_modules/.bin/prisma generate
      - name: Typecheck isolated admission module
        run: ./node_modules/.bin/tsc --noEmit --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext --esModuleInterop src/services/sales-voice-live-admission.service.ts src/services/sales-voice-live-admission.service.test.ts
      - name: Create only disposable local PostgreSQL
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const u=new URL(process.env.DATABASE_URL);
          assert.equal(u.hostname,'127.0.0.1');
          assert.equal(u.pathname,'/pingo_sales_admission_test');
          assert.equal(process.env.DATABASE_URL,process.env.SALES_VOICE_ADMISSION_TEST_DATABASE_URL);
          NODE
          ./node_modules/.bin/prisma db push --skip-generate
      - name: Test concurrent admission and injected mock HTTP transport
        run: node --import tsx --test src/services/sales-voice-live-admission.service.test.ts
      - name: Explicit limitations
        run: |
          echo '## Live SIP admission draft certification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mock provider HTTP only, real disposable PostgreSQL. No actual OpenAI/Twilio calls.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Budget is a conservative admission estimate only, NOT hard maximum spend until a hangup watchdog and usage reconciliation exist.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No router mounted, webhook subscription changed, provider credentials read, or T-Mobile forwarding enabled.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Stacked dependency #414 -> #413 -> #412 -> #411, all draft. Do not merge or deploy.' >> "$GITHUB_STEP_SUMMARY"
