name: Booking.com transport readiness validation
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/booking-com-transport-readiness.yml
      - src/distribution/channex-canonical-readiness.service.test.ts
      - src/distribution/channex-canonical-readiness.service.ts
      - src/distribution/ota-commercial-lifecycle.policy.test.ts
      - src/distribution/ota-commercial-lifecycle.policy.ts
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: booking-transport-${{ github.ref }}
  cancel-in-progress: true
env:
  DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
  CHANNEX_API_KEY: TEST_ONLY
  CHANNEX_API_BASE_URL: https://staging.channex.io
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record exact source and preserve main boundary
        run: |
          mkdir -p evidence
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          git rev-parse HEAD > evidence/head.txt
          git diff "${{ github.event.pull_request.base.sha }}"...HEAD > evidence/candidate.patch
          git archive --format=tar.gz -o evidence/source.tar.gz HEAD
      - name: Prove exact narrow diff allowlist
        run: |
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          .github/workflows/booking-com-transport-readiness.yml
          src/distribution/channex-canonical-readiness.service.test.ts
          src/distribution/channex-canonical-readiness.service.ts
          src/distribution/ota-commercial-lifecycle.policy.test.ts
          src/distribution/ota-commercial-lifecycle.policy.ts
          EOF
          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | sort > "$RUNNER_TEMP/actual.txt"
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/vrbo-self-service-connection-center" ]; then
            cat > "$RUNNER_TEMP/vrbo-allowed.txt" <<'EOF'
          .github/workflows/booking-com-transport-readiness.yml
          .github/workflows/booking-com-white-label-safe.yml
          .github/workflows/ota-airbnb-host-confirmed-mapping.yml
          .github/workflows/ota-airbnb-listing-discovery.yml
          package.json
          src/contracts/channex-certified-core.freeze.test.ts
          src/distribution/channex-canonical-readiness.service.ts
          src/distribution/channex-vrbo-transport-readiness.policy.test.ts
          src/distribution/channex-vrbo-transport-readiness.policy.ts
          src/distribution/channex-white-label.adapter.test.ts
          src/distribution/channex-white-label.adapter.ts
          src/distribution/connection-center.read-model.test.ts
          src/distribution/connection-center.read-model.ts
          src/distribution/ota-connection-center.config.test.ts
          src/distribution/ota-connection-center.config.ts
          src/distribution/ota-connection-center.runtime-composition.test.ts
          src/distribution/ota-connection-session.service.ts
          src/distribution/ota-distribution-persistence.service.test.ts
          src/distribution/ota-distribution-persistence.service.ts
          src/routes/dashboard.distribution-connection-center.route.ts
          EOF
            sort "$RUNNER_TEMP/vrbo-allowed.txt" -o "$RUNNER_TEMP/vrbo-allowed.txt"
            diff -u "$RUNNER_TEMP/vrbo-allowed.txt" "$RUNNER_TEMP/actual.txt"
            exit 0
          fi
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/expedia-connection-center-backend" ]; then
            cat > "$RUNNER_TEMP/expedia-allowed.txt" <<'EOF'
          .github/workflows/booking-com-transport-readiness.yml
          .github/workflows/booking-com-white-label-safe.yml
          .github/workflows/ota-airbnb-host-confirmed-mapping.yml
          .github/workflows/ota-airbnb-listing-discovery.yml
          package.json
          src/contracts/channex-certified-core.freeze.test.ts
          src/distribution/channex-canonical-readiness.service.test.ts
          src/distribution/channex-canonical-readiness.service.ts
          src/distribution/channex-channel-lifecycle.evidence.test.ts
          src/distribution/channex-channel-lifecycle.evidence.ts
          src/distribution/channex-expedia-transport-readiness.policy.test.ts
          src/distribution/channex-expedia-transport-readiness.policy.ts
          src/distribution/channex-white-label.adapter.test.ts
          src/distribution/channex-white-label.adapter.ts
          src/distribution/connection-center.read-model.test.ts
          src/distribution/connection-center.read-model.ts
          src/distribution/ota-connection-center.config.test.ts
          src/distribution/ota-connection-center.config.ts
          src/distribution/ota-connection-session.service.test.ts
          src/distribution/ota-connection-session.service.ts
          src/distribution/ota-distribution-persistence.service.test.ts
          src/distribution/ota-distribution-persistence.service.ts
          src/routes/dashboard.distribution-connection-center.route.test.ts
          src/routes/dashboard.distribution-connection-center.route.ts
          EOF
            sort "$RUNNER_TEMP/expedia-allowed.txt" -o "$RUNNER_TEMP/expedia-allowed.txt"
            diff -u "$RUNNER_TEMP/expedia-allowed.txt" "$RUNNER_TEMP/actual.txt"
            exit 0
          fi
          sort "$RUNNER_TEMP/allowed.txt" -o "$RUNNER_TEMP/allowed.txt"
          comm -23 "$RUNNER_TEMP/actual.txt" "$RUNNER_TEMP/allowed.txt" > "$RUNNER_TEMP/outside.txt"
          test ! -s "$RUNNER_TEMP/outside.txt" || {
            cat "$RUNNER_TEMP/outside.txt"
            exit 1
          }
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client only, no database operations
        run: ./node_modules/.bin/prisma generate --schema ./prisma
      - name: Isolated test execution guard
        run: |
          cat > "$RUNNER_TEMP/no-network.cjs" <<'JS'
          const net = require('node:net');
          const connect = net.Socket.prototype.connect;
          net.Socket.prototype.connect = function (...args) {
            const normalized = Array.isArray(args[0]) ? args[0] : args;
            const first = normalized[0];
            const host = first && typeof first === 'object' ? first.host : (typeof normalized[1] === 'string' ? normalized[1] : 'localhost');
            if (host && !['localhost','127.0.0.1','::1'].includes(host)) throw new Error('TEST_EXTERNAL_NETWORK_BLOCKED');
            return connect.apply(this,args);
          };
          JS
      - name: Connection Center and persistence regressions
        env:
          NODE_OPTIONS: --require ${{ runner.temp }}/no-network.cjs
        run: |
          npm run test:distribution-connection-center 2>&1 | tee evidence/connection-center.txt
          npm run test:ota-distribution-persistence 2>&1 | tee evidence/persistence.txt
          npm run test:ota-commercial-closure-types 2>&1 | tee evidence/ota-types.txt
          npm run test:channex-certified-core-freeze 2>&1 | tee evidence/channex-core-freeze.txt
      - name: Preserve source and portable validation inputs
        if: always()
        run: |
          git diff --exit-code HEAD
          tar -czf evidence/test-toolchain.tar.gz node_modules/typescript node_modules/tsx node_modules/esbuild node_modules/@esbuild node_modules/get-tsconfig node_modules/resolve-pkg-maps node_modules/@types/node node_modules/undici-types
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-transport-validation
          path: evidence/
          retention-days: 7
