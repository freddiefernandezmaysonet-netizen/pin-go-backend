name: Enterprise Authentication E6 Email OTP Canary

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/enterprise-auth-e6-email-otp-canary.yml"
      - "src/auth/mfa-core.ts"
      - "src/auth/mfa-otp.ts"
      - "src/auth/mfa-email-only-policy.ts"
      - "src/auth/session-security.policy.ts"
      - "src/auth/mfa-email-otp-delivery.ts"
      - "src/auth/mfa-email-branding.test.ts"
      - "src/auth/trusted-device-session.persistence.ts"
      - "src/auth/trusted-device-cookie.ts"
      - "src/auth/mfa-login-runtime.ts"
      - "src/auth/mfa-login-challenge.ts"
      - "src/auth/mfa-login.routes.ts"
      - "src/auth/mfa-canary-runtime.ts"
      - "src/auth/mfa-canary-flow.ts"
      - "src/auth/enterprise-auth-e6.test.ts"
      - "src/routes/auth.routes.ts"
      - "tsconfig.enterprise-auth-e6.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pingo_auth_e6?schema=public

jobs:
  certify:
    name: E6 canary contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingo_auth_e6
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Validate Prisma and migration history
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy

      - name: Certify E1 through E6 auth contracts
        run: >-
          npx tsx --test
          src/auth/mfa-core.test.ts
          src/auth/mfa-otp.test.ts
          src/auth/mfa-otp-delivery.test.ts
          src/auth/mfa-email-only-session-security.test.ts
          src/auth/enterprise-auth-e4.test.ts
          src/auth/enterprise-auth-e5.test.ts
          src/auth/enterprise-auth-e6.test.ts
          src/auth/mfa-email-branding.test.ts

      - name: TypeScript E6 module contract
        run: npx tsc -p tsconfig.enterprise-auth-e6.json

      - name: Load E6 login routes
        run: npx tsx -e "import('./src/auth/mfa-login.routes.ts').then(() => import('./src/routes/auth.routes.ts'))"

      - name: Certify E6 safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test -z "$(git diff --name-only origin/main...HEAD -- prisma/migrations)"
          test -z "$(git diff --name-only origin/main...HEAD -- src/lib/auth.ts src/server.ts)"
          if test -n "$(git diff --name-only origin/main...HEAD -- src/middleware/requireAuth.ts)"; then
            grep -q 'observeSessionBindingShadow' src/middleware/requireAuth.ts
            grep -q 'WOULD_DENY' src/middleware/requireAuth.ts
            ! grep -q 'SESSION_EXPIRED' src/middleware/requireAuth.ts
          fi
          ! grep -R "sendGuestSms\|Twilio\|factorType: \"SMS\"" src/auth/mfa-canary-runtime.ts src/auth/mfa-canary-flow.ts src/auth/mfa-login.routes.ts src/routes/auth.routes.ts
          grep -q 'normalized === "ENFORCE"' src/auth/mfa-canary-runtime.ts
          grep -q 'reason: "ENFORCE_BLOCKED"' src/auth/mfa-canary-runtime.ts
          grep -q 'PINGO_MFA_CANARY_USER_IDS' src/auth/mfa-canary-runtime.ts
          grep -q 'mode: "CANARY"' src/routes/auth.routes.ts
          grep -q 'FAIL_OPEN_TO_LEGACY' src/routes/auth.routes.ts
          grep -q 'deliverMfaEmailOtp' src/auth/mfa-canary-flow.ts
