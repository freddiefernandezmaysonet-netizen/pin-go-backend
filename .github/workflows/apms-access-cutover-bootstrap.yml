name: APMS Access Cutover Final Exit Bootstrap

on:
  push:
    branches:
      - agent/apms-enterprise-final-exit-access-cutover-closure

permissions:
  contents: write

jobs:
  finalize-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/apms-enterprise-final-exit-access-cutover-closure

      - name: Verify fenced base and bootstrap scope
        shell: bash
        run: |
          set -euo pipefail
          expected_base='eb696056d7fe00df66fc339176b54b1422b20423'
          test "$(git merge-base "$expected_base" HEAD)" = "$expected_base"
          test "$(git rev-list --count "$expected_base"..HEAD)" -le 2
          git diff --name-only "$expected_base"...HEAD | sort > /tmp/bootstrap-files.txt
          cat > /tmp/expected-bootstrap-files.txt <<'EOF'
          .apms-access-cutover/patches/apply-access-cutover-closure.py
          .apms-access-cutover/patches/fragments/checkin.base
          .apms-access-cutover/patches/fragments/checkin.new
          .apms-access-cutover/patches/fragments/checkout.base
          .apms-access-cutover/patches/fragments/checkout.new
          .apms-access-cutover/patches/fragments/import.base
          .apms-access-cutover/patches/fragments/import.new
          .apms-access-cutover/patches/worker-handoff-contract-check.py
          .apms-access-cutover/src/e14/guest-access-worker-integration.e14.test.ts
          .apms-access-cutover/src/services/guest-journey-access-owner-cycle.service.test.ts
          .apms-access-cutover/src/services/guest-journey-access-owner-handoff.service.ts
          .github/workflows/apms-access-cutover-bootstrap.yml
          EOF
          sort -o /tmp/expected-bootstrap-files.txt /tmp/expected-bootstrap-files.txt
          diff -u /tmp/expected-bootstrap-files.txt /tmp/bootstrap-files.txt

      - name: Apply exact Access cutover closure
        run: python .apms-access-cutover/patches/apply-access-cutover-closure.py "$GITHUB_WORKSPACE"

      - name: Certify structural ownership boundary
        run: python .apms-access-cutover/patches/worker-handoff-contract-check.py

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Certify E8 Access Owner
        run: npm run test:guest-journey-enterprise-e8-access-owner

      - name: Certify E14 worker integration
        run: node --import tsx --test src/e14/guest-access-worker-integration.e14.test.ts

      - name: Certify E3 reconciler
        run: npm run test:guest-journey-enterprise-e3-reconciler

      - name: Certify E4 coordination
        run: npm run test:guest-journey-enterprise-e4-coordination

      - name: Certify Exit Closure A policy
        run: node --import tsx --test src/services/guest-access-exit-closure-a.policy.test.ts

      - name: Verify protected source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only eb696056d7fe00df66fc339176b54b1422b20423 -- \
            prisma package.json package-lock.json \
            src/services/ttlock/ttlock.brain.ts \
            src/services/guest-journey-access-owner-adapter.service.ts \
            src/e15 | tee /tmp/protected-diff.txt
          test ! -s /tmp/protected-diff.txt

      - name: Remove bootstrap-only files
        run: |
          rm -rf .apms-access-cutover
          rm -f .github/workflows/apms-access-cutover-bootstrap.yml

      - name: Verify final source scope
        shell: bash
        run: |
          set -euo pipefail
          {
            git diff --name-only eb696056d7fe00df66fc339176b54b1422b20423
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/final-files.txt
          printf '%s\n' \
            'src/e14/guest-access-worker-integration.e14.test.ts' \
            'src/services/guest-journey-access-owner-cycle.service.test.ts' \
            'src/services/guest-journey-access-owner-handoff.service.ts' \
            'src/workers/reservation.worker.ts' \
            | sort > /tmp/expected-final-files.txt
          diff -u /tmp/expected-final-files.txt /tmp/final-files.txt

      - name: Commit certified final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/guest-journey-access-owner-handoff.service.ts \
                  src/workers/reservation.worker.ts \
                  src/services/guest-journey-access-owner-cycle.service.test.ts \
                  src/e14/guest-access-worker-integration.e14.test.ts
          git add -u .github/workflows/apms-access-cutover-bootstrap.yml .apms-access-cutover
          git commit -m 'Finalize APMS Access Cutover Closure'
          git push origin HEAD:agent/apms-enterprise-final-exit-access-cutover-closure
