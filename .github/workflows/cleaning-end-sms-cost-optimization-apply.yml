name: Cleaning End SMS Cost Optimization Apply

on:
  push:
    branches:
      - agent/cleaning-end-sms-cost-optimization-v1
    paths:
      - ".github/workflows/cleaning-end-sms-cost-optimization-apply.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cleaning-end-sms-cost-optimization-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply cleaning end SMS optimization
        run: node scripts/apply-cleaning-end-sms-cost-optimization.mjs
      - run: npm ci
      - name: Cleaning end SMS segment tests
        run: npx tsx --test src/services/cleaning-end-sms-cost-optimization.test.ts
      - name: Bundle messaging service
        run: npx esbuild src/services/messaging.service.ts --bundle --platform=node --packages=external --outfile=/tmp/messaging.service.js
      - name: Commit validated messaging change only
        run: |
          git config user.name "freddiefernandezmaysonet-netizen"
          git config user.email "freddiefernandezmaysonet@gmail.com"
          git add src/services/messaging.service.ts
          git diff --cached --check
          git commit -m "Optimize cleaning end SMS segment usage"
          git push origin HEAD:agent/cleaning-end-sms-cost-optimization-v1
