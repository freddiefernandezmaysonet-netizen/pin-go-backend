name: Channex Demo Webhook Canary Certification

on:
  pull_request:
    paths:
      - "src/scripts/run-channex-demo-webhook-canary.ts"
      - "src/scripts/run-channex-demo-webhook-canary.test.ts"
      - "src/scripts/run-channex-demo-webhook-canary.cleanup.test.ts"
      - "src/services/channex-booking-webhook-registration.service.ts"
      - "src/services/channex-booking-webhook-registration.service.test.ts"
      - ".github/workflows/channex-demo-webhook-canary-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run webhook registration and demo canary tests
        run: >-
          npx tsx --test
          src/services/channex-booking-webhook-registration.service.test.ts
          src/scripts/run-channex-demo-webhook-canary.test.ts
          src/scripts/run-channex-demo-webhook-canary.cleanup.test.ts
