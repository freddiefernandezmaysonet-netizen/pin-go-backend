name: E13 Authorized Pre-Merge Corrections

on:
  push:
    branches:
      - agent/apms-enterprise-guest-journey-e13-runtime-truth
    paths:
      - ".github/workflows/e13-authorized-premerge-fix.yml"

permissions:
  contents: write

jobs:
  correct-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingo_e13_fix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pingo_e13_fix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_e13_fix

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply the authorized E13 corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return value.replace(old, new, 1)

          # A. Shared runtime issue may recover only after every failed replica is stale/absent.
          service_path = "src/services/guest-journey-runtime-state.service.ts"
          service = read(service_path)
          helper = '''export async function isGuestJourneyRuntimeFailureRecoveryEligible(
            prisma: Pick<PrismaClient, "apmsRuntimeState">,
            identity: GuestJourneyRuntimeIdentity,
            now: Date,
            staleAfterMs: number = GUEST_JOURNEY_RUNTIME_STALE_AFTER_MS
          ): Promise<boolean> {
            const freshFrom = new Date(now.getTime() - staleAfterMs);
            const freshFailureCount = await prisma.apmsRuntimeState.count({
              where: {
                runtimeName: identity.runtimeName,
                environment: identity.environment,
                serviceName: identity.serviceName,
                lastHeartbeatAt: {
                  gte: freshFrom,
                },
                OR: [
                  {
                    status: {
                      in: [
                        ApmsRuntimeStatus.BLOCKED,
                        ApmsRuntimeStatus.ERROR,
                      ],
                    },
                  },
                  {
                    preflightStatus:
                      ApmsRuntimePreflightStatus.FAILED,
                  },
                ],
              },
            });

            return freshFailureCount === 0;
          }

          '''
          marker = "async function resolveRuntimeFailureIssue(\n"
          if marker not in service:
              raise SystemExit("runtime recovery helper insertion marker missing")
          service = service.replace(marker, helper + marker, 1)
          old_guard = '''  if (!existing || existing.workflowState === "RESOLVED") return existing;

          const issue = await upsertOperationalIssue(prisma, {
          '''
          new_guard = '''  if (!existing || existing.workflowState === "RESOLVED") return existing;

          const recoveryEligible =
            await isGuestJourneyRuntimeFailureRecoveryEligible(
              prisma,
              context.identity,
              now
            );

          if (!recoveryEligible) {
            return existing;
          }

          const issue = await upsertOperationalIssue(prisma, {
          '''
          service = replace_once(service, old_guard, new_guard, "runtime recovery guard")
          write(service_path, service)

          # Unit coverage for fresh-vs-stale failed replicas.
          service_test_path = "src/services/guest-journey-runtime-state.service.test.ts"
          service_test = read(service_test_path)
          service_test = replace_once(
              service_test,
              '''  initializeGuestJourneyRuntimeState,
            isGuestJourneyRuntimeScopeMatch,
            recordGuestJourneyRuntimeHeartbeat,
          ''',
              '''  initializeGuestJourneyRuntimeState,
            isGuestJourneyRuntimeFailureRecoveryEligible,
            isGuestJourneyRuntimeScopeMatch,
            recordGuestJourneyRuntimeHeartbeat,
          ''',
              "runtime test import",
          )
          service_test += '''

          test("E13 shared runtime issue recovers only after all failed replicas are stale or absent", async () => {
            const queries: any[] = [];
            let freshFailureCount = 1;
            const prisma = {
              apmsRuntimeState: {
                async count(args: any) {
                  queries.push(args);
                  return freshFailureCount;
                },
              },
            } as unknown as PrismaClient;
            const now = new Date("2026-08-25T12:00:00.000Z");
            const identity = buildGuestJourneyRuntimeIdentity(
              {
                NODE_ENV: "test",
                RAILWAY_SERVICE_NAME: "reservation-worker",
              },
              "boot-recovery"
            );

            assert.equal(
              await isGuestJourneyRuntimeFailureRecoveryEligible(
                prisma,
                identity,
                now
              ),
              false
            );

            freshFailureCount = 0;
            assert.equal(
              await isGuestJourneyRuntimeFailureRecoveryEligible(
                prisma,
                identity,
                now
              ),
              true
            );

            assert.equal(queries.length, 2);
            assert.equal(
              queries[0].where.runtimeName,
              "GUEST_JOURNEY"
            );
            assert.equal(
              queries[0].where.environment,
              "test"
            );
            assert.equal(
              queries[0].where.serviceName,
              "reservation-worker"
            );
            assert.equal(
              queries[0].where.lastHeartbeatAt.gte.toISOString(),
              "2026-08-25T11:59:00.000Z"
            );
            assert.deepEqual(
              queries[0].where.OR,
              [
                {
                  status: {
                    in: [
                      ApmsRuntimeStatus.BLOCKED,
                      ApmsRuntimeStatus.ERROR,
                    ],
                  },
                },
                {
                  preflightStatus:
                    ApmsRuntimePreflightStatus.FAILED,
                },
              ]
            );
          });
          '''
          write(service_test_path, service_test)

          # B. The E13 status/preflight write is the only authoritative worker heartbeat.
          worker_path = "src/workers/reservation.worker.ts"
          worker = read(worker_path)
          worker = replace_once(
              worker,
              '''  evaluateGuestJourneyRuntimeTick,
            initializeGuestJourneyRuntimeState,
            recordGuestJourneyRuntimeHeartbeat,
            type GuestJourneyRuntimeContext,
          ''',
              '''  evaluateGuestJourneyRuntimeTick,
            initializeGuestJourneyRuntimeState,
            type GuestJourneyRuntimeContext,
          ''',
              "worker heartbeat import",
          )
          heartbeat_start = worker.find(
              '''    if (guestJourneyRuntimeContext) {
                try {
                  const heartbeatPersisted =
                    await recordGuestJourneyRuntimeHeartbeat(
          ''')
          if heartbeat_start < 0:
              raise SystemExit("worker pre-gate heartbeat block start missing")
          heartbeat_end_marker = '''    try {
                await processPasscodeResyncs(now);
          '''
          heartbeat_end = worker.find(heartbeat_end_marker, heartbeat_start)
          if heartbeat_end < 0:
              raise SystemExit("worker pre-gate heartbeat block end missing")
          worker = worker[:heartbeat_start] + worker[heartbeat_end:]
          write(worker_path, worker)

          # C. Stale runtime-generated issues remain evidence but do not override current PAUSED health.
          health_path = "src/apms/mission-control-runtime-health.e13.ts"
          health = read(health_path)
          old_health_block = '''  const runtimeFailure = freshRuntimes.some(
              (runtime) =>
                runtime.status === "BLOCKED" ||
                runtime.status === "ERROR" ||
                runtime.preflightStatus === "FAILED"
            );
            const hasCriticalIssue =
              input.allVisibilityCurrentIssues.some(
                (issue) =>
                  issue.workflowState !== "RESOLVED" &&
                  issue.severity === "CRITICAL"
              );
            const hasHostAction =
              input.allVisibilityCurrentIssues.some(
                (issue) =>
                  issue.workflowState ===
                    "ACTION_REQUIRED" &&
                  issue.visibility === "HOST" &&
                  issue.actionRequired === true
              );
          '''
          new_health_block = '''  const runtimeFailure = freshRuntimes.some(
              (runtime) =>
                runtime.status === "BLOCKED" ||
                runtime.status === "ERROR" ||
                runtime.preflightStatus === "FAILED"
            );
            const currentHealthIssues =
              input.allVisibilityCurrentIssues.filter(
                (issue) => {
                  const runtimeFailureIssue =
                    issue.issueCode ===
                      "GUEST_JOURNEY_RUNTIME_BLOCKED" &&
                    issue.engine === "GUEST_JOURNEY";

                  return !runtimeFailureIssue || runtimeFailure;
                }
              );
            const hasCriticalIssue =
              currentHealthIssues.some(
                (issue) =>
                  issue.workflowState !== "RESOLVED" &&
                  issue.severity === "CRITICAL"
              );
            const hasHostAction =
              currentHealthIssues.some(
                (issue) =>
                  issue.workflowState ===
                    "ACTION_REQUIRED" &&
                  issue.visibility === "HOST" &&
                  issue.actionRequired === true
              );
          '''
          health = replace_once(health, old_health_block, new_health_block, "native health issue filtering")
          health = replace_once(
              health,
              '''  const issueHealth = projectCurrentIssueHealth(
              input.allVisibilityCurrentIssues
            );
          ''',
              '''  const issueHealth = projectCurrentIssueHealth(
              currentHealthIssues
            );
          ''',
              "native health projection input",
          )
          write(health_path, health)

          health_test_path = "src/apms/mission-control-runtime-health.e13.test.ts"
          health_test = read(health_test_path)
          health_test += '''

          test("E13 stale runtime issue preserves evidence but current health becomes PAUSED", () => {
            const result = derive({
              runtimeRows: [
                runtime({
                  lastHeartbeatAt: new Date(
                    NOW.getTime() - 61_000
                  ),
                }),
              ],
              issues: [
                issue({
                  issueCode:
                    "GUEST_JOURNEY_RUNTIME_BLOCKED",
                  visibility: "DEVELOPER",
                  severity: "CRITICAL",
                  workflowState:
                    "ACTION_REQUIRED",
                  actionRequired: true,
                  canAutoResolve: false,
                  autoResolveStatus:
                    "NOT_SUPPORTED",
                }),
              ],
            });

            assert.equal(result.autopilotStatus, "PAUSED");
            assert.equal(
              result.engineHealth.find(
                (entry) =>
                  entry.engine === "GUEST_JOURNEY"
              )?.status,
              "WARNING"
            );
          });

          test("E13 fresh failed runtime and its durable issue remain ERROR", () => {
            const result = derive({
              runtimeRows: [
                runtime({
                  status: "BLOCKED",
                  preflightStatus: "FAILED",
                }),
              ],
              issues: [
                issue({
                  issueCode:
                    "GUEST_JOURNEY_RUNTIME_BLOCKED",
                  visibility: "DEVELOPER",
                  severity: "CRITICAL",
                  workflowState:
                    "ACTION_REQUIRED",
                  actionRequired: true,
                  canAutoResolve: false,
                  autoResolveStatus:
                    "NOT_SUPPORTED",
                }),
              ],
            });

            assert.equal(result.autopilotStatus, "ERROR");
            assert.equal(
              result.engineHealth.find(
                (entry) =>
                  entry.engine === "GUEST_JOURNEY"
              )?.status,
              "ERROR"
            );
          });
          '''
          write(health_test_path, health_test)

          # Pin worker heartbeat ordering, shared recovery, stale issue handling, and real ephemeral migration deployment.
          contract_path = "src/services/guest-journey-e13-runtime-truth.contract.test.ts"
          contract = read(contract_path)
          contract = replace_once(
              contract,
              '''const workflow = source(
            "../../.github/workflows/guest-journey-enterprise-e13-certification.yml"
          );
          ''',
              '''const workflow = source(
            "../../.github/workflows/guest-journey-enterprise-e13-certification.yml"
          );
          const e1Workflow = source(
            "../../.github/workflows/guest-journey-enterprise-e1-certification.yml"
          );
          ''',
              "contract E1 workflow source",
          )
          contract = replace_once(
              contract,
              '''  assert.match(
              worker,
              /evaluateGuestJourneyRuntimeTick\\(/
            );
            assert.doesNotMatch(
          ''',
              '''  assert.match(
              worker,
              /evaluateGuestJourneyRuntimeTick\\(/
            );
            assert.doesNotMatch(
              worker,
              /recordGuestJourneyRuntimeHeartbeat/
            );
            assert.doesNotMatch(
          ''',
              "contract heartbeat order",
          )
          contract = replace_once(
              contract,
              '''  assert.doesNotMatch(
              workflow,
              /migrate deploy|migrate dev|db push|TTLock|Stripe|Twilio|Channex/i
            );
          });
          ''',
              '''  assert.doesNotMatch(
              workflow,
              /migrate deploy|migrate dev|db push|TTLock|Stripe|Twilio|Channex/i
            );
            assert.match(
              e1Workflow,
              /npx prisma migrate deploy --schema prisma\\/schema\\.prisma/
            );
            assert.doesNotMatch(
              e1Workflow,
              /Validate E13 migration history without applying migrations/
            );
          });
          ''',
              "contract ephemeral migration history",
          )
          write(contract_path, contract)

          # D. Run the complete migration history against the E1 ephemeral PostgreSQL service.
          e1_path = ".github/workflows/guest-journey-enterprise-e1-certification.yml"
          e1 = read(e1_path)
          e1 = replace_once(
              e1,
              '''      - name: Apply complete migration history to empty PostgreSQL
                  if: github.head_ref != 'agent/apms-enterprise-guest-journey-e13-runtime-truth' && github.ref_name != 'agent/apms-enterprise-guest-journey-e13-runtime-truth'
                  run: npx prisma migrate deploy --schema prisma/schema.prisma

                - name: Validate E13 migration history without applying migrations
                  if: github.head_ref == 'agent/apms-enterprise-guest-journey-e13-runtime-truth' || github.ref_name == 'agent/apms-enterprise-guest-journey-e13-runtime-truth'
                  run: >-
                    npx prisma migrate diff
                    --from-empty
                    --to-schema-datamodel prisma/schema.prisma
                    --script
          ''',
              '''      - name: Apply complete migration history to empty PostgreSQL
                  run: npx prisma migrate deploy --schema prisma/schema.prisma
          ''',
              "E1 full migration history",
          )
          write(e1_path, e1)

          # Remove this one-shot workflow before committing the final correction.
          Path(".github/workflows/e13-authorized-premerge-fix.yml").unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma without production access
        run: |
          npx prisma generate --schema prisma/schema.prisma
          npx prisma validate --schema prisma/schema.prisma

      - name: Apply complete migration history to empty ephemeral PostgreSQL
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Certify E13 and regress E1 through E12
        run: |
          npm run test:guest-journey-enterprise-e13-runtime-truth
          npm run test:guest-journey-enterprise-contract
          npm run test:guest-journey-enterprise-e2-shadow
          npm run test:guest-journey-enterprise-e3-reconciler
          npm run test:guest-journey-enterprise-e4-coordination
          npm run test:guest-journey-enterprise-e5-owner-runtime
          npm run test:guest-journey-enterprise-e6-mission-control
          npm run test:guest-journey-enterprise-e7-communications
          npm run test:guest-journey-enterprise-e8-access-owner
          npm run test:guest-journey-enterprise-e9-financial-owner
          npm run test:guest-journey-enterprise-e10-compliance-owner
          npm run test:guest-journey-enterprise-e11-activation-control-plane
          npm run test:guest-journey-enterprise-e12-runtime-enforcement
          npm run test:canonical-operational-contract

      - name: Bundle worker and API wiring
        run: |
          npx esbuild src/workers/reservation.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/reservation.worker.e13-fix.js
          npx esbuild src/server.ts --bundle --platform=node --packages=external --outfile=/tmp/server.e13-fix.js

      - name: Patch integrity
        run: git diff --check

      - name: Commit and publish the authorized correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E13 harden multi-replica runtime truth"
          git push origin HEAD:${{ github.ref_name }}
