name: Apply Guest Journey Worker Integration

on:
  push:
    branches:
      - agent/mission-control-engine-readiness-v1-backend
    paths:
      - ".github/workflows/apply-guest-journey-worker-integration.yml"

permissions:
  contents: write

concurrency:
  group: apply-guest-journey-worker-integration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/mission-control-engine-readiness-v1-backend
          fetch-depth: 0

      - name: Verify expected worker and apply exact patch
        shell: bash
        run: |
          set -euo pipefail

          expected_worker_blob="bc642aaaa624473f6562ab4fdb694520edabe377"
          actual_worker_blob="$(git hash-object src/workers/reservation.worker.ts)"

          if [[ "$actual_worker_blob" != "$expected_worker_blob" ]]; then
            echo "reservation.worker.ts changed concurrently: expected $expected_worker_blob, got $actual_worker_blob" >&2
            exit 1
          fi

          python <<'PY'
          from pathlib import Path

          path = Path("src/workers/reservation.worker.ts")
          text = path.read_text()

          import_marker = '''import {
            markGuestJourneyReadyForArrival,
            scheduleGuestJourneyAccess,
          } from "../services/guest-journey.service";
          '''

          import_replacement = import_marker + '''import {
            reconcileGuestJourneyOperationalIssues,
          } from "../services/guest-journey-operational.service";
          '''

          config_marker = '''const REMINDER_HOURS = Number(
            process.env.GUEST_LINK_REMINDER_HOURS ??
              24
          );
          '''

          config_replacement = config_marker + '''
          const GUEST_JOURNEY_OPERATIONAL_SYNC_MS = Math.max(
            60_000,
            Number(
              process.env.GUEST_JOURNEY_OPERATIONAL_SYNC_MS ??
                5 * 60 * 1000
            ) || 5 * 60 * 1000
          );

          let nextGuestJourneyOperationalSyncAt = 0;
          '''

          error_marker = '''function toErrString(e: unknown) {
            if (e instanceof Error) return `${e.name}: ${e.message}\\n${e.stack ?? ''}`.trim();
            return String(e);
          }
          '''

          error_replacement = error_marker + '''
          async function processGuestJourneyOperationalState(
            now: Date
          ) {
            if (
              now.getTime() <
              nextGuestJourneyOperationalSyncAt
            ) {
              return;
            }

            nextGuestJourneyOperationalSyncAt =
              now.getTime() +
              GUEST_JOURNEY_OPERATIONAL_SYNC_MS;

            try {
              const result =
                await reconcileGuestJourneyOperationalIssues(
                  prisma,
                  now
                );

              if (
                result.processed > 0 ||
                result.failed > 0
              ) {
                log(
                  "Guest Journey operational reconciliation",
                  result
                );
              }
            } catch (error) {
              nextGuestJourneyOperationalSyncAt =
                now.getTime() + 60_000;

              errLog(
                "Guest Journey operational reconciliation FAILED",
                {
                  error: toErrString(error),
                }
              );
            }
          }
          '''

          tick_marker = '''        await processGuestVerificationReminders(
                  tickNow
                );
                await retryPendingNfcSync(prisma);
          '''

          tick_replacement = '''        await processGuestVerificationReminders(
                  tickNow
                );
                await processGuestJourneyOperationalState(
                  tickNow
                );
                await retryPendingNfcSync(prisma);
          '''

          replacements = [
              ("guest journey import", import_marker, import_replacement),
              ("guest journey cadence", config_marker, config_replacement),
              ("guest journey reconciler", error_marker, error_replacement),
              ("guest journey tick call", tick_marker, tick_replacement),
          ]

          for label, marker, replacement in replacements:
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one {label} marker, found {count}"
                  )
              text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY

          git diff --check

          changed_files="$(git diff --name-only)"
          if [[ "$changed_files" != "src/workers/reservation.worker.ts" ]]; then
            echo "Unexpected changed files:" >&2
            echo "$changed_files" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pingo

      - name: Compile patched worker
        run: |
          npx --yes esbuild@0.28.1 src/workers/reservation.worker.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --target=node22 \
            --packages=external \
            --log-level=warning \
            --outfile=/tmp/reservation-worker.mjs

      - name: Run Guest Journey certification
        run: |
          npx tsx --test \
            src/services/__tests__/guest-journey-operational.test.ts

      - name: Verify branch did not advance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/mission-control-engine-readiness-v1-backend

          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/agent/mission-control-engine-readiness-v1-backend)" ]]; then
            echo "Branch advanced while patch was running; refusing to commit." >&2
            exit 1
          fi

      - name: Commit worker integration only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/workers/reservation.worker.ts

          staged_files="$(git diff --cached --name-only)"
          if [[ "$staged_files" != "src/workers/reservation.worker.ts" ]]; then
            echo "Unexpected staged files:" >&2
            echo "$staged_files" >&2
            exit 1
          fi

          git commit -m "feat: schedule guest journey reconciliation"
          git push origin HEAD:agent/mission-control-engine-readiness-v1-backend

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-guest-journey-worker-integration.yml
          git add .github/workflows/apply-guest-journey-worker-integration.yml
          git commit -m "chore: remove guest journey patch workflow"
          git push origin HEAD:agent/mission-control-engine-readiness-v1-backend
