name: Sales Voice Signed SIP Webhook Mount V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server.ts'
      - '.github/workflows/sales-voice-main-integration-certification.yml'
      - 'src/services/sales-voice-live-ingress-admission.service.ts'
      - 'src/services/sales-voice-live-ingress-admission.service.test.ts'
      - 'src/services/sales-voice-live-sip-mount.service.ts'
      - 'src/services/sales-voice-live-sip-mount.service.test.ts'
      - '.github/workflows/sales-voice-live-sip-mount-v1.yml'
      - 'scripts/verify-host-notification-inbox-scope.mjs'
      - 'scripts/verify-host-notification-inbox-scope.test.mjs'

permissions:
  contents: read

jobs:
  certify:
    name: Verify disabled commercial webhook and exact signed payload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/dummy_no_connection
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Enforce exact five-file integration scope
        run: |
          if [ "${GITHUB_HEAD_REF:-}" = "agent/host-notification-inbox-20261018" ]; then
            node --test scripts/verify-host-notification-inbox-scope.test.mjs
            node scripts/verify-host-notification-inbox-scope.mjs
          elif [ "${GITHUB_HEAD_REF:-}" = "agent/host-mobile-operations-20261016" ]; then
