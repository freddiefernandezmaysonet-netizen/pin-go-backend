name: Public Stay Search V2 certification

on:
  pull_request:
    branches:
      - agent/booking-public-stay-search-staging
    paths:
      - "src/services/public-stay-search.service.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20260923152500_add_property_listing_details_v1/migration.sql"
      - "prisma/migrations/20260924131500_add_listing_property_type/migration.sql"
      - "prisma/migrations/20260924133000_add_listing_features_v1/migration.sql"
      - "src/services/public-stay-search.service.test.ts"
      - "src/booking-search.staging.server.ts"
      - "src/booking-search.staging.server.contract.test.ts"
      - "src/booking-search.preview.html"
      - "src/booking-search.preview.contract.test.ts"
      - ".github/workflows/public-stay-search-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pingo_schema_validation
        run: npx prisma validate
      - name: Run focused search tests
        run: node --import tsx --test src/services/public-stay-search.service.test.ts src/booking-search.staging.server.contract.test.ts src/booking-search.preview.contract.test.ts
      - name: Compile and import focused search surface
        run: node --import tsx -e "await import('./src/services/public-stay-search.service.ts')"
