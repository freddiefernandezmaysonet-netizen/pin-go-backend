name: SMS Financial Telemetry Segment-Aware Apply

on:
  push:
    branches:
      - agent/sms-financial-telemetry-segment-aware-v1
    paths:
      - ".github/workflows/sms-financial-telemetry-segment-aware-apply.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sms-financial-telemetry-segment-aware-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply SMS financial telemetry patch
        run: node scripts/apply-sms-financial-telemetry-segment-aware.mjs
      - run: npm ci
      - name: SMS telemetry tests
        run: npx tsx --test src/services/sms-financial-telemetry.test.ts src/services/sms-financial-routes.contract.test.ts
      - name: Bundle SMS telemetry service
        run: npx esbuild src/services/sms-financial-telemetry.service.ts --bundle --platform=node --packages=external --outfile=/tmp/sms-financial-telemetry.service.js
      - name: Bundle financial route
        run: npx esbuild src/routes/financial.routes.ts --bundle --platform=node --packages=external --outfile=/tmp/financial.routes.js
      - name: Bundle admin financial route
        run: npx esbuild src/routes/admin.financial.routes.ts --bundle --platform=node --packages=external --outfile=/tmp/admin.financial.routes.js
      - name: Commit validated route changes only
        run: |
          git config user.name "freddiefernandezmaysonet-netizen"
          git config user.email "freddiefernandezmaysonet@gmail.com"
          git add src/routes/financial.routes.ts src/routes/admin.financial.routes.ts
          git diff --cached --check
          git commit -m "Make SMS financial telemetry segment-aware"
          git push origin HEAD:agent/sms-financial-telemetry-segment-aware-v1
