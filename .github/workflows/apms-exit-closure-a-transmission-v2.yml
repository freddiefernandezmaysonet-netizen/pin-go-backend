name: APMS Exit Closure A Transmission

on:
  push:
    branches:
      - agent/apms-exit-closure-a-canonical-access-ambiguity-handoff
    paths:
      - ".github/workflows/apms-exit-closure-a-transmission-v2.yml"

permissions:
  contents: write

jobs:
  certify-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apms-exit-closure-a-canonical-access-ambiguity-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact authorized ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base bca95e59c7ade23eea3c18acb40c946a6c602ed1 HEAD)" = "bca95e59c7ade23eea3c18acb40c946a6c602ed1"
          git merge-base --is-ancestor bca95e59c7ade23eea3c18acb40c946a6c602ed1 HEAD
      - name: Apply deterministic Closure A integration
        run: python scripts/patch-apms-exit-closure-a.py
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - name: Closure A focused contracts
        run: node --import tsx --test src/services/guest-access-exit-closure-a.policy.test.ts src/services/guest-access-exit-closure-a.mission-control.test.ts
      - name: Access Owner regression
        run: npm run test:guest-journey-enterprise-e8-access-owner
      - name: E14 admission and singleton regression
        run: |
          node --import tsx --test src/e14/guest-access-reservation-target.e14.test.ts src/e14/guest-access-admission-fence.e14.test.ts src/e14/guest-access-reservation-singleton-fence.e14.test.ts src/e14/guest-access-readiness-mission-control.e14.test.ts src/e14/guest-access-e14-structural.e14.test.ts src/e14/guest-access-worker-integration.e14.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-e14.json
      - name: E15 and E15.1 reconciliation regression
        run: |
          node --import tsx --test src/e15/guest-access-ambiguity-reconciliation.e15.test.ts src/e15/guest-access-reservation-reconciliation-fence.e15-1.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-e15.json
      - name: Runtime Truth and tenant scope regressions
        run: |
          npm run test:guest-journey-enterprise-e13-runtime-truth
          node --import tsx --test src/services/guest-journey-tenant-property-scope.policy.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-tenant-scope.json
      - name: Canonical boundary structural gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          adapter = Path('src/services/guest-journey-access-owner-adapter.service.ts').read_text()
          e14 = Path('src/e14/guest-access-admission-fence.single-grant.e14.ts').read_text()
          e15 = Path('src/e15/guest-access-ambiguity-reconciliation.e15.ts').read_text()
          fence = Path('src/e15/guest-access-reservation-reconciliation-fence.e15-1.ts').read_text()
          required = ['executeGuestAccessProvisioningWithFence','buildGuestJourneyAccessOwnerE14OwnerId','executePhysical: () => dependencies.activate(grant.id)','GUEST_ACCESS_PROVISION_AMBIGUOUS:LATE_PROVIDER_SUCCESS_REQUIRES_E15','reconcileLateProviderSuccessUnderReservationFenceE15_1','quarantineActiveProviderOutcomeUnderReservationFenceE15_1','FROM "Reservation" WHERE "id" = $1 FOR UPDATE','FROM "AccessGrant" WHERE "reservationId" = $1 ORDER BY "id" FOR UPDATE','isolationLevel: "Serializable"']
          combined = '\n'.join([adapter, e14, e15, fence])
          missing = [item for item in required if item not in combined]
          if missing: raise SystemExit(f'CLOSURE_A_REQUIRED_BOUNDARY_MISSING:{missing}')
          if 'method: "GET"' not in e15 or '/v3/lock/listKeyboardPwd' not in e15: raise SystemExit('CLOSURE_A_E15_READ_ONLY_PROVIDER_BOUNDARY_MISSING')
          for forbidden in ['method: "POST"','method: "PUT"','method: "PATCH"','method: "DELETE"']:
            if forbidden in e15: raise SystemExit(f'CLOSURE_A_E15_PROVIDER_MUTATION_PRESENT:{forbidden}')
          PY
      - name: Worker bundle
        run: npx esbuild src/workers/reservation.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/reservation.worker.closure-a.js
      - name: Schema and patch boundaries
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/pin_go_closure_a_schema_validation' npx prisma validate --schema prisma/schema.prisma
          git diff --check
          git diff --check bca95e59c7ade23eea3c18acb40c946a6c602ed1 --
          test -z "$(git diff --name-only bca95e59c7ade23eea3c18acb40c946a6c602ed1 -- | grep -E '^prisma/migrations/|^prisma/schema\.prisma$|^package(-lock)?\.json$|^src/services/ttlock/|^src/ttlock/' || true)"
      - name: Commit certified Closure A source integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/guest-journey-access-owner-adapter.service.ts
          git add src/services/guest-journey-access-owner-adapter.service.test.ts
          git add src/services/guest-journey-access-owner-mission-control.service.ts
          git add src/services/guest-journey-access-owner-cycle.service.ts
          git add src/e14/guest-access-admission-fence.single-grant.e14.ts
          git add src/e14/guest-access-admission-safety-cycle.e14.ts
          git add src/e14/guest-access-readiness-mission-control.policy.e14.ts
          git add src/e14/guest-access-readiness-mission-control.service.e14.ts
          git add src/workers/reservation.worker.ts
          git add src/e15/guest-access-ambiguity-reconciliation.e15.ts
          git add src/e15/guest-access-reservation-reconciliation-fence.e15-1.ts
          git add src/e15/guest-access-reservation-reconciliation-fence.e15-1.test.ts
          git diff --cached --check
          git commit -m 'Integrate APMS Exit Closure A access ambiguity handoff'
          git push origin HEAD:agent/apms-exit-closure-a-canonical-access-ambiguity-handoff
