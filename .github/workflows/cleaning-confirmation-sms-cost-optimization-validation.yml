name: Cleaning Confirmation SMS Cost Optimization Validation

on:
  push:
    branches:
      - agent/cleaning-confirmation-sms-cost-optimization-v1
    paths:
      - ".github/workflows/cleaning-confirmation-sms-cost-optimization-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cleaning confirmation SMS segment tests
        run: npx tsx --test src/services/cleaning-confirmation-sms-cost-optimization.test.ts
      - name: Bundle cleaning confirmation SMS builder
        run: npx esbuild src/services/cleaning-confirmation-sms-body.service.ts --bundle --platform=node --packages=external --outfile=/tmp/cleaning-confirmation-sms-body.service.js
      - name: Bundle cleaning confirmation dispatch service
        run: npx esbuild src/services/cleaning-confirmation-dispatch.service.ts --bundle --platform=node --packages=external --outfile=/tmp/cleaning-confirmation-dispatch.service.js
