name: OTA Airbnb Post-Authorization Canary

on:
  push:
    branches:
      - agent/ota-airbnb-post-auth-canary-runner
  pull_request:
    paths:
      - 'src/distribution/airbnb-post-auth-canary.runner.ts'
      - 'src/distribution/airbnb-post-auth-canary.runner.test.ts'
      - 'scripts/airbnb-post-auth-mapping-canary.ts'
      - 'tsconfig.ota-airbnb-post-auth-canary.json'
      - '.github/workflows/ota-airbnb-post-auth-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope guard
        shell: bash
        run: |
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              src/distribution/airbnb-post-auth-canary.runner.ts|\
              src/distribution/airbnb-post-auth-canary.runner.test.ts|\
              scripts/airbnb-post-auth-mapping-canary.ts|\
              tsconfig.ota-airbnb-post-auth-canary.json|\
              .github/workflows/ota-airbnb-post-auth-canary.yml)
                ;;
              *)
                echo "OUT_OF_SCOPE_FILE=$path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck isolated canary
        run: npx tsc -p tsconfig.ota-airbnb-post-auth-canary.json

      - name: Run isolated canary tests
        run: npx tsx --test src/distribution/airbnb-post-auth-canary.runner.test.ts
