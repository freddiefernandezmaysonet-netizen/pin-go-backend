name: Channex Airbnb Access V1
on:
  pull_request:
    paths:
      - 'src/channex-messaging/airbnb-access*'
      - 'src/services/airbnb-access-routing.test.ts'
      - 'src/services/*communications*'
      - 'src/services/email-delivery.service.ts'
      - 'src/services/messaging.service.ts'
      - 'src/services/preCheckinSms.service.ts'
      - 'src/services/checkoutSms.service.ts'
      - 'src/services/guestLinkSms.service.ts'
      - 'src/workers/reservation.worker.ts'
      - 'src/workers/message.retry.worker.ts'
      - 'src/routes/dashboard.messages.routes.ts'
      - '.github/workflows/channex-airbnb-access-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema ./prisma
      - run: npx tsc -p tsconfig.channex-host-inbox.json
      - run: npx tsc -p tsconfig.channex-guest-registration.json
      - run: node --import tsx src/channex-messaging/airbnb-access.test.ts
      - run: node --import tsx src/services/airbnb-access-routing.test.ts
      - run: >-
          node --import tsx --test
          src/services/guest-journey-access-communications-outbox.service.test.ts
          src/services/guest-journey-communications-delivery-adapter.service.test.ts
          src/services/guest-registration-channel.integration.test.ts
          src/services/messaging.guest-passcode-sms-cost-optimization.test.ts
      - run: npx esbuild src/server.ts src/workers/reservation.worker.ts src/workers/message.retry.worker.ts --bundle --platform=node --packages=external --format=esm --outdir=/tmp/airbnb-access-build
