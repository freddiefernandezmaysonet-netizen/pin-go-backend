name: Pin AI Host Incident Foundation V1
on:
  pull_request:
    branches: [main]
    paths:
      - "src/pin-ai/**"
      - "src/routes/dashboard.pin-ai-host-incidents.routes.ts"
      - "src/server.ts"
      - "src/apms/operational-intelligence*"
      - "prisma/**"
      - "tsconfig.pin-ai-host-incidents.json"
      - ".github/workflows/pin-ai-host-incidents-v1.yml"
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: host_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: pin_ai_host_incident_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U host_test -d pin_ai_host_incident_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://host_test:synthetic_test_password@localhost:5432/pin_ai_host_incident_test
      PIN_AI_HOST_INCIDENT_DB_TEST: "true"
      NODE_ENV: test
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate migration against isolated base schema
        run: |
          git show "$BASE_SHA:prisma/schema.prisma" > /tmp/pin-ai-host-base.prisma
          npx prisma db push --schema /tmp/pin-ai-host-base.prisma --skip-generate
          migration=prisma/migrations/20260927180000_pin_ai_host_incident_threads/migration.sql
          if ! git cat-file -e "$BASE_SHA:$migration" 2>/dev/null; then
            npx prisma db execute --file "$migration" --schema prisma/schema.prisma
          fi
          migration=prisma/migrations/20261001110000_property_stay_time_settings_v1/migration.sql
          if ! git cat-file -e "$BASE_SHA:$migration" 2>/dev/null; then
            npx prisma db execute --file "$migration" --schema prisma/schema.prisma
          fi
          # The base schema predates additive Property fields introduced by this PR.
          sitemap_migration=prisma/migrations/20261002130000_property_test_classification/migration.sql
          if [ -f "$sitemap_migration" ] && ! git cat-file -e "$BASE_SHA:$sitemap_migration" 2>/dev/null; then
            npx prisma db execute --file "$sitemap_migration" --schema prisma/schema.prisma
          fi
          npx prisma generate
      - name: Host foundation unit and PostgreSQL API tests
        run: node --import tsx --test src/pin-ai/host/*.test.ts
      - name: Strict typecheck and emitted build
        run: |
          npx tsc -p tsconfig.pin-ai-host-incidents.json
          npx tsc -p tsconfig.pin-ai-host-incidents.json --noEmit false --outDir /tmp/host-incident-build
      - name: Existing guest runtime and incident regression tests
        run: |
          npm run test:pin-ai-runtime
          node --import tsx --test src/pin-ai/guest/guest-incident.test.ts src/pin-ai/runtime/guest-incident-runtime.test.ts
