name: E15.1 Reservation Reconciliation Transmission

on:
  push:
    branches:
      - agent/apms-enterprise-guest-journey-e15-1-reservation-reconciliation-fence
    paths:
      - ".github/workflows/e15-1-reservation-reconciliation-transmission.yml"

permissions:
  contents: write

jobs:
  certify-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apms-enterprise-guest-journey-e15-1-reservation-reconciliation-fence
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact authorized ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 4c640a1340623066fedbd5b447b073ac18822e73 HEAD)" = "4c640a1340623066fedbd5b447b073ac18822e73"
          git merge-base --is-ancestor 4c640a1340623066fedbd5b447b073ac18822e73 HEAD

      - name: Apply deterministic E15.1 source integration
        run: |
          python scripts/patch-e15-1-helper-cleanup.py
          python scripts/patch-e15-1-reservation-reconciliation.py
          git checkout -- .github/workflows/guest-journey-enterprise-e15-certification.yml

      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma

      - name: E15 and E15.1 focused contract
        run: |
          node --import tsx --test src/e15/guest-access-ambiguity-reconciliation.e15.test.ts src/e15/guest-access-reservation-reconciliation-fence.e15-1.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-e15.json

      - name: Access Owner and Runtime Truth regressions
        run: |
          npm run test:guest-journey-enterprise-e8-access-owner
          npm run test:guest-journey-enterprise-e13-runtime-truth

      - name: E14 admission and singleton regressions
        run: |
          node --import tsx --test src/e14/guest-access-reservation-target.e14.test.ts src/e14/guest-access-admission-fence.e14.test.ts src/e14/guest-access-reservation-singleton-fence.e14.test.ts src/e14/guest-access-readiness-mission-control.e14.test.ts src/e14/guest-access-e14-structural.e14.test.ts src/e14/guest-access-worker-integration.e14.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-e14.json

      - name: Hierarchical tenant scope regression
        run: |
          node --import tsx --test src/services/guest-journey-tenant-property-scope.policy.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-tenant-scope.json

      - name: Provider read-only and reservation-fence structural gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = "\n".join(
              path.read_text(encoding="utf-8")
              for path in sorted(Path("src/e15").glob("*.ts"))
          )
          forbidden = [
              "activateGrant",
              "deactivateGrant",
              "ttlockGetPasscode",
              "ttlockCreatePasscode",
              "ttlockChangePasscode",
              "ttlockDeletePasscode",
              "/keyboardPwd/add",
              "/keyboardPwd/change",
              "/keyboardPwd/delete",
              'method: "POST"',
              'method: "PUT"',
              'method: "PATCH"',
              'method: "DELETE"',
          ]
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit(f"E15_1_PROVIDER_MUTATION_SYMBOLS_PRESENT:{found}")
          reader = Path("src/e15/guest-access-ambiguity-reconciliation.e15.ts").read_text(encoding="utf-8")
          if 'method: "GET"' not in reader or "/v3/lock/listKeyboardPwd" not in reader:
              raise SystemExit("E15_1_READ_ONLY_PROVIDER_BOUNDARY_MISSING")
          fence = Path("src/e15/guest-access-reservation-reconciliation-fence.e15-1.ts").read_text(encoding="utf-8")
          required = [
              'FROM "Reservation" WHERE "id" = $1 FOR UPDATE',
              'FROM "AccessGrant" WHERE "reservationId" = $1 ORDER BY "id" FOR UPDATE',
              'isolationLevel: "Serializable"',
              'GUEST_ACCESS_E15_1_RESERVATION_RELEASE_CAS_LOST',
          ]
          missing = [item for item in required if item not in fence]
          if missing:
              raise SystemExit(f"E15_1_RESERVATION_FENCE_MISSING:{missing}")
          PY

      - name: Worker bundle
        run: |
          npx esbuild src/workers/reservation.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/reservation.worker.e15-1.js

      - name: Schema and patch integrity
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/pin_go_e15_1_schema_validation' npx prisma validate --schema prisma/schema.prisma
          git diff --check
          git diff --check 4c640a1340623066fedbd5b447b073ac18822e73 --
          test -z "$(git diff --name-only 4c640a1340623066fedbd5b447b073ac18822e73 -- | grep -E '^prisma/migrations/|^prisma/schema\.prisma$|^package(-lock)?\.json$|^src/workers/reservation\.worker\.ts$|^src/e14/' || true)"

      - name: Verify source-transport inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
            '.github/workflows/e15-1-reservation-reconciliation-transmission.yml',
            'scripts/patch-e15-1-helper-cleanup.py',
            'scripts/patch-e15-1-reservation-reconciliation.py',
            'src/e15/guest-access-ambiguity-reconciliation.e15.ts',
            'src/e15/guest-access-reservation-reconciliation-fence.e15-1.ts',
            'src/e15/guest-access-reservation-reconciliation-fence.e15-1.test.ts',
          }
          actual = set(subprocess.check_output([
            'git','diff','--name-only','4c640a1340623066fedbd5b447b073ac18822e73','--'
          ], text=True).splitlines())
          if actual != expected:
            raise SystemExit(f'E15_1_SOURCE_INVENTORY_MISMATCH expected={sorted(expected)} actual={sorted(actual)}')
          PY

      - name: Commit certified E15.1 source integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/e15/guest-access-ambiguity-reconciliation.e15.ts
          git add src/e15/guest-access-reservation-reconciliation-fence.e15-1.ts
          git diff --cached --check
          git commit -m 'Integrate E15.1 reservation reconciliation fencing'
          git push origin HEAD:agent/apms-enterprise-guest-journey-e15-1-reservation-reconciliation-fence
