name: Precheckin SMS Cost Optimization Validation

on:
  push:
    branches:
      - agent/precheckin-sms-cost-optimization-v1
    paths:
      - ".github/workflows/precheckin-sms-cost-optimization-validation.yml"
      - "src/services/preCheckinSms.service.ts"
      - "src/services/preCheckinSms.cost-optimization.test.ts"
      - "src/services/preCheckinSms.verification-policy.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verification policy tests
        run: npx tsx --test src/services/preCheckinSms.verification-policy.test.ts
      - name: SMS cost optimization tests
        run: npx tsx --test src/services/preCheckinSms.cost-optimization.test.ts
      - name: Bundle pre-checkin SMS service
        run: npx esbuild src/services/preCheckinSms.service.ts --bundle --platform=node --packages=external --outfile=/tmp/preCheckinSms.service.js
