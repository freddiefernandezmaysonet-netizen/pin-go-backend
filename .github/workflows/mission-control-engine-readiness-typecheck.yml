name: Mission Control Engine Readiness Typecheck

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/mission-control-engine-readiness-typecheck.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-control-engine-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pingo

      - name: Typecheck
        run: npx tsc --noEmit
