name: Mission Control Engine Readiness Compile

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/mission-control-engine-readiness-typecheck.yml"
  workflow_dispatch:

# Certification may read and compile repository contents, but never mutate them.
permissions:
  contents: read

concurrency:
  group: mission-control-engine-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile changed TypeScript files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pingo

      - name: Fetch base branch
        run: git fetch origin main --depth=1

      - name: Compile changed backend files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD -- src \
              | grep -E '\.(ts|tsx)$' \
              || true
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed TypeScript files to compile."
            exit 0
          fi

          for file in "${changed_files[@]}"; do
            output_file="/tmp/$(echo "$file" | tr '/.' '__').mjs"
            echo "Compiling $file"

            npx --yes esbuild@0.28.1 "$file" \
              --bundle \
              --platform=node \
              --format=esm \
              --target=node22 \
              --packages=external \
              --log-level=warning \
              --outfile="$output_file"
          done

      - name: Run Mission Control Engine tests
        run: |
          npx tsx --test \
            src/apms/__tests__/mission-control-read-model.test.ts \
            src/apms/__tests__/device-health-ownership.test.ts \
            src/apms/__tests__/financial-mission-control.adapter.test.ts \
            src/apms/__tests__/financial-mission-control-read-model.test.ts \
            src/pms/__tests__/webhook-claim.test.ts \
            src/services/__tests__/access-recovery-operational.test.ts \
            src/services/__tests__/cleaning-operational.test.ts \
            src/services/__tests__/communications-operational.test.ts \
            src/services/__tests__/device-health-operational.test.ts \
            src/services/__tests__/guest-journey-operational.test.ts \
            src/services/__tests__/stripe-connect-status.test.ts

      - name: Retain Mission Control review artifact
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-review-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src/apms/engine-operational-contract.ts
            src/apms/financial-mission-control.adapter.ts
            src/apms/mission-control-read-model.ts
            src/apms/mission-control.service.ts
            src/apms/reservation-operational-intelligence.mapper.ts
            src/apms/__tests__/mission-control-read-model.test.ts
            src/apms/__tests__/device-health-ownership.test.ts
            src/apms/__tests__/financial-mission-control.adapter.test.ts
            src/apms/__tests__/financial-mission-control-read-model.test.ts
            src/pms/ingest/webhook.processor.ts
            src/pms/ingest/webhook.routes.ts
            src/pms/__tests__/webhook-claim.test.ts
            src/routes/cleaning-confirm.routes.ts
            src/routes/dashboard.mission-control.route.ts
            src/server.ts
            src/services/access-recovery-operational.service.ts
            src/services/access-recovery.service.ts
            src/services/cleaning-confirmation-dispatch.service.ts
            src/services/cleaning-operational.service.ts
            src/services/communications-operational.service.ts
            src/services/device-health-operational.service.ts
            src/services/deviceHealth.service.ts
            src/services/guest-journey-operational.service.ts
            src/services/reservation.reconcile.service.ts
            src/services/stripe-connect.service.ts
            src/services/__tests__/access-recovery-operational.test.ts
            src/services/__tests__/cleaning-operational.test.ts
            src/services/__tests__/communications-operational.test.ts
            src/services/__tests__/device-health-operational.test.ts
            src/services/__tests__/guest-journey-operational.test.ts
            src/services/__tests__/stripe-connect-status.test.ts
            src/workers/lodgify.poller.ts
            src/workers/message.retry.worker.ts
            src/workers/reservation.worker.ts
            src/webhooks/stripe.webhook.ts
