name: Dashboard Lockfile Baseline Repair

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pin-go-dashboard/package.json"
      - "pin-go-dashboard/package-lock.json"
      - ".github/workflows/dashboard-lockfile-baseline-repair.yml"

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate candidate lockfile
        working-directory: pin-go-dashboard
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload candidate lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-package-lock-candidate
          path: pin-go-dashboard/package-lock.json
          if-no-files-found: error
