name: APMS Exit Closure A Final Residual Certification V3

on:
  push:
    branches:
      - agent/apms-exit-closure-a-canonical-access-ambiguity-handoff
    paths:
      - ".github/workflows/apms-exit-closure-a-final-residual-certification-v3.yml"

permissions:
  contents: write

jobs:
  certify-final-residuals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apms-exit-closure-a-canonical-access-ambiguity-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact authorized ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base bca95e59c7ade23eea3c18acb40c946a6c602ed1 HEAD)" = "bca95e59c7ade23eea3c18acb40c946a6c602ed1"
      - name: Apply corrected final Closure A residuals
        run: |
          python scripts/patch-apms-exit-closure-a-final-residuals-v2.py
          python scripts/patch-apms-exit-closure-a-owner-mc-fallback.py
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - name: Closure A focused contracts
        run: |
          node --import tsx --test src/services/guest-access-exit-closure-a.policy.test.ts src/services/guest-access-exit-closure-a.mission-control.test.ts
      - name: E8 Access Owner regression
        run: npm run test:guest-journey-enterprise-e8-access-owner
      - name: E14 regression
        run: |
          node --import tsx --test src/e14/guest-access-reservation-target.e14.test.ts src/e14/guest-access-admission-fence.e14.test.ts src/e14/guest-access-reservation-singleton-fence.e14.test.ts src/e14/guest-access-readiness-mission-control.e14.test.ts src/e14/guest-access-e14-structural.e14.test.ts src/e14/guest-access-worker-integration.e14.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-e14.json
      - name: E15 and E15.1 regression
        run: |
          node --import tsx --test src/e15/guest-access-ambiguity-reconciliation.e15.test.ts src/e15/guest-access-reservation-reconciliation-fence.e15-1.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-e15.json
      - name: E13 and tenant-scope regression
        run: |
          npm run test:guest-journey-enterprise-e13-runtime-truth
          node --import tsx --test src/services/guest-journey-tenant-property-scope.policy.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-tenant-scope.json
      - name: Final Closure A structural gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = [
            'src/services/guest-journey-access-owner-adapter.service.ts',
            'src/services/guest-journey-access-owner-mission-control.service.ts',
            'src/e14/guest-access-admission-fence.single-grant.e14.ts',
            'src/e14/guest-access-admission-safety-cycle.e14.ts',
            'src/e15/guest-access-ambiguity-reconciliation.e15.ts',
            'src/e15/guest-access-reservation-reconciliation-fence.e15-1.ts',
          ]
          text='\n'.join(Path(p).read_text() for p in paths)
          required=[
            'executeGuestAccessProvisioningWithFence',
            'executePhysical: () => dependencies.activate(grant.id)',
            'deferActiveSuccessToE15',
            'GUEST_ACCESS_PROVISION_AMBIGUOUS:LATE_PROVIDER_SUCCESS_REQUIRES_E15',
            'reconcileLateProviderSuccessUnderReservationFenceE15_1',
            'quarantineActiveProviderOutcomeUnderReservationFenceE15_1',
            'GUEST_ACCESS_PROVISION_AMBIGUOUS:OWNER_RELEASE_PERSISTENCE_FENCE_LOST',
            'markerState: e15MarkerState',
            'FROM "Reservation" WHERE "id" = $1 FOR UPDATE',
            'FROM "AccessGrant" WHERE "reservationId" = $1 ORDER BY "id" FOR UPDATE',
            'isolationLevel: "Serializable"',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'EXIT_A_FINAL_INVARIANT_MISSING:{missing}')
          e15=Path('src/e15/guest-access-ambiguity-reconciliation.e15.ts').read_text()
          if 'method: "GET"' not in e15 or '/v3/lock/listKeyboardPwd' not in e15:
            raise SystemExit('EXIT_A_E15_READ_ONLY_PROVIDER_BOUNDARY_MISSING')
          for forbidden in ['method: "POST"','method: "PUT"','method: "PATCH"','method: "DELETE"']:
            if forbidden in e15: raise SystemExit(f'EXIT_A_E15_PROVIDER_MUTATION:{forbidden}')
          PY
      - name: Worker bundle
        run: npx esbuild src/workers/reservation.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/reservation.worker.exit-a-final.js
      - name: Schema and change boundaries
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/pin_go_exit_a_final_schema_validation' npx prisma validate --schema prisma/schema.prisma
          git diff --check
          test -z "$(git diff --name-only bca95e59c7ade23eea3c18acb40c946a6c602ed1 -- | grep -E '^prisma/migrations/|^prisma/schema\.prisma$|^package(-lock)?\.json$|^src/services/ttlock/ttlock\.brain\.ts$' || true)"
      - name: Commit certified final residual source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/e14/guest-access-admission-fence.single-grant.e14.ts
          git add src/e14/guest-access-admission-safety-cycle.e14.ts
          git add src/e14/guest-access-admission-fence.e14.test.ts
          git add src/e15/guest-access-reservation-reconciliation-fence.e15-1.ts
          git add src/e15/guest-access-reservation-reconciliation-fence.e15-1.test.ts
          git add src/services/guest-journey-access-owner-adapter.service.ts
          git add src/services/guest-journey-access-owner-adapter.service.test.ts
          git add src/services/guest-access-exit-closure-a.policy.ts
          git add src/services/guest-access-exit-closure-a.policy.test.ts
          git add src/services/guest-journey-access-owner-mission-control.service.ts
          git diff --cached --check
          git commit -m 'Close Closure A late-success residual races'
          git push origin HEAD:agent/apms-exit-closure-a-canonical-access-ambiguity-handoff
