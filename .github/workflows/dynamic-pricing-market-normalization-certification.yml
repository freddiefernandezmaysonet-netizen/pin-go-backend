name: Dynamic Pricing Market Normalization Certification

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/dynamic-pricing-market-normalization-certification.yml"
      - "tsconfig.dynamic-pricing-market-normalization.json"
      - "src/services/market-season-template.service.ts"
      - "src/services/holiday-pricing-template.service.ts"
      - "src/services/dynamic-pricing-market-normalization.test.ts"
      - "src/data/holiday-pricing-catalog.ts"

permissions:
  contents: read

jobs:
  certify:
    name: Puerto Rico market normalization
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: ./node_modules/.bin/prisma generate --schema ./prisma

      - name: Run Dynamic Pricing regression test
        run: node --import tsx --test src/services/dynamic-pricing-market-normalization.test.ts

      - name: Type-check Dynamic Pricing normalization
        run: npx tsc -p tsconfig.dynamic-pricing-market-normalization.json
