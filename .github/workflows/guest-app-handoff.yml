name: Guest App Handoff

on:
  pull_request:
    paths:
      - "src/routes/guest-app*"
      - "src/routes/guest.routes.ts"
      - "src/guest-mobile/guest-mobile-session.service.ts"
      - "tsconfig.guest-app-handoff.json"
      - ".github/workflows/guest-app-handoff.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guest_app_ci
          POSTGRES_PASSWORD: guest_app_ci
          POSTGRES_DB: guest_app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guest_app_ci -d guest_app_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://guest_app_ci:guest_app_ci@127.0.0.1:5432/guest_app_ci
      GUEST_APP_DB_TEST: "true"
      GUEST_APP_SOURCE: ${{ github.workspace }}/guest-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: freddiefernandezmaysonet-netizen/pin-go-guest-mobile
          ref: 5a1cbd915f08c5c744d92df7ca20658294f118fb
          path: guest-mobile
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma db push --skip-generate
      - run: npx tsc -p tsconfig.guest-app-handoff.json --pretty false
      - name: Portal, released native link parser, real database and session recovery
        run: npx tsx --test src/routes/guest-app.db.test.ts
      - name: Existing email fallback and mobile authorization contracts
        run: npx tsx --test src/services/precheckin-email-fallback.contract.test.ts src/guest-mobile/guest-mobile-session.contract.test.ts src/guest-mobile/guest-mobile-http.contract.test.ts src/guest-mobile/guest-mobile-my-stay.contract.test.ts
      - name: Released app session storage and link routing
        working-directory: guest-mobile
        run: |
          npm ci --ignore-scripts
          node tests/native-link.cjs
          node --experimental-vm-modules tests/guest-session.mjs
