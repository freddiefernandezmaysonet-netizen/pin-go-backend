name: Guest App Handoff

on:
  pull_request:
    paths:
      - "src/routes/guest-app*"
      - "src/routes/guest.routes.ts"
      - "src/guest-mobile/guest-mobile-session.service.ts"
      - "src/guest-mobile/ota-guest-app-activation.service.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20261026030000_ota_guest_app_activation/**"
      - "tsconfig.guest-app-handoff.json"
      - ".github/workflows/guest-app-handoff.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guest_app_ci
          POSTGRES_PASSWORD: guest_app_ci
          POSTGRES_DB: guest_app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guest_app_ci -d guest_app_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://guest_app_ci:guest_app_ci@127.0.0.1:5432/guest_app_ci
      GUEST_APP_DB_TEST: "true"
      HANDOFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma validate
      - name: Apply activation migration to a populated previous schema
        run: |
          git show "$HANDOFF_BASE_SHA:prisma/schema.prisma" > "$RUNNER_TEMP/guest-app-base.prisma"
          npx prisma db push --schema "$RUNNER_TEMP/guest-app-base.prisma" --skip-generate
          npx prisma db execute --url "$DATABASE_URL" --stdin <<'SQL'
          INSERT INTO "GuestPerson" ("id", "updatedAt") VALUES ('activation-migration-person', NOW());
          INSERT INTO "GuestDeviceSession" ("id", "guestPersonId", "tokenHash", "expiresAt", "updatedAt")
          VALUES ('activation-migration-session', 'activation-migration-person', 'synthetic-migration-token-hash', NOW() + INTERVAL '1 day', NOW());
          SQL
          npx prisma db execute --url "$DATABASE_URL" --file prisma/migrations/20261026030000_ota_guest_app_activation/migration.sql
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          npx prisma db execute --url "$DATABASE_URL" --stdin <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM "GuestDeviceSession" WHERE "id" = 'activation-migration-session'
              AND "tokenHash" = 'synthetic-migration-token-hash' AND "guestAppActivationId" IS NULL)
            THEN RAISE EXCEPTION 'Existing device session changed'; END IF;
          END $$;
          SQL
      - run: npx prisma db push --skip-generate
      - run: npx tsc -p tsconfig.guest-app-handoff.json --pretty false
      - name: Portal native-link contract, real database and session recovery
        run: npx tsx --test src/routes/guest-app.db.test.ts
      - name: OTA activation security, copied links and concurrent redemption
        run: npx tsx --test src/routes/guest-app-activation-security.db.test.ts
      - name: Existing email fallback and mobile authorization contracts
        run: npx tsx --test src/services/precheckin-email-fallback.contract.test.ts src/guest-mobile/guest-mobile-session.contract.test.ts src/guest-mobile/guest-mobile-http.contract.test.ts src/guest-mobile/guest-mobile-my-stay.contract.test.ts
