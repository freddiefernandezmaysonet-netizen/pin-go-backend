name: Pin AI Connect Native PostgreSQL Certification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/pin-ai/fee-connect*"
      - "src/pin-ai/hybrid-fee*"
      - "src/pin-ai/reservation-service-evidence.ts"
      - "tsconfig.pin-ai-hybrid-billing.json"
      - "src/pin-ai/reservation-fee.service.ts"
      - "src/pin-ai/property-activation.ts"
      - "src/services/pin-ai-activation.service.ts"
      - "src/routes/dashboard.pin-ai-activation.routes*"
      - "src/pin-ai/billing-terms.ts"
      - "src/pin-ai/guest/guest-availability.ts"
      - "src/services/internal-demo-scope.ts"
      - "src/channex-messaging/pin-ai-commercial*"
      - "src/pin-ai/ota-commercial.database.test.ts"
      - "src/pin-ai/guest/guest-incident*"
      - "src/pin-ai/host/host-incident*"
      - "prisma/**"
      - ".github/workflows/pin-ai-connect-native-certification.yml"

permissions:
  contents: read

jobs:
  native-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pin_ai_activation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pin_ai_activation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pin_ai_activation_test?connection_limit=8
      PIN_AI_NATIVE_DB_TEST: "true"
      PIN_AI_HYBRID_DB_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate client and initialize disposable database
        run: |
          ./node_modules/.bin/prisma generate --schema ./prisma
          ./node_modules/.bin/prisma db push --schema ./prisma --skip-generate
      - name: Verify nullable-column upgrade on disposable PostgreSQL
        run: |
          python3 - <<'PY'
          import os, subprocess
          url = os.environ["DATABASE_URL"].split("?")[0]
          columns = ["collectionMethod", "stripePaymentIntentId", "stripeApplicationFeeId", "stripeReversalId", "reversedAt", "reversalStartedAt", "reversalRequest"]
          sql = 'ALTER TABLE "PinAIReservationFee" ' + ', '.join('DROP COLUMN "' + c + '"' for c in columns)
          subprocess.run(["psql", url, "-v", "ON_ERROR_STOP=1", "-c", sql], check=True)
          subprocess.run(["psql", url, "-v", "ON_ERROR_STOP=1", "-f", "prisma/migrations/20261012000000_pin_ai_hybrid_fee/migration.sql"], check=True)
          PY
      - name: Compile native concurrency contract
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          src/pin-ai/fee-connect.native.database.test.ts
      - name: Certify global availability, property consent and bounded collection
        run: |
          node --import tsx --test src/routes/dashboard.pin-ai-activation.routes.test.ts src/pin-ai/fee-connect.test.ts src/pin-ai/property-activation.test.ts src/pin-ai/property-fee-exemption.test.ts
          ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler src/routes/dashboard.pin-ai-activation.routes.test.ts src/pin-ai/fee-connect.test.ts src/pin-ai/property-activation.ts
      - name: Certify concurrent accrual and uncertain payment recovery
        run: node --import tsx --test src/pin-ai/fee-connect.native.database.test.ts
      - name: Certify commercial OTA consent, single fee and incident history
        run: node --import tsx --test src/pin-ai/ota-commercial.database.test.ts
      - name: Certify hybrid collection and cancellation
        run: |
          ./node_modules/.bin/tsc -p tsconfig.pin-ai-hybrid-billing.json
          node --import tsx --test src/pin-ai/hybrid-fee-stripe.provider.test.ts src/pin-ai/hybrid-fee.database.test.ts
