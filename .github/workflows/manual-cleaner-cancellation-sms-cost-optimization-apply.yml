name: Manual Cleaner Cancellation SMS Cost Optimization Apply

on:
  push:
    branches:
      - agent/manual-cleaner-cancellation-sms-cost-optimization-v1
    paths:
      - ".github/workflows/manual-cleaner-cancellation-sms-cost-optimization-apply.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manual-cleaner-cancellation-sms-cost-optimization-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply manual cleaner cancellation SMS optimization
        run: node scripts/apply-manual-cleaner-cancellation-sms-cost-optimization.mjs
      - run: npm ci
      - name: Manual cleaner cancellation SMS segment tests
        run: npx tsx --test src/services/manual-cleaner-cancellation-sms-cost-optimization.test.ts
      - name: Bundle manual cleaner cancellation service
        run: npx esbuild src/services/manual-reservation-cleaner-cancellation-notification.service.ts --bundle --platform=node --packages=external --outfile=/tmp/manual-cleaner-cancellation.service.js
      - name: Commit validated service change only
        run: |
          git config user.name "freddiefernandezmaysonet-netizen"
          git config user.email "freddiefernandezmaysonet@gmail.com"
          git add src/services/manual-reservation-cleaner-cancellation-notification.service.ts
          git diff --cached --check
          git commit -m "Optimize manual cleaner cancellation SMS segment usage"
          git push origin HEAD:agent/manual-cleaner-cancellation-sms-cost-optimization-v1
