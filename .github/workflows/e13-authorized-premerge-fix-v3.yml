name: E13 Authorized Pre-Merge Corrections V3

on:
  push:
    branches:
      - agent/apms-enterprise-guest-journey-e13-runtime-truth
    paths:
      - ".github/workflows/e13-authorized-premerge-fix-v3.yml"

permissions:
  contents: write

jobs:
  correct-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingo_e13_fix_v3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pingo_e13_fix_v3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_e13_fix_v3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply authorized E13 corrections
        run: python .github/scripts/e13_authorized_patch.py

      - name: Verify exact correction scope
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              ".github/scripts/e13_authorized_patch.py",
              ".github/workflows/e13-authorized-premerge-fix.yml",
              ".github/workflows/e13-authorized-premerge-fix-v2.yml",
              ".github/workflows/e13-authorized-premerge-fix-v3.yml",
              ".github/workflows/guest-journey-enterprise-e1-certification.yml",
              "src/apms/mission-control-runtime-health.e13.test.ts",
              "src/apms/mission-control-runtime-health.e13.ts",
              "src/services/guest-journey-e13-runtime-truth.contract.test.ts",
              "src/services/guest-journey-runtime-state.service.test.ts",
              "src/services/guest-journey-runtime-state.service.ts",
              "src/workers/reservation.worker.ts",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          missing = sorted({
              ".github/workflows/guest-journey-enterprise-e1-certification.yml",
              "src/apms/mission-control-runtime-health.e13.test.ts",
              "src/apms/mission-control-runtime-health.e13.ts",
              "src/services/guest-journey-e13-runtime-truth.contract.test.ts",
              "src/services/guest-journey-runtime-state.service.test.ts",
              "src/services/guest-journey-runtime-state.service.ts",
              "src/workers/reservation.worker.ts",
          } - changed)
          if unexpected:
              raise SystemExit(f"Unexpected E13 files: {unexpected}")
          if missing:
              raise SystemExit(f"Missing expected E13 files: {missing}")
          PY
          git diff --check
          ! git diff --name-only | grep -E '(^|/)(ttlock|stripe|twilio|channex)(/|\.)'

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma without production access
        run: |
          npx prisma generate --schema prisma/schema.prisma
          npx prisma validate --schema prisma/schema.prisma

      - name: Apply complete migration history to empty ephemeral PostgreSQL
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Certify E13 and regress E1 through E12
        run: |
          npm run test:guest-journey-enterprise-e13-runtime-truth
          npm run test:guest-journey-enterprise-contract
          npm run test:guest-journey-enterprise-e2-shadow
          npm run test:guest-journey-enterprise-e3-reconciler
          npm run test:guest-journey-enterprise-e4-coordination
          npm run test:guest-journey-enterprise-e5-owner-runtime
          npm run test:guest-journey-enterprise-e6-mission-control
          npm run test:guest-journey-enterprise-e7-communications
          npm run test:guest-journey-enterprise-e8-access-owner
          npm run test:guest-journey-enterprise-e9-financial-owner
          npm run test:guest-journey-enterprise-e10-compliance-owner
          npm run test:guest-journey-enterprise-e11-activation-control-plane
          npm run test:guest-journey-enterprise-e12-runtime-enforcement
          npm run test:canonical-operational-contract

      - name: Bundle worker and API wiring
        run: |
          npx esbuild src/workers/reservation.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/reservation.worker.e13-fix.js
          npx esbuild src/server.ts --bundle --platform=node --packages=external --outfile=/tmp/server.e13-fix.js

      - name: Final patch integrity
        run: git diff --check

      - name: Commit and publish authorized corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E13 harden multi-replica runtime truth"
          git push origin HEAD:${{ github.ref_name }}
