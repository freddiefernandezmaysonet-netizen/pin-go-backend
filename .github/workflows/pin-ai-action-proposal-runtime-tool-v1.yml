name: Pin AI Action Proposal Runtime Tool V1

on:
  pull_request:
    branches:
      - main
      - agent/pin-ai-action-broker-guest-confirmation-v1
    paths:
      - "src/pin-ai/runtime/contracts.ts"
      - "src/pin-ai/runtime/openai-agent-config.ts"
      - "src/pin-ai/runtime/openai-agent-config.test.ts"
      - "src/pin-ai/runtime/openai-agents-runtime-transport.ts"
      - "src/pin-ai/runtime/luna-runtime-adapter.test.ts"
      - "src/pin-ai/runtime/action-proposal-tool-executor.ts"
      - "src/pin-ai/runtime/action-proposal-tool-executor.test.ts"
      - "src/pin-ai/runtime/action-proposal-runtime-composition.ts"
      - "src/pin-ai/runtime/action-proposal-runtime-composition.test.ts"
      - "src/pin-ai/runtime/pin-go-runtime-tools.ts"
      - "src/pin-ai/guest/guest-runtime-gateway.ts"
      - "src/pin-ai/guest/guest-runtime-gateway.test.ts"
      - "src/routes/public-booking.pin-ai.routes.test.ts"
      - "tsconfig.pin-ai-action-proposal-runtime.json"
      - ".github/workflows/pin-ai-action-proposal-runtime-tool-v1.yml"

permissions:
  contents: read

jobs:
  action-proposal-runtime-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/pingo_test
      APP_URL: http://localhost:3000

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate and validate Prisma client
        run: |
          npx prisma generate
          npx prisma validate --schema ./prisma/schema.prisma

      - name: Run proposal runtime focused tests
        run: |
          node --import tsx --test \
            src/pin-ai/runtime/action-proposal-tool-executor.test.ts \
            src/pin-ai/runtime/action-proposal-runtime-composition.test.ts \
            src/pin-ai/runtime/openai-agent-config.test.ts \
            src/pin-ai/runtime/luna-runtime-adapter.test.ts \
            src/pin-ai/guest/guest-runtime-gateway.test.ts \
            src/routes/public-booking.pin-ai.routes.test.ts

      - name: Type-check proposal runtime tool
        run: npx tsc -p tsconfig.pin-ai-action-proposal-runtime.json

      - name: Type-check retained Pin AI Guest Gateway
        run: npm run test:pin-ai-guest-gateway-types

      - name: Regress Action Broker
        run: |
          node --import tsx --test \
            src/pin-ai/actions/action-broker.service.test.ts \
            src/pin-ai/actions/action-broker.composition.test.ts

      - name: Regress Reservation Modification Action Adapter
        run: node --import tsx --test src/pin-ai/actions/reservation-modification-action-adapter.service.test.ts

      - name: Regress Action Proposal foundation
        run: node --import tsx --test src/pin-ai/actions/action-proposal.service.test.ts

      - name: Regress retained Pin AI Runtime
        run: npm run test:pin-ai-runtime
