name: Checkout SMS Consent Guard Validation

on:
  push:
    branches:
      - agent/checkout-sms-consent-guard-v1
    paths:
      - ".github/workflows/checkout-sms-consent-guard-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Checkout SMS consent guard tests
        run: npx tsx --test src/services/checkoutSms.consent-guard.test.ts
      - name: Checkout SMS cost optimization regression tests
        run: npx tsx --test src/services/checkoutSms.sms-cost-optimization.test.ts
      - name: Bundle checkout SMS service
        run: npx esbuild src/services/checkoutSms.service.ts --bundle --platform=node --packages=external --outfile=/tmp/checkoutSms.service.js
      - name: Bundle checkout SMS consent policy
        run: npx esbuild src/services/checkout-sms-consent.policy.ts --bundle --platform=node --packages=external --outfile=/tmp/checkout-sms-consent.policy.js
      - name: Bundle message retry worker
        run: npx esbuild src/workers/message.retry.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/message.retry.worker.js
