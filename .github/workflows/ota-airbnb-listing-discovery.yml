name: OTA Airbnb Listing Discovery + Auto-Matching V1.1 Certification

on:
  pull_request:
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20260911153000_add_property_postal_code/migration.sql'
      - 'src/routes/properties.route.ts'
      - 'src/routes/dashboard.properties.route.ts'
      - 'src/distribution/airbnb-host-self-service.listings.http-transport.ts'
      - 'src/distribution/airbnb-host-self-service.listings.service.ts'
      - 'src/distribution/airbnb-host-self-service.listings.service.test.ts'
      - 'src/distribution/airbnb-property-auto-matching.ts'
      - 'src/distribution/airbnb-property-auto-matching.test.ts'
      - 'src/distribution/airbnb-host-activation.service.ts'
      - 'src/distribution/airbnb-host-activation.service.test.ts'
      - 'src/distribution/channex-airbnb-listings.transport.test.ts'
      - 'src/distribution/channex-airbnb-transport-readiness.policy.ts'
      - 'src/distribution/channex-airbnb-transport-readiness.policy.test.ts'
      - 'src/distribution/channex-canonical-readiness.service.ts'
      - 'src/distribution/channex-canonical-readiness.service.test.ts'
      - 'src/distribution/channex-channel-identity.ts'
      - 'src/distribution/channex-channel-identity.test.ts'
      - 'src/distribution/channex-channel-lifecycle.evidence.ts'
      - 'src/distribution/channex-channel-lifecycle.evidence.test.ts'
      - 'src/distribution/ota-connection-center.runtime-composition.ts'
      - 'src/distribution/ota-connection-center.runtime-composition.test.ts'
      - 'src/routes/dashboard.airbnb-host-self-service.route.ts'
      - 'src/routes/dashboard.airbnb-host-self-service.listings.route.test.ts'
      - '.github/workflows/ota-airbnb-listing-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listing-discovery-auto-matching-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/pingo_test
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate and validate Prisma client
        run: |
          npx prisma generate
          npx prisma validate --schema ./prisma/schema.prisma

      - name: Prove exact narrow diff allowlist
        shell: bash
        run: |
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          git fetch origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" --depth=1
          git diff --name-only "origin/$BASE_BRANCH...HEAD" | sort > "$RUNNER_TEMP/actual.txt"
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/public-booking-listing-details-v1" ]; then
            cat > "$RUNNER_TEMP/public-booking-listing-details-v1-allowed.txt" <<'EOF'
          .github/workflows/ota-airbnb-listing-discovery.yml
          .github/workflows/public-booking-listing-details-v1.yml
          package.json
          src/routes/public-booking.listing-details.contract.test.ts
          src/routes/public-booking.routes.ts
          EOF
            sort "$RUNNER_TEMP/public-booking-listing-details-v1-allowed.txt" -o "$RUNNER_TEMP/public-booking-listing-details-v1-allowed.txt"
            diff -u "$RUNNER_TEMP/public-booking-listing-details-v1-allowed.txt" "$RUNNER_TEMP/actual.txt"
            exit 0
          fi

          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/mission-control-e13-decoupling-v1" ]; then
            cat > "$RUNNER_TEMP/mission-control-allowed.txt" <<'EOF'
          .github/workflows/mission-control-observational-certification.yml
          .github/workflows/ota-airbnb-listing-discovery.yml
          src/apms/mission-control-observational.test.ts
          src/apms/mission-control-observational.ts
          src/routes/dashboard.properties.route.ts
          src/services/guest-journey-e13-runtime-truth.contract.test.ts
          src/services/guest-journey-runtime-enforcement.contract.test.ts
          EOF
            sort "$RUNNER_TEMP/mission-control-allowed.txt" -o "$RUNNER_TEMP/mission-control-allowed.txt"
            diff -u "$RUNNER_TEMP/mission-control-allowed.txt" "$RUNNER_TEMP/actual.txt"
            exit 0
          fi

          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/property-protection-v1-guest-damage-response" ]; then
            cat > "$RUNNER_TEMP/property-protection-guest-response-allowed.txt" <<'EOF'
          .github/workflows/ota-airbnb-listing-discovery.yml
          .github/workflows/property-protection-v1-certification.yml
          prisma/migrations/20260922204500_damage_case_guest_response_non_charging/migration.sql
          prisma/schema.prisma
          src/routes/public-booking.routes.ts
          src/services/damage-case-guest-response.contract.test.ts
          src/services/damage-case-guest-response.service.ts
          src/services/guest-cancellation.service.ts
