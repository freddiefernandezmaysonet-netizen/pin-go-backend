name: OTA Airbnb Listing Discovery + Auto-Matching V1.1 Certification

on:
  pull_request:
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20260911153000_add_property_postal_code/migration.sql'
      - 'src/routes/properties.route.ts'
      - 'src/routes/dashboard.properties.route.ts'
      - 'src/distribution/airbnb-host-self-service.listings.http-transport.ts'
      - 'src/distribution/airbnb-host-self-service.listings.service.ts'
      - 'src/distribution/airbnb-host-self-service.listings.service.test.ts'
      - 'src/distribution/airbnb-property-auto-matching.ts'
      - 'src/distribution/airbnb-property-auto-matching.test.ts'
      - 'src/distribution/airbnb-host-activation.service.ts'
      - 'src/distribution/airbnb-host-activation.service.test.ts'
      - 'src/distribution/channex-airbnb-listings.transport.test.ts'
      - 'src/distribution/channex-airbnb-transport-readiness.policy.ts'
      - 'src/distribution/channex-airbnb-transport-readiness.policy.test.ts'
      - 'src/distribution/channex-canonical-readiness.service.ts'
      - 'src/distribution/channex-canonical-readiness.service.test.ts'
      - 'src/distribution/channex-channel-identity.ts'
      - 'src/distribution/channex-channel-identity.test.ts'
      - 'src/distribution/channex-channel-lifecycle.evidence.ts'
      - 'src/distribution/channex-channel-lifecycle.evidence.test.ts'
      - 'src/distribution/ota-connection-center.runtime-composition.ts'
      - 'src/distribution/ota-connection-center.runtime-composition.test.ts'
      - 'src/routes/dashboard.airbnb-host-self-service.route.ts'
      - 'src/routes/dashboard.airbnb-host-self-service.listings.route.test.ts'
      - '.github/workflows/ota-airbnb-listing-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listing-discovery-auto-matching-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/pingo_test
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate and validate Prisma client
        run: |
          npx prisma generate
          npx prisma validate --schema ./prisma/schema.prisma

      - name: Prove exact narrow diff allowlist
        shell: bash
        env:
          SCOPE_PR_NUMBER: ${{ github.event.pull_request.number }}
          SCOPE_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SCOPE_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          git fetch origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          git diff --name-only "origin/$BASE_BRANCH...HEAD" | sort > "$RUNNER_TEMP/actual.txt"

          # PR #333 only: exact property stay-time settings scope; retain all OTA tests below.
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/pin-ai-stay-time-policy-v1" ]; then
            test "$GITHUB_EVENT_NAME" = "pull_request"
            test "$GITHUB_REPOSITORY" = "freddiefernandezmaysonet-netizen/pin-go-backend"
            test "$SCOPE_PR_NUMBER" = "333"
            test "$SCOPE_HEAD_REPO" = "$GITHUB_REPOSITORY"
            test "$SCOPE_BASE_REPO" = "$GITHUB_REPOSITORY"
            test "$GITHUB_BASE_REF" = "main"
            cat > "$RUNNER_TEMP/stay-time-settings-allowed.txt" <<'EOF'
          src/pin-ai/actions/action-broker.service.ts
          src/pin-ai/guest/guest-history-reader.ts
          src/pin-ai/guest/guest-runtime-gateway.ts
          src/pin-ai/guest/stay-time-chat-actions.test.ts
          src/pin-ai/guest/stay-time-chat-actions.ts
          src/pin-ai/runtime/action-proposal-tool-executor.ts
          src/pin-ai/runtime/openai-agent-config.ts
          src/routes/public-booking.pin-ai.routes.test.ts
          src/routes/public-booking.pin-ai.routes.ts
          tsconfig.pin-ai-guest-gateway.json
          .github/workflows/ota-airbnb-listing-discovery.yml
          .github/workflows/ota-initial-distribution-enablement.yml
          .github/workflows/pin-ai-host-incidents-v1.yml
          .github/workflows/pin-ai-stay-time-policy-v1.yml
          .github/workflows/pin-ai-stay-time-settings-v1.yml
          docs/pin-ai-stay-time-policy-v1.md
          package.json
          prisma/migrations/20261003010000_stay_time_recovery/migration.sql
          src/services/stay-time-recovery.service.ts
          src/services/stay-time-recovery.db.test.ts
          src/workers/stay-time-recovery.worker.ts
          prisma/migrations/20261001110000_property_stay_time_settings_v1/migration.sql
          prisma/schema.prisma
          src/domain/computeOperationalRisk.ts
          src/pin-ai/actions/action-proposal.service.ts
          src/pin-ai/actions/stay-time-policy.test.ts
          src/pin-ai/actions/stay-time-policy.ts
          src/pin-ai/actions/stay-time-settings.ts
          src/pin-ai/runtime/pin-go-read-tool-executor.ts
          src/pin-ai/runtime/stay-time-tool.test.ts
          src/pin-ai/runtime/stay-time-tool.ts
          src/routes/dashboard.stay-time-settings.routes.test.ts
          src/routes/dashboard.stay-time-settings.routes.ts
          src/server.ts
          src/services/arrival-cleaning-readiness.service.ts
          src/services/guest-reservation-modification-apply.service.ts
          src/services/stay-time-apply-validation.service.ts
          src/services/availability.service.ts
          src/services/ingest.service.ts
          src/services/direct-booking-ingest-transaction.ts
          src/services/channex-availability-conflict.service.ts
          src/contracts/channex-certified-core.freeze.test.ts
          src/services/direct-booking-ingest-transaction.test.ts
          src/services/direct-booking-ingest-transaction.db.test.ts
          src/services/manual-reservation-date-change.service.ts
          src/services/ota-availability-conflict-review.service.ts
          src/services/ota-availability-conflict-review.db.test.ts
          src/routes/dashboard.ota-availability-conflicts.routes.ts
          src/routes/dashboard.ota-availability-conflicts.routes.test.ts
          src/routes/dashboard.route.ts
          src/services/manual-reservation-date-change.behavior.test.ts
          src/services/manual-reservation-date-change.contract.test.ts
          src/routes/dashboard.properties.route.ts
          src/services/stay-time-apply.db.test.ts
          src/services/reservation.reconcile.service.ts
          src/services/reservation-guest-access-window.ts
          src/services/reservation-guest-access-window.test.ts
          src/services/reservation-cleaning-window.ts
          src/services/cleaning-reconfirmation-renewal.service.ts
          src/services/cleaning-reconfirmation-renewal.db.test.ts
          src/services/cleaning-timing-consent.prisma.ts
          src/services/cleaning-timing-consent.prisma.test.ts
          src/services/cleaning-work-start.prisma.ts
          src/services/cleaning-work-start.prisma.test.ts
          src/services/cleaning-work-completion.prisma.ts
          src/services/cleaning-work-completion.prisma.test.ts
          src/routes/cleaning-completion-mobile.response.test.js
          .github/workflows/cleaning-followup-v1-foundation.yml
          prisma/migrations/20261001183000_cleaning_work_confirmation_history/migration.sql
          src/services/cleaning-work-snapshot.prisma.ts
          src/services/cleaning-work-snapshot.database.test.ts
          src/services/reservation-reconcile-cleaner-reconfirmation.contract.test.ts
          src/services/property-stay-time-settings.db.test.ts
          src/services/property-stay-time-settings.service.ts
          src/services/stay-time-estimate.service.test.ts
          src/services/stay-time-estimate.service.ts
          src/services/stay-time-departure-cleaning.service.ts
          src/services/stay-time-departure-cleaning.service.test.ts
          src/services/stay-time-departure-cleaning.fixture.ts
          src/services/stay-time-hourly-basis.ts
          src/services/stay-time-quote.service.test.ts
          src/services/stay-time-quote.service.ts
          src/services/stay-time-proposal.service.ts
          src/services/stay-time-guest-action.service.ts
          src/services/stay-time-guest-action.db.test.ts
          src/services/stay-time-payment-event.service.ts
          src/services/stay-time-payment-event.test.ts
          src/services/direct-booking.service.ts
          src/services/stripe-direct-charge-dispute.service.ts
          src/services/stripe-direct-charge-dispute.service.test.ts
          src/webhooks/stripe.webhook.ts
          src/services/stay-time-checkout-preflight.db.test.ts
          src/services/stay-time-stripe-provider.ts
          src/services/stay-time-checkout.service.ts
          src/services/guest-reservation-modification-checkout-contract.ts
          src/services/guest-reservation-modification-checkout.service.ts
          src/services/direct-booking-direct-charges-only.contract.test.ts
          src/services/stay-time-checkout.db.test.ts
          src/services/stay-time-stripe-provider.test.ts
          src/services/stay-time-payment-flow.service.ts
          src/services/stay-time-payment-flow.db.test.ts
          src/services/stay-time-payment-evidence.ts
          src/services/stay-time-payment-evidence.test.ts
          src/services/stay-time-payment-evidence.fixture.ts
          src/services/stay-time-payment-window.ts
          src/services/stay-time-payment-window.test.ts
          tsconfig.pin-ai-stay-time-policy.json
          tsconfig.pin-ai-stay-time-settings.json
          EOF
            sort "$RUNNER_TEMP/stay-time-settings-allowed.txt" -o "$RUNNER_TEMP/stay-time-settings-allowed.txt"
            # Another merged PR may already contain the exact battery correction.
            if git diff --quiet "origin/$BASE_BRANCH" HEAD -- src/domain/computeOperationalRisk.ts; then
              sed -i '\|^src/domain/computeOperationalRisk.ts$|d' "$RUNNER_TEMP/stay-time-settings-allowed.txt"
            fi
            diff -u "$RUNNER_TEMP/stay-time-settings-allowed.txt" "$RUNNER_TEMP/actual.txt"
            # Preserve the certified schema, then pin the additive worker delta.
            recovery_base=5e976be76cffd4c0077d4cfaeed3ec1b3e488214
            test "$(git diff --no-ext-diff --no-color --full-index --unified=0 "origin/$BASE_BRANCH...$recovery_base" -- prisma/schema.prisma | sha256sum | cut -d ' ' -f 1)" = "e4275686f99c3709a02b3040d60fc4460011f61f8aa69b45f31add54695f3409"
            test "$(git diff --no-ext-diff --no-color --full-index --unified=0 "$recovery_base" HEAD -- prisma/schema.prisma | sha256sum | cut -d ' ' -f 1)" = "c3e776c3d7ed86dbdc932f861cdfe58324007bacd642b0e2896aa51c47086065"
            test "$(sha256sum prisma/migrations/20261003010000_stay_time_recovery/migration.sql | cut -d ' ' -f 1)" = "73e34f34c3010a6bcf80ac2c267b887b8d96bd0b9cc61a827d75f2dd73a0028b"
            test "$(git diff --no-ext-diff --no-color --full-index --unified=0 "$recovery_base" HEAD -- package.json | sha256sum | cut -d ' ' -f 1)" = "0a4686c80531858708636ccefd893632e039998d69554c740e0c13b35025074f"
            test "$(sha256sum prisma/migrations/20261001183000_cleaning_work_confirmation_history/migration.sql | cut -d ' ' -f 1)" = "20cd60db321dc5becbadc2f56065cf9f29f320941625da3d5b246927c5d37d0a"
            test "$(sha256sum prisma/migrations/20261001110000_property_stay_time_settings_v1/migration.sql | cut -d ' ' -f 1)" = "848dc881ee67925f88af326639cc457b64704ddb01773ee8fdd7dea58a80f9df"
            # Pin exact added/removed server lines; unrelated base edits change blob IDs and offsets.
            test "$(git diff --no-ext-diff --no-color --full-index --unified=0 "origin/$BASE_BRANCH...HEAD" -- src/server.ts | sed '/^index /d; /^@@ /d' | sha256sum | cut -d ' ' -f 1)" = "0a19e9d1d9857b769dcd3725b43fb7b2db6cc6fedbce8034db8ddd8877547774"
            if ! git diff --quiet "origin/$BASE_BRANCH" HEAD -- src/domain/computeOperationalRisk.ts; then
              test "$(git diff --no-ext-diff --no-color --full-index --unified=0 "origin/$BASE_BRANCH...HEAD" -- src/domain/computeOperationalRisk.ts | sha256sum | cut -d ' ' -f 1)" = "c5591cd2c13898778ad044c54bc82543f97c3407d0d82569ed70957fef4e4244"
            fi
            test "$(git diff --no-ext-diff --no-color --full-index --unified=0 "origin/$BASE_BRANCH...HEAD" -- .github/workflows/pin-ai-host-incidents-v1.yml | sha256sum | cut -d ' ' -f 1)" = "16860e7db9814fe7d84ad91fac8823f709ab165cd458ef4d5807e484217d1ce1"
            echo "PR #333 exact settings scope verified; continuing retained OTA certifications."
            exit 0
          fi

          if [ "${GITHUB_HEAD_REF:-}" = "agent/staff-preferred-language-v1" ]; then
            python3 scripts/verify-staff-language-pr-scope.py
            exit 0
          fi

          # PR #340 only: additive sitemap classification; retain every OTA certification below.
          if [ "${GITHUB_HEAD_REF:-}" = "agent/public-stays-sitemap-v1" ]; then
            test "$GITHUB_EVENT_NAME" = "pull_request"
            test "$GITHUB_REPOSITORY" = "freddiefernandezmaysonet-netizen/pin-go-backend"
            test "$SCOPE_PR_NUMBER" = "340"
            test "$SCOPE_HEAD_REPO" = "$GITHUB_REPOSITORY"
            test "$SCOPE_BASE_REPO" = "$GITHUB_REPOSITORY"
            test "$GITHUB_BASE_REF" = "main"
            cat > "$RUNNER_TEMP/public-stays-sitemap-allowed.txt" <<'EOF'
          .github/workflows/ota-airbnb-listing-discovery.yml
          .github/workflows/ota-initial-distribution-enablement.yml
          .github/workflows/pin-ai-host-incidents-v1.yml
          .github/workflows/public-stays-sitemap.yml
          prisma/migrations/20261002130000_property_test_classification/migration.sql
          prisma/schema.prisma
          src/routes/public-booking.routes.ts
          src/routes/public-stays-sitemap.routes.ts
          src/services/public-stays-sitemap.service.test.ts
          src/services/public-stays-sitemap.service.ts
          EOF
            diff -u "$RUNNER_TEMP/public-stays-sitemap-allowed.txt" "$RUNNER_TEMP/actual.txt"
            test "$(git diff --no-ext-diff --no-color --full-index --unified=0 "origin/$BASE_BRANCH...HEAD" -- prisma/schema.prisma | sha256sum | cut -d ' ' -f 1)" = "e2b2541c446ad073bc2d2298f5809daa4a2c13836a06e709842f22b2a043372c"
            test "$(sha256sum prisma/migrations/20261002130000_property_test_classification/migration.sql | cut -d ' ' -f 1)" = "347d9d1dff2680d02e67c39b1684832cf1e46b66d5648695bcec95feb0dc1397"
            echo "PR #340 exact sitemap scope verified; continuing all retained OTA certifications."
            exit 0
          fi

          # PR #294 only: TTLock Gateway Health foundation is outside OTA scope.
          # Keep this workflow fail-closed by permitting only the exact foundation files.
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/ttlock-gateway-health-foundation-v1" ]; then
            test "$GITHUB_EVENT_NAME" = "pull_request"
            test "$GITHUB_REPOSITORY" = "freddiefernandezmaysonet-netizen/pin-go-backend"
            test "$SCOPE_PR_NUMBER" = "294"
            test "$SCOPE_HEAD_REPO" = "$GITHUB_REPOSITORY"
            test "$SCOPE_BASE_REPO" = "$GITHUB_REPOSITORY"
            test "$GITHUB_BASE_REF" = "main"
            cat > "$RUNNER_TEMP/ttlock-gateway-health-foundation-v1-allowed.txt" <<'EOF'
          .github/workflows/ota-airbnb-listing-discovery.yml
          .github/workflows/ota-initial-distribution-enablement.yml
          .github/workflows/ttlock-gateway-health-foundation-v1.yml
          prisma/migrations/20260927173000_ttlock_gateway_health_foundation_v1/migration.sql
          prisma/schema.prisma
          src/routes/dashboard.locks.route.ts
          src/services/gatewayConfigurationVerification.service.test.ts
          src/services/gatewayConfigurationVerification.service.ts
          src/services/ttlock-gateway-health.service.test.ts
          src/services/ttlock-gateway-health.service.ts
          src/services/ttlock-gateway-mapping.service.ts
          src/workers/deviceHealth.hardened.worker.ts
          EOF
            sort "$RUNNER_TEMP/ttlock-gateway-health-foundation-v1-allowed.txt" -o "$RUNNER_TEMP/ttlock-gateway-health-foundation-v1-allowed.txt"
            diff -u "$RUNNER_TEMP/ttlock-gateway-health-foundation-v1-allowed.txt" "$RUNNER_TEMP/actual.txt"
            echo "PR #294 exact TTLock Gateway Health foundation scope verified; OTA files remain untouched."
            exit 0
          fi
          # PR #295 only: exact host incident foundation scope; retain all OTA steps below.
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/pin-ai-host-incident-foundation-v1" ]; then
            test "$GITHUB_EVENT_NAME" = "pull_request"
            test "$GITHUB_REPOSITORY" = "freddiefernandezmaysonet-netizen/pin-go-backend"
            test "$SCOPE_PR_NUMBER" = "295"
            test "$SCOPE_HEAD_REPO" = "$GITHUB_REPOSITORY"
            test "$SCOPE_BASE_REPO" = "$GITHUB_REPOSITORY"
            test "$GITHUB_BASE_REF" = "main"
            cat > "$RUNNER_TEMP/pin-ai-host-incident-allowed.txt" <<'EOF'
          .github/workflows/ota-airbnb-listing-discovery.yml
          .github/workflows/ota-initial-distribution-enablement.yml
          .github/workflows/pin-ai-host-incidents-v1.yml
          docs/pin-ai-host-incident-conversations-blueprint-v1.md
          docs/pin-ai-host-incident-foundation-v1.md
          prisma/migrations/20260927180000_pin_ai_host_incident_threads/migration.sql
          prisma/schema.prisma
          src/pin-ai/host/host-incident-policy.ts
          src/pin-ai/host/host-incident.database.test.ts
          src/pin-ai/host/host-incident.service.ts
          src/pin-ai/host/host-incident.test.ts
          src/routes/dashboard.pin-ai-host-incidents.routes.ts
          src/server.ts
          tsconfig.pin-ai-host-incidents.json
          EOF
            diff -u "$RUNNER_TEMP/pin-ai-host-incident-allowed.txt" "$RUNNER_TEMP/actual.txt"
            # Pin the reviewed additive schema diff and migration, not just their filenames.
            test "$(git diff --no-ext-diff --no-color --full-index --unified=0 "origin/$BASE_BRANCH...HEAD" -- prisma/schema.prisma | sha256sum | cut -d ' ' -f 1)" = "6f432ddbccb1c6352c641fa6f2ce817e43c72359f64590ac5199b8311df46dcd"
            test "$(sha256sum prisma/migrations/20260927180000_pin_ai_host_incident_threads/migration.sql | cut -d ' ' -f 1)" = "4f75953b816801bfbda824d5a71b18d527f2919de2648f8f19fbecc41554a9c0"
            echo "PR #295 exact host incident scope verified; continuing all retained OTA certifications."
            exit 0
          fi

          # PR #284 only: exact Pin AI history scope; all OTA certification steps below still run.
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/pin-ai-server-history-v1" ]; then
            test "$GITHUB_EVENT_NAME" = "pull_request"
            test "$GITHUB_REPOSITORY" = "freddiefernandezmaysonet-netizen/pin-go-backend"
            test "$SCOPE_PR_NUMBER" = "284"
            test "$SCOPE_HEAD_REPO" = "$GITHUB_REPOSITORY"
            test "$SCOPE_BASE_REPO" = "$GITHUB_REPOSITORY"
            test "$GITHUB_BASE_REF" = "main"
            cat > "$RUNNER_TEMP/pin-ai-history-allowed.txt" <<'EOF'
          .github/workflows/ota-airbnb-listing-discovery.yml
          .github/workflows/ota-initial-distribution-enablement.yml
          .github/workflows/pin-ai-guest-history-v1.yml
          prisma/migrations/20260927032500_pin_ai_guest_history_v1/migration.sql
          prisma/schema.prisma
          src/pin-ai/guest/guest-history-reader.ts
          src/pin-ai/guest/guest-history.database.test.ts
          src/pin-ai/guest/guest-history.ts
          src/pin-ai/guest/guest-runtime-gateway.test.ts
          src/pin-ai/guest/guest-runtime-gateway.ts
          src/routes/public-booking.pin-ai.routes.test.ts
          src/routes/public-booking.pin-ai.routes.ts
          tsconfig.pin-ai-guest-gateway.json
          EOF
            sort "$RUNNER_TEMP/pin-ai-history-allowed.txt" -o "$RUNNER_TEMP/pin-ai-history-allowed.txt"
            diff -u "$RUNNER_TEMP/pin-ai-history-allowed.txt" "$RUNNER_TEMP/actual.txt"
            python - "$BASE_BRANCH" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          base = subprocess.check_output(["git", "merge-base", "origin/" + sys.argv[1], "HEAD"], text=True).strip()
          schema = subprocess.check_output(["git", "show", base + ":prisma/schema.prisma"], text=True)
          anchor = "  openaiSessionId    String?      @unique @db.VarChar(160)\n"
          additions = "  guestHistoryCiphertext String? @db.Text\n  guestActionReceiptsCiphertext String? @db.Text\n"
          if schema.count(anchor) != 1 or Path("prisma/schema.prisma").read_text() != schema.replace(anchor, anchor + additions, 1):
              raise SystemExit("PR #284 schema must only add the two nullable Pin AI history fields")
          expected_sql = (
              "-- Additive only: existing conversations and provider session identifiers remain intact.\n"
              'ALTER TABLE "PinAIGuestConversation"\n'
              '  ADD COLUMN "guestHistoryCiphertext" TEXT,\n'
              '  ADD COLUMN "guestActionReceiptsCiphertext" TEXT;\n'
          )
          if Path("prisma/migrations/20260927032500_pin_ai_guest_history_v1/migration.sql").read_text() != expected_sql:
              raise SystemExit("PR #284 migration must only add the two nullable Pin AI history columns")
          PY
            echo "PR #284 exact thirteen-file Pin AI history scope verified; continuing all retained OTA certifications."
            exit 0
          fi

          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/message-delivery-outcomes-v1" ]; then
            test "$GITHUB_EVENT_NAME" = "pull_request"
            test "$GITHUB_REPOSITORY" = "freddiefernandezmaysonet-netizen/pin-go-backend"
            test "$SCOPE_HEAD_REPO" = "$GITHUB_REPOSITORY"
            test "$SCOPE_BASE_REPO" = "$GITHUB_REPOSITORY"
            test "$GITHUB_BASE_REF" = "main"
            cat > "$RUNNER_TEMP/message-delivery-outcomes-v1-allowed.txt" <<'EOF'
          .github/workflows/message-delivery-outcomes-v1-certification.yml
          .github/workflows/ota-airbnb-listing-discovery.yml
          .github/workflows/ota-initial-distribution-enablement.yml
          prisma/migrations/20260926174500_add_message_delivery_outcomes_v1/migration.sql
          prisma/schema.prisma
          src/integrations/twilio/twilio.client.ts
          src/routes/message-delivery.webhooks.routes.ts
          src/server.ts
          src/services/guest-journey-communications-delivery-outcome.contract.test.ts
          src/services/guest-journey-communications-delivery-outcome.service.test.ts
          src/services/guest-journey-communications-delivery-outcome.service.ts
