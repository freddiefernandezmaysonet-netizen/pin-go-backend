name: Channex Booking Lifecycle Certification

on:
  push:
    branches:
      - recovery/distribution-engine-v2-channex-lifecycle
  pull_request:
    paths:
      - "src/config/runtime-startup.contract.test.ts"
      - "src/pms/adapters/channex.adapter.ts"
      - "src/pms/adapters/channex.adapter.test.ts"
      - "src/pms/adapters/types.ts"
      - "src/pms/ingest/channex-booking-lifecycle.policy.ts"
      - "src/pms/ingest/channex-booking-lifecycle.policy.test.ts"
      - "src/pms/ingest/channex-booking-lifecycle.service.ts"
      - "src/pms/ingest/channex-runtime-import.smoke.test.ts"
      - "src/pms/ingest/channex-webhook-auth.ts"
      - "src/pms/ingest/channex-webhook-auth.test.ts"
      - "src/pms/ingest/pms-webhook-recovery.policy.ts"
      - "src/pms/ingest/pms-webhook-recovery.policy.test.ts"
      - "src/pms/ingest/webhook.dispatcher.ts"
      - "src/pms/ingest/webhook.routes.ts"
      - "src/pms/ingest/webhook.routes.test.ts"
      - "src/pms/jobs/job.queue.ts"
      - "src/pms/jobs/pms-webhook-execution.policy.ts"
      - "src/pms/jobs/pms-webhook-execution.policy.test.ts"
      - "src/workers/pms-webhook-recovery.config.ts"
      - "src/workers/pms-webhook-recovery.config.test.ts"
      - "src/workers/pms-webhook-recovery.worker.ts"
      - "src/apms/distribution-lifecycle-read-model.service.ts"
      - "src/routes/dashboard.distribution-mission-control.middleware.ts"
      - "src/routes/dashboard.route.ts"
      - "src/services/channex-booking-webhook-registration.service.ts"
      - "src/services/channex-booking-webhook-registration.service.test.ts"
      - "src/services/channex-staging-readiness.policy.ts"
      - "src/services/channex-staging-readiness.policy.test.ts"
      - "src/services/channex-staging-readiness.service.ts"
      - "src/services/channex-certification-evidence.policy.ts"
      - "src/services/channex-certification-evidence.policy.test.ts"
      - "src/services/channex-certification-evidence.service.ts"
      - "src/scripts/configure-channex-staging-booking-webhook.ts"
      - "src/scripts/check-channex-staging-readiness.ts"
      - "src/scripts/collect-channex-certification-evidence.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/channex-adapter-certification.yml"

permissions:
  contents: write

jobs:
  booking-lifecycle-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHANNEX_API_KEY: test-api-key
      CHANNEX_API_BASE_URL: https://staging.channex.io

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact canonical ingest ARI wiring
        id: ingest_patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/services/ingest.service.ts")
          text = path.read_text(encoding="utf-8")

          if "persistChannexAriReservationIntent" in text:
              print("Canonical ingest ARI wiring is already present.")
              Path("/tmp/ingest_patch_applied").write_text("false", encoding="utf-8")
              raise SystemExit(0)

          replacements = [
              (
                  'import { fromZonedTime } from "date-fns-tz";',
                  'import { formatInTimeZone, fromZonedTime } from "date-fns-tz";',
              ),
              (
                  'import { ensureGuestJourneyForConfirmedReservation } from "./guest-journey.service";\n',
                  'import { ensureGuestJourneyForConfirmedReservation } from "./guest-journey.service";\nimport { persistChannexAriReservationIntent } from "../pms/outbound/channex-ari-reservation-producer.service";\n',
              ),
              (
                  '  select: {\n    checkInTime: true,\n    timezone: true,\n    guestAccessMode: true,\n    cleaningNfcEnabled: true,\n  },\n});\n  \n  const propertyCheckInTime',
                  '  select: {\n    organizationId: true,\n    checkInTime: true,\n    timezone: true,\n    guestAccessMode: true,\n    cleaningNfcEnabled: true,\n    distributionEnabled: true,\n    distributionStatus: true,\n  },\n});\n\n  if (!property) {\n    throw new Error("Property not found");\n  }\n  \n  const propertyCheckInTime',
              ),
              (
                  '    const result: IngestReservationResult = await prisma.$transaction(async (tx) => {\n    const { reservation, didChange } = await upsertReservation(tx as any, {',
                  '''    const result: IngestReservationResult = await prisma.$transaction(async (tx) => {
    const ingestKey = buildIngestKey({
      source: p.source,
      propertyId: p.propertyId,
      guestName: p.guestName,
      guestEmail: p.guestEmail ?? null,
      guestPhone: p.guestPhone ?? null,
      roomName: p.roomName ?? null,
      checkIn,
      checkOut,
      externalProvider,
      externalId,
    });

    let previousReservation: {
      checkIn: Date;
      checkOut: Date;
      status: ReservationStatus;
    } | null = null;

    if (externalProvider && externalId) {
      previousReservation = await tx.reservation.findUnique({
        where: {
          propertyId_externalProvider_externalId: {
            propertyId: p.propertyId,
            externalProvider,
            externalId,
          },
        },
        select: {
          checkIn: true,
          checkOut: true,
          status: true,
        },
      });
    }

    if (!previousReservation) {
      previousReservation = await tx.reservation.findUnique({
        where: { ingestKey },
        select: {
          checkIn: true,
          checkOut: true,
          status: true,
        },
      });
    }

    const { reservation, didChange } = await upsertReservation(tx as any, {''',
              ),
              (
                  '      status: p.status ?? undefined,\n    });\n\n    if (reservation.status === ReservationStatus.CANCELLED) {',
                  '''      status: p.status ?? undefined,
    });

    if (
      didChange &&
      property.distributionEnabled &&
      property.distributionStatus === "ACTIVE"
    ) {
      const currentStatus =
        reservation.status === ReservationStatus.ACTIVE
          ? "ACTIVE"
          : reservation.status === ReservationStatus.CANCELLED
          ? "CANCELLED"
          : null;
      const previousStatus =
        previousReservation?.status === ReservationStatus.ACTIVE
          ? "ACTIVE"
          : previousReservation?.status === ReservationStatus.CANCELLED
          ? "CANCELLED"
          : null;

      if (currentStatus) {
        const ariNow = new Date();

        await persistChannexAriReservationIntent({
          db: tx as any,
          organizationId: property.organizationId,
          propertyId: reservation.propertyId,
          reservationId: reservation.id,
          previous:
            previousReservation && previousStatus
              ? {
                  checkIn: previousReservation.checkIn,
                  checkOut: previousReservation.checkOut,
                  status: previousStatus,
                }
              : null,
          current: {
            checkIn: reservation.checkIn,
            checkOut: reservation.checkOut,
            status: currentStatus,
          },
          propertyTimezone: propertyTimeZone,
          todayDateKey: formatInTimeZone(
            ariNow,
            propertyTimeZone,
            "yyyy-MM-dd"
          ),
          now: ariNow,
        });
      }
    }

    if (reservation.status === ReservationStatus.CANCELLED) {''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match, found {count}: {old[:120]!r}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          Path("/tmp/ingest_patch_applied").write_text("true", encoding="utf-8")
          PY

          echo "applied=$(cat /tmp/ingest_patch_applied)" >> "$GITHUB_OUTPUT"
          git diff --check -- src/services/ingest.service.ts
          git diff -- src/services/ingest.service.ts

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Load canonical ingest service
        run: npx tsx -e "import('./src/services/ingest.service.ts').then((m) => { if (typeof m.ingestReservation !== 'function') process.exit(1); })"

      - name: Run focused booking lifecycle tests
        run: npm run test:channex-certification

      - name: Commit certified canonical ingest wiring
        if: steps.ingest_patch.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/ingest.service.ts
          git commit -m "feat: wire reservation availability outbox"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Load booking lifecycle service
        run: npx tsx -e "import('./src/pms/ingest/channex-booking-lifecycle.service.ts').then((m) => { if (typeof m.processChannexBookingWebhookEventById !== 'function') process.exit(1); })"

      - name: Load webhook dispatcher
        run: npx tsx -e "import('./src/pms/ingest/webhook.dispatcher.ts').then((m) => { if (typeof m.dispatchPmsWebhookEventById !== 'function') process.exit(1); })"

      - name: Load API worker handoff queue
        run: npx tsx -e "import('./src/pms/jobs/job.queue.ts').then((m) => { if (typeof m.enqueueProcessWebhookEvent !== 'function') process.exit(1); })"

      - name: Load authenticated webhook routes
        run: npx tsx -e "import('./src/pms/ingest/webhook.routes.ts').then((m) => { if (typeof m.pmsWebhookRouter !== 'function') process.exit(1); })"

      - name: Load recovery worker config
        run: npx tsx -e "import('./src/workers/pms-webhook-recovery.config.ts').then((m) => { if (typeof m.resolvePmsWebhookRecoveryConfig !== 'function') process.exit(1); })"

      - name: Load staging webhook registration service
        run: npx tsx -e "import('./src/services/channex-booking-webhook-registration.service.ts').then((m) => { if (typeof m.configureChannexBookingWebhookForStaging !== 'function') process.exit(1); })"

      - name: Load staging readiness service
        run: npx tsx -e "import('./src/services/channex-staging-readiness.service.ts').then((m) => { if (typeof m.getChannexStagingReadinessReport !== 'function') process.exit(1); })"

      - name: Load certification evidence collector
        run: npx tsx -e "import('./src/services/channex-certification-evidence.service.ts').then((m) => { if (typeof m.collectChannexCertificationEvidence !== 'function') process.exit(1); })"

      - name: Load Distribution lifecycle read model
        run: npx tsx -e "import('./src/apms/distribution-lifecycle-read-model.service.ts').then((m) => { if (typeof m.getDistributionLifecycleSnapshot !== 'function') process.exit(1); })"

      - name: Load Distribution Mission Control middleware
        run: npx tsx -e "import('./src/routes/dashboard.distribution-mission-control.middleware.ts').then((m) => { if (typeof m.dashboardDistributionMissionControlMiddleware !== 'function') process.exit(1); })"
