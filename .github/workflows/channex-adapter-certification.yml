name: Channex Booking Lifecycle Certification

on:
  push:
    branches:
      - recovery/distribution-engine-v2-channex-lifecycle
  pull_request:
    paths:
      - "src/pms/adapters/channex.adapter.ts"
      - "src/pms/adapters/channex.adapter.test.ts"
      - "src/pms/adapters/types.ts"
      - "src/pms/ingest/channex-booking-lifecycle.policy.ts"
      - "src/pms/ingest/channex-booking-lifecycle.policy.test.ts"
      - "src/pms/ingest/channex-booking-lifecycle.service.ts"
      - "src/pms/ingest/channex-runtime-import.smoke.test.ts"
      - "src/pms/ingest/webhook.dispatcher.ts"
      - "src/apms/distribution-lifecycle-read-model.service.ts"
      - "src/routes/dashboard.distribution-mission-control.middleware.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/channex-adapter-certification.yml"

permissions:
  contents: read

jobs:
  booking-lifecycle-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Run Channex booking lifecycle certification tests
        env:
          CHANNEX_API_KEY: test-api-key
          CHANNEX_API_BASE_URL: https://staging.channex.io
        run: npm run test:channex-certification
