name: Apply Guest Journey Operational Worker Once

on:
  push:
    branches:
      - agent/mission-control-engine-readiness-v1-backend
    paths:
      - ".github/workflows/apply-guest-journey-operational-worker-once.yml"

permissions:
  contents: write

concurrency:
  group: mission-control-guest-journey-worker-one-shot
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact sprint branch
        uses: actions/checkout@v4
        with:
          ref: agent/mission-control-engine-readiness-v1-backend
          fetch-depth: 2

      - name: Verify immutable starting point
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="ffd3c265f461ecf3a8c3bb51930ee2ff768a3eb7"
          expected_worker_blob="bc642aaaa624473f6562ab4fdb694520edabe377"
          workflow_path=".github/workflows/apply-guest-journey-operational-worker-once.yml"

          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git hash-object src/workers/reservation.worker.ts)" = "$expected_worker_blob"
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow_path"
          test -z "$(git status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pingo

      - name: Apply exact Guest Journey worker integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/workers/reservation.worker.ts")
          text = path.read_text()

          replacements = [
              (
                  '''import {
            markGuestJourneyReadyForArrival,
            scheduleGuestJourneyAccess,
          } from "../services/guest-journey.service";


          console.log("[reservation.worker] BOOT", new Date().toISOString());
          ''',
                  '''import {
            markGuestJourneyReadyForArrival,
            scheduleGuestJourneyAccess,
          } from "../services/guest-journey.service";
          import {
            reconcileGuestJourneyOperationalIssues,
          } from "../services/guest-journey-operational.service";


          console.log("[reservation.worker] BOOT", new Date().toISOString());
          ''',
              ),
              (
                  '''const WORKER_NAME = 'reservation.worker';
          const POLL_MS = Number(process.env.RESERVATION_WORKER_POLL_MS ?? 10_000);
          const BATCH_SIZE = Number(process.env.RESERVATION_WORKER_BATCH_SIZE ?? 20);
          const REMINDER_ON =
          ''',
                  '''const WORKER_NAME = 'reservation.worker';
          const POLL_MS = Number(process.env.RESERVATION_WORKER_POLL_MS ?? 10_000);
          const BATCH_SIZE = Number(process.env.RESERVATION_WORKER_BATCH_SIZE ?? 20);
          const GUEST_JOURNEY_OPERATIONAL_POLL_MS = Number(
            process.env.GUEST_JOURNEY_OPERATIONAL_POLL_MS ??
              60_000
          );
          const REMINDER_ON =
          ''',
              ),
              (
                  '''// ====== LOOP ======
          let shuttingDown = false;
          let tickRunning = false;

          async function tick() {
          ''',
                  '''// ====== LOOP ======
          let shuttingDown = false;
          let tickRunning = false;
          let guestJourneyOperationalNextRunAt = 0;

          async function processGuestJourneyOperationalReconciliation(
            now: Date
          ) {
            if (
              now.getTime() <
              guestJourneyOperationalNextRunAt
            ) {
              return;
            }

            guestJourneyOperationalNextRunAt =
              now.getTime() +
              GUEST_JOURNEY_OPERATIONAL_POLL_MS;

            const result =
              await reconcileGuestJourneyOperationalIssues(
                prisma,
                now
              );

            if (
              result.processed > 0 ||
              result.failed > 0
            ) {
              log(
                "guest-journey-operational",
                result
              );
            }
          }

          async function tick() {
          ''',
              ),
              (
                  '''    try {
                await processCheckins(now);
                await processPreCheckinMessages(now);
              } catch (e) {
                errLog(
                  "runCheckins crashed:",
                  toErrString(e)
                );
              }
              try {
                const result = await retryPendingNfcSync(
          ''',
                  '''    try {
                await processCheckins(now);
                await processPreCheckinMessages(now);
              } catch (e) {
                errLog(
                  "runCheckins crashed:",
                  toErrString(e)
                );
              }

              try {
                await processGuestJourneyOperationalReconciliation(
                  now
                );
              } catch (e) {
                errLog(
                  "guest-journey-operational crashed:",
                  toErrString(e)
                );
              }

              try {
                const result = await retryPendingNfcSync(
          ''',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(
                      "Expected Guest Journey worker block was not found exactly once"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          test "$(git diff --name-only)" = "src/workers/reservation.worker.ts"
          git diff --check

      - name: Compile and test Guest Journey
        run: |
          npx --yes esbuild@0.28.1 src/workers/reservation.worker.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --target=node22 \
            --packages=external \
            --log-level=warning \
            --outfile=/tmp/reservation-worker.mjs

          npx tsx --test \
            src/services/__tests__/guest-journey-operational.test.ts

      - name: Commit only the reservation worker
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/mission-control-engine-readiness-v1-backend"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workers/reservation.worker.ts
          git diff --cached --check
          git commit -m "feat: run Guest Journey operational reconciliation"
          git push origin HEAD:"$branch"

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/mission-control-engine-readiness-v1-backend"
          workflow_path=".github/workflows/apply-guest-journey-operational-worker-once.yml"

          git rm "$workflow_path"
          git commit -m "chore: remove Guest Journey worker one-shot workflow"
          git push origin HEAD:"$branch"
