name: APMS Tenant Property Scope Patch Gate
# Retrigger after correcting the Owner Runtime selector anchor.

on:
  push:
    branches:
      - agent/apms-enterprise-tenant-property-scope-integrity
    paths:
      - ".github/workflows/apms-tenant-property-scope-patch.yml"

permissions:
  contents: write

concurrency:
  group: apms-tenant-property-scope-patch
  cancel-in-progress: false

jobs:
  patch-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apms-enterprise-tenant-property-scope-integrity
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact isolated base
        shell: bash
        run: |
          set -euo pipefail
          BASE=f2aae7ea3c1895073c177ca2aa3491cd8b9a2e80
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          python - <<'PY'
          import subprocess

          base = "f2aae7ea3c1895073c177ca2aa3491cd8b9a2e80"
          allowed = {
              ".github/workflows/apms-tenant-property-scope-patch.yml",
              ".github/workflows/guest-journey-enterprise-tenant-scope-certification.yml",
              "scripts/patch-apms-tenant-property-scope.py",
              "src/services/guest-journey-tenant-property-scope.policy.ts",
              "src/services/guest-journey-tenant-property-scope.policy.test.ts",
              "tsconfig.guest-journey-enterprise-tenant-scope.json",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...HEAD"],
              text=True,
          ).splitlines())
          if changed != allowed:
              raise SystemExit(
                  f"UNEXPECTED_INITIAL_BRANCH_DIFF expected={sorted(allowed)} actual={sorted(changed)}"
              )
          PY

      - name: Apply exact hierarchical scope patch
        run: |
          python -m py_compile scripts/patch-apms-tenant-property-scope.py
          python scripts/patch-apms-tenant-property-scope.py

      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma

      - name: Hierarchical scope contract and TypeScript
        run: |
          node --import tsx --test src/services/guest-journey-tenant-property-scope.policy.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-tenant-scope.json

      - name: Regress APMS E2 through E6
        run: |
          npm run test:guest-journey-enterprise-e2-shadow
          npm run test:guest-journey-enterprise-e3-reconciler
          npm run test:guest-journey-enterprise-e4-coordination
          npm run test:guest-journey-enterprise-e5-owner-runtime
          npm run test:guest-journey-enterprise-e6-mission-control

      - name: Regress APMS E7 through E13
        run: |
          npm run test:guest-journey-enterprise-e7-communications
          npm run test:guest-journey-enterprise-e8-access-owner
          npm run test:guest-journey-enterprise-e9-financial-owner
          npm run test:guest-journey-enterprise-e10-compliance-owner
          npm run test:guest-journey-enterprise-e11-activation-control-plane
          npm run test:guest-journey-enterprise-e12-runtime-enforcement
          npm run test:guest-journey-enterprise-e13-runtime-truth

      - name: Regress E14 fencing
        run: |
          node --import tsx --test \
            src/e14/guest-access-reservation-target.e14.test.ts \
            src/e14/guest-access-admission-fence.e14.test.ts \
            src/e14/guest-access-reservation-singleton-fence.e14.test.ts \
            src/e14/guest-access-readiness-mission-control.e14.test.ts \
            src/e14/guest-access-e14-structural.e14.test.ts \
            src/e14/guest-access-worker-integration.e14.test.ts
          npx tsc -p tsconfig.guest-journey-enterprise-e14.json

      - name: Bundle legacy yield boundaries
        run: |
          npx esbuild src/workers/reservation.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/reservation.worker.scope.js
          npx esbuild src/workers/message.retry.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/message.retry.worker.scope.js
          npx esbuild src/workers/access-grant-expire.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/access-grant-expire.worker.scope.js
          npx esbuild src/workers/passcode-expire.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/passcode-expire.worker.scope.js
          npx esbuild src/routes/access.nfc.routes.ts --bundle --platform=node --packages=external --outfile=/tmp/access.nfc.routes.scope.js

      - name: Verify exact final scope and preserve schema
        shell: bash
        run: |
          set -euo pipefail
          npx prisma validate --schema prisma/schema.prisma
          git diff --check
          python - <<'PY'
          import subprocess

          base = "f2aae7ea3c1895073c177ca2aa3491cd8b9a2e80"
          config_files = {
              "src/services/guest-journey-shadow.config.ts",
              "src/services/guest-journey-internal-reconcile.config.ts",
              "src/services/guest-journey-coordination.config.ts",
              "src/services/guest-journey-owner-runtime.config.ts",
              "src/services/guest-journey-mission-control.config.ts",
              "src/services/guest-journey-communications-owner.config.ts",
              "src/services/guest-journey-access-owner.config.ts",
              "src/services/guest-journey-financial-owner.config.ts",
              "src/services/guest-journey-compliance-owner.config.ts",
          }
          reservation_cycles = {
              "src/services/guest-journey-shadow-cycle.service.ts",
              "src/services/guest-journey-engine-cycle.service.ts",
              "src/services/guest-journey-coordination-cycle.service.ts",
          }
          intent_cycles = {
              "src/services/guest-journey-owner-runtime-cycle.service.ts",
              "src/services/guest-journey-mission-control-cycle.service.ts",
              "src/services/guest-journey-communications-owner-cycle.service.ts",
              "src/services/guest-journey-access-owner-cycle.service.ts",
              "src/services/guest-journey-financial-owner-cycle.service.ts",
              "src/services/guest-journey-compliance-owner-cycle.service.ts",
          }
          claims = {
              "src/services/guest-journey-owner-runtime.service.ts",
              "src/services/guest-journey-communications-owner-runtime.service.ts",
              "src/services/guest-journey-access-owner-runtime.service.ts",
              "src/services/guest-journey-financial-owner-runtime.service.ts",
              "src/services/guest-journey-compliance-owner-runtime.service.ts",
          }
          adjusted_tests = {
              "src/services/guest-journey-access-owner.config.test.ts",
              "src/services/guest-journey-financial-owner.config.test.ts",
              "src/services/guest-journey-compliance-owner.config.test.ts",
              "src/services/guest-journey-communications-owner.config.test.ts",
          }
          expected = {
              ".github/workflows/apms-tenant-property-scope-patch.yml",
              ".github/workflows/guest-journey-enterprise-tenant-scope-certification.yml",
              "scripts/patch-apms-tenant-property-scope.py",
              "src/services/guest-journey-tenant-property-scope.policy.ts",
              "src/services/guest-journey-tenant-property-scope.policy.test.ts",
              "src/services/guest-journey-activation-control-plane.service.ts",
              "src/services/guest-journey-runtime-enforcement.service.ts",
              "tsconfig.guest-journey-enterprise-tenant-scope.json",
              *config_files,
              *reservation_cycles,
              *intent_cycles,
              *claims,
              *adjusted_tests,
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(
                  f"UNEXPECTED_FINAL_PATCH_SCOPE missing={sorted(expected - changed)} extra={sorted(changed - expected)}"
              )
          forbidden = [
              path for path in changed
              if path == "prisma/schema.prisma"
              or path.startswith("prisma/migrations/")
              or path in {"package.json", "package-lock.json"}
              or "railway" in path.lower()
          ]
          if forbidden:
              raise SystemExit(f"FORBIDDEN_PATCH_FILES:{sorted(forbidden)}")
          PY

      - name: Publish one certified branch commit and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -- scripts/patch-apms-tenant-property-scope.py .github/workflows/apms-tenant-property-scope-patch.yml
          python - <<'PY'
          import subprocess

          base = "f2aae7ea3c1895073c177ca2aa3491cd8b9a2e80"
          expected_count = 33
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base],
              text=True,
          ).splitlines()
          if len(changed) != expected_count:
              raise SystemExit(
                  f"FINAL_FILE_COUNT_MISMATCH expected={expected_count} actual={len(changed)} files={changed}"
              )
          subprocess.run(
              ["git", "diff", "--check"],
              check=True,
          )
          subprocess.run(
              ["git", "add", "--", *changed],
              check=True,
          )
          PY
          git config user.name "freddiefernandezmaysonet-netizen"
          git config user.email "freddiefernandezmaysonet@gmail.com"
          git commit -m "Restore hierarchical APMS tenant property scope"
          git push origin HEAD:agent/apms-enterprise-tenant-property-scope-integrity
