name: Mission Control Observational Reporting Certification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/apms/mission-control-observational*'
      - 'src/routes/dashboard.properties.route.ts'
      - 'src/services/guest-journey-e13-runtime-truth.contract.test.ts'
      - 'src/services/guest-journey-runtime-enforcement.contract.test.ts'
      - '.github/workflows/mission-control-observational-certification.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/unused
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install prisma generate --schema prisma/schema.prisma
      - name: Pure reporting and host-route contracts
        run: node --import tsx --test src/apms/mission-control-observational.test.ts src/apms/mission-control-projection.test.ts src/services/guest-journey-e13-runtime-truth.contract.test.ts src/services/guest-journey-runtime-enforcement.contract.test.ts
      - name: Strict types for the new response boundary
        run: npx --no-install tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext --allowImportingTsExtensions --skipLibCheck --types node src/apms/mission-control-observational.ts src/apms/mission-control-observational.test.ts
      - name: Compile API import graph without executing it
        run: npx --no-install esbuild src/server.ts --bundle --platform=node --format=esm --packages=external --outfile="$RUNNER_TEMP/mission-control-api.mjs"
      - name: Patch whitespace integrity
        run: git diff --check
