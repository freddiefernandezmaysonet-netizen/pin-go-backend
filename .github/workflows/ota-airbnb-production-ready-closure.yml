name: OTA Airbnb Production-Ready Closure

on:
  push:
    branches:
      - agent/airbnb-production-ready-post-auth-closure
  pull_request:
    paths:
      - 'src/distribution/airbnb-lifecycle-webhook.production.ts'
      - 'src/distribution/airbnb-post-auth-production.orchestrator.ts'
      - 'src/distribution/airbnb-missed-activation.recovery.ts'
      - 'src/distribution/airbnb-production-ready-post-auth-closure.test.ts'
      - 'src/routes/channex-channel-lifecycle.webhook.route.ts'
      - 'src/workers/airbnb-post-auth-autopilot.worker.ts'
      - 'scripts/airbnb-casa-collores-missed-activation-recovery.ts'
      - 'tsconfig.ota-airbnb-production-ready-closure.json'
      - '.github/workflows/ota-airbnb-production-ready-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope guard
        shell: bash
        run: |
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              src/distribution/airbnb-lifecycle-webhook.production.ts|\
              src/distribution/airbnb-post-auth-production.orchestrator.ts|\
              src/distribution/airbnb-missed-activation.recovery.ts|\
              src/distribution/airbnb-production-ready-post-auth-closure.test.ts|\
              src/routes/channex-channel-lifecycle.webhook.route.ts|\
              src/workers/airbnb-post-auth-autopilot.worker.ts|\
              scripts/airbnb-casa-collores-missed-activation-recovery.ts|\
              tsconfig.ota-airbnb-production-ready-closure.json|\
              .github/workflows/ota-airbnb-production-ready-closure.yml)
                ;;
              *)
                echo "OUT_OF_SCOPE_FILE=$path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck isolated closure
        run: npx tsc -p tsconfig.ota-airbnb-production-ready-closure.json

      - name: Run isolated closure tests
        run: npx tsx --test src/distribution/airbnb-production-ready-post-auth-closure.test.ts

      - name: Re-run lifecycle route tests
        run: npx tsx --test src/routes/channex-channel-lifecycle.webhook.route.test.ts

      - name: Verify certified Channex core remains frozen
        run: npm run test:channex-certified-core-freeze
