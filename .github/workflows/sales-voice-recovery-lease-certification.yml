name: Sales Voice Recovery Lease Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20261013221500_sales_voice_recovery_lease_v1/migration.sql'
      - 'src/services/sales-voice-recovery-lease.service.ts'
      - 'src/services/sales-voice-recovery-lease.service.test.ts'
      - '.github/workflows/sales-voice-recovery-lease-certification.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingo_sales_watchdog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pingo_sales_watchdog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_sales_watchdog_test
      SALES_WATCHDOG_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_sales_watchdog_test
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact ten-file commercial scope and additive migration only
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const files=execFileSync('git',['diff','--name-only',process.env.BASE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          assert.deepEqual(files,[".github/workflows/ota-airbnb-listing-discovery.yml",".github/workflows/sales-voice-crm-foundation-v1.yml",".github/workflows/sales-voice-live-sip-mount-v1.yml",".github/workflows/sales-voice-main-integration-certification.yml",".github/workflows/sales-voice-recovery-lease-certification.yml","prisma/migrations/20261013221500_sales_voice_recovery_lease_v1/migration.sql","prisma/schema.prisma","src/services/sales-voice-recovery-lease.service.test.ts","src/services/sales-voice-recovery-lease.service.ts","tests/sales-voice-crm-foundation.db.test.mjs"]);
          const before=execFileSync('git',['show',process.env.BASE_SHA+':prisma/schema.prisma'],{encoding:'utf8'});
          const after=readFileSync('prisma/schema.prisma','utf8');
          const addition="  // Durable, fenced sideband recovery ownership. Unused until certified.\n  recoveryLeaseOwner   String?   @db.VarChar(80)\n  recoveryLeaseUntil   DateTime?\n  recoveryLeaseEpoch   Int       @default(0)\n";
          assert.equal(after.split(addition).length,2,'Exactly one lease block required');
          assert.equal(after.replace(addition,''),before,'Existing schema must remain byte-for-byte intact');
          writeFileSync(process.env.RUNNER_TEMP+'/sales-voice-base.prisma',before);
          const sql=readFileSync('prisma/migrations/20261013221500_sales_voice_recovery_lease_v1/migration.sql','utf8');
          assert.match(sql,/ALTER TABLE "SalesVoiceCall"/);
          assert.equal((sql.match(/ADD COLUMN/g)||[]).length,3);
          assert.doesNotMatch(sql,/\b(DROP|DELETE|TRUNCATE|UPDATE|INSERT)\b/i);
          NODE
          git diff --check "$BASE_SHA" HEAD
      - name: Install and generate Prisma
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/prisma validate
          ./node_modules/.bin/prisma generate
      - name: Apply actual migration to populated baseline and verify schema parity
        run: |
          ./node_modules/.bin/prisma db push --schema "$RUNNER_TEMP/sales-voice-base.prisma" --skip-generate
          ./node_modules/.bin/prisma db execute --url "$DATABASE_URL" --stdin <<'SQL'
          INSERT INTO "SalesVoiceCall" ("id","providerCallId","provider","status","lastUsageSeconds","updatedAt")
          VALUES ('recovery-migration-sentinel','live_migration_sentinel','OPENAI_LIVE_SIP','ACCEPTED',17.5,TIMESTAMP '2026-01-01 00:00:00');
          SQL
          ./node_modules/.bin/prisma db execute --url "$DATABASE_URL" --file prisma/migrations/20261013221500_sales_voice_recovery_lease_v1/migration.sql
          ./node_modules/.bin/prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {PrismaClient} from '@prisma/client';
          const db=new PrismaClient();
          try {
            const row=await db.salesVoiceCall.findUniqueOrThrow({where:{id:'recovery-migration-sentinel'}});
            assert.equal(row.status,'ACCEPTED');
            assert.equal(row.lastUsageSeconds,17.5);
            assert.equal(row.updatedAt.toISOString(),'2026-01-01T00:00:00.000Z');
            assert.equal(row.recoveryLeaseOwner,null);
            assert.equal(row.recoveryLeaseUntil,null);
            assert.equal(row.recoveryLeaseEpoch,0);
          } finally { await db.$disconnect(); }
          NODE
      - name: Typecheck and test lease fencing against disposable PostgreSQL
        run: |
          ./node_modules/.bin/tsc --noEmit --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext --esModuleInterop \
            src/services/sales-voice-recovery-lease.service.ts \
            src/services/sales-voice-recovery-lease.service.test.ts
          node --import tsx --test src/services/sales-voice-recovery-lease.service.test.ts
      - name: Safety boundary
        run: |
          echo 'No voice service enabled. No real calls, OpenAI credentials, Twilio changes or network transport.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This lease is unused by production until a separately certified owner-renewal loop is integrated.' >> "$GITHUB_STEP_SUMMARY"
