name: Sales Voice Recovery Lease Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20261013221500_sales_voice_recovery_lease_v1/migration.sql'
      - 'src/services/sales-voice-recovery-lease.service.ts'
      - 'src/services/sales-voice-recovery-lease.service.test.ts'
      - '.github/workflows/sales-voice-recovery-lease-certification.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingo_sales_watchdog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pingo_sales_watchdog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_sales_watchdog_test
      SALES_WATCHDOG_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_sales_watchdog_test
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact five-file scope and additive migration only
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const files=execFileSync('git',['diff','--name-only',process.env.BASE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          assert.deepEqual(files,[
            '.github/workflows/sales-voice-recovery-lease-certification.yml',
            'prisma/migrations/20261013221500_sales_voice_recovery_lease_v1/migration.sql',
            'prisma/schema.prisma',
            'src/services/sales-voice-recovery-lease.service.test.ts',
            'src/services/sales-voice-recovery-lease.service.ts',
          ]);
          const sql=readFileSync('prisma/migrations/20261013221500_sales_voice_recovery_lease_v1/migration.sql','utf8');
          assert.match(sql,/ALTER TABLE "SalesVoiceCall"/);
          assert.equal((sql.match(/ADD COLUMN/g)||[]).length,3);
          assert.doesNotMatch(sql,/\b(DROP|DELETE|TRUNCATE|UPDATE|INSERT)\b/i);
          NODE
          git diff --check "$BASE_SHA" HEAD
      - name: Install and generate Prisma
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/prisma validate
          ./node_modules/.bin/prisma generate
      - name: Typecheck and test lease fencing against disposable PostgreSQL
        run: |
          ./node_modules/.bin/tsc --noEmit --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext --esModuleInterop \
            src/services/sales-voice-recovery-lease.service.ts \
            src/services/sales-voice-recovery-lease.service.test.ts
          ./node_modules/.bin/prisma db push --skip-generate
          node --import tsx --test src/services/sales-voice-recovery-lease.service.test.ts
      - name: Safety boundary
        run: |
          echo 'No voice service enabled. No real calls, OpenAI credentials, Twilio changes or network transport.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This lease is unused by production until a separately certified owner-renewal loop is integrated.' >> "$GITHUB_STEP_SUMMARY"
