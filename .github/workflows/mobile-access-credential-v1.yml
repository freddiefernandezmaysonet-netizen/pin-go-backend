name: Mobile Access Credential V1

on:
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/20260929113000_mobile_access_credential_foundation_v1/**"
      - "prisma/migrations/20260929135000_ttlock_recipient_identity_foundation_v1/**"
      - "prisma/migrations/20260929162500_mobile_access_revoke_recovery_v1/**"
      - "src/guest-mobile/mobile-access-**"
      - "src/workers/mobile-access-recovery.worker.ts"
      - "tsconfig.mobile-access-credential-v1.json"
      - ".github/workflows/mobile-access-credential-v1.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://mobile_access_ci:mobile_access_ci@127.0.0.1:5432/mobile_access_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx tsc -p tsconfig.mobile-access-credential-v1.json --pretty false
      - run: npx tsx --test src/guest-mobile/mobile-access-credential-foundation.contract.test.ts src/guest-mobile/mobile-access-provisioning.contract.test.ts src/guest-mobile/ttlock-recipient-identity.contract.test.ts src/guest-mobile/ttlock-recipient-retention.contract.test.ts src/guest-mobile/ttlock-mobile-access-provider.contract.test.ts src/guest-mobile/mobile-access-revocation.contract.test.ts src/guest-mobile/mobile-access-revocation-executor.contract.test.ts src/guest-mobile/mobile-access-issuance.contract.test.ts src/guest-mobile/ttlock-recipient-identity.service.contract.test.ts src/guest-mobile/mobile-access-on-demand.contract.test.ts src/guest-mobile/mobile-access-delivery.contract.test.ts src/guest-mobile/mobile-access-prepare-route.contract.test.ts src/guest-mobile/ttlock-recipient-delete.contract.test.ts src/guest-mobile/mobile-access-recovery.contract.test.ts src/guest-mobile/mobile-access-recovery-worker.contract.test.ts src/guest-mobile/mobile-access-revocation-observer.contract.test.ts
