name: OTA Connection Reconciliation E1 Certification

on:
  push:
    branches:
      - agent/ota-connection-reconciliation-e1
  pull_request:
    paths:
      - "src/distribution/channex-channel-lifecycle.evidence.ts"
      - "src/distribution/channex-channel-lifecycle.evidence.test.ts"
      - "src/routes/channex-channel-lifecycle.webhook.route.ts"
      - "src/routes/channex-channel-lifecycle.webhook.route.test.ts"
      - "tsconfig.ota-connection-reconciliation-e1.json"
      - ".github/workflows/ota-connection-reconciliation-e1-certification.yml"

permissions:
  contents: read

jobs:
  reconciliation-evidence-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/pingo_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate --schema ./prisma

      - name: Type-check E1 boundary
        run: npx tsc -p tsconfig.ota-connection-reconciliation-e1.json

      - name: Run E1 evidence and webhook contract tests
        run: >-
          npx tsx --test
          src/distribution/channex-channel-lifecycle.evidence.test.ts
          src/routes/channex-channel-lifecycle.webhook.route.test.ts

      - name: Verify certified Channex core remains frozen
        run: npx tsx --test src/contracts/channex-certified-core.freeze.test.ts
