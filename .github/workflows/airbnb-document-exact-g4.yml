name: Airbnb Document-Exact Gate 4 (backend)

on:
  push:
    branches:
      - agent/airbnb-document-exact-closure

permissions:
  contents: read

jobs:
  mapping-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact working branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run prior gates plus document-derived mapping preflight tests
        run: node --import tsx --test src/distribution/airbnb-host-self-service.service.test.ts src/distribution/airbnb-host-self-service.callback-verifier.test.ts src/distribution/airbnb-host-self-service.listings.test.ts src/distribution/airbnb-host-self-service.listings-route.test.js src/distribution/airbnb-host-self-service.mapping-plan.test.ts src/distribution/airbnb-host-self-service.mapping-plan-route.test.js src/distribution/ota-connection-center.runtime-composition.test.ts
      - name: Typecheck Gate 4 isolated production modules
        run: ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --types node src/distribution/airbnb-host-self-service.mapping-plan.service.ts src/distribution/airbnb-host-self-service.listings.service.ts src/distribution/airbnb-host-self-service.listings.http-transport.ts
      - name: Prove route diagnostics do not regress from Gate 3
        run: |
          baseline=$(mktemp -d)
          git archive 91d6abe22134466a7c8888aeb6dd7ccd3f1ac314 src package.json | tar -x -C "$baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          tsc="$GITHUB_WORKSPACE/node_modules/.bin/tsc"
          flags=(--noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --types node)
          set +e
          (cd "$baseline" && "$tsc" "${flags[@]}" src/routes/dashboard.airbnb-host-self-service.route.ts) > "$RUNNER_TEMP/g4-baseline-types.txt" 2>&1
          baseline_status=$?
          "$tsc" "${flags[@]}" src/routes/dashboard.airbnb-host-self-service.route.ts > "$RUNNER_TEMP/g4-current-types.txt" 2>&1
          current_status=$?
          set -e
          cat "$RUNNER_TEMP/g4-current-types.txt"
          test "$current_status" -eq "$baseline_status"
          diff -u "$RUNNER_TEMP/g4-baseline-types.txt" "$RUNNER_TEMP/g4-current-types.txt"
          echo 'Route diagnostics match Gate 3 baseline; this is not a clean full-backend typecheck.'
      - name: Prove protected certified surfaces remain unchanged
        run: git diff --exit-code 2c82832fb84b112ea81037efff8f526dd48470ab -- src/distribution/channex-channel-identity.ts src/distribution/channex-readonly.http-transport.ts src/distribution/channex-white-label.http-transport.ts src/distribution/distribution-mutation-security.ts src/middleware/requireAuth.ts prisma src/workers
      - name: Prove mapping preflight has no Channex mapping executor
        run: |
          ! grep -E 'fetch\(|\.send\(|/api/v1/channels/.*/mappings|load_future_reservations|/activate' src/distribution/airbnb-host-self-service.mapping-plan.service.ts
          ! grep -E 'router\.(post|put|patch|delete)\([^\n]*mapping' src/routes/dashboard.airbnb-host-self-service.route.ts
