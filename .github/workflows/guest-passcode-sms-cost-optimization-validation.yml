name: Guest Passcode SMS Cost Optimization Validation

on:
  push:
    branches:
      - agent/guest-passcode-sms-cost-optimization-v1
    paths:
      - ".github/workflows/guest-passcode-sms-cost-optimization-validation.yml"
      - "src/services/messaging.service.ts"
      - "src/services/messaging.guest-passcode-sms-cost-optimization.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Guest passcode SMS cost optimization tests
        run: npx tsx --test src/services/messaging.guest-passcode-sms-cost-optimization.test.ts
      - name: Bundle messaging service
        run: npx esbuild src/services/messaging.service.ts --bundle --platform=node --packages=external --outfile=/tmp/messaging.service.js
