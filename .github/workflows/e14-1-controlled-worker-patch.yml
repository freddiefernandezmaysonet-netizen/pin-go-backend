name: E14.1 Detached Final Certification Gate

on:
  push:
    branches:
      - agent/apms-enterprise-guest-journey-e14-access-admission-fencing
    paths:
      - ".github/workflows/e14-1-controlled-worker-patch.yml"

permissions:
  contents: read

jobs:
  certify-detached-e14-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd4c4446b97c1afa033a2631db794807ca041f1e
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: E14.1 focused behavior and safety tests
        run: |
          node --import tsx --test \
            src/e14/guest-access-admission-fence.e14.test.ts \
            src/e14/guest-access-reservation-singleton-fence.e14.test.ts \
            src/e14/guest-access-readiness-mission-control.e14.test.ts \
            src/e14/guest-access-e14-structural.e14.test.ts \
            src/e14/guest-access-worker-integration.e14.test.ts

      - name: E14.1 strict TypeScript
        run: npx tsc -p tsconfig.guest-journey-enterprise-e14.json

      - name: Reservation worker integration boundary
        run: |
          npx esbuild src/workers/reservation.worker.ts \
            --bundle \
            --platform=node \
            --packages=external \
            --outfile=/tmp/reservation.worker.e14.1.js

      - name: Prisma and final-tree safety
        env:
          DATABASE_URL: postgresql://pin_go_e14_ci:pin_go_e14_ci@127.0.0.1:5432/pin_go_e14_ci?schema=public
        run: |
          npx prisma validate --schema ./prisma
          git diff --check 842e59ac8ed7b30843b27d44c8e4c78a6633f630..HEAD
          git diff --quiet 549f25727d2fd6050ff5bd3db6d90427bb014585 HEAD -- prisma/schema.prisma prisma/migrations
          test ! -e .github/workflows/e14-1-controlled-worker-patch.yml
          test "$(git rev-parse HEAD)" = "bd4c4446b97c1afa033a2631db794807ca041f1e"
