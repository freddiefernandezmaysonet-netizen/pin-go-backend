name: OTA Airbnb Host-Confirmed Mapping Certification

on:
  push:
    branches:
      - agent/airbnb-host-confirmed-mapping-safe
      - agent/airbnb-mapping-channel-id-preflight-fix-safe
  pull_request:
    paths:
      - 'src/distribution/airbnb-host-activation.http-transport.ts'
      - 'src/distribution/airbnb-host-activation.http-transport.test.ts'
      - 'src/distribution/airbnb-host-activation.service.ts'
      - 'src/distribution/airbnb-host-activation.service.test.ts'
      - 'src/distribution/airbnb-host-confirmed-mapping.http-transport.ts'
      - 'src/distribution/airbnb-host-confirmed-mapping.http-transport.test.ts'
      - 'src/distribution/airbnb-host-confirmed-mapping.service.ts'
      - 'src/distribution/airbnb-host-confirmed-mapping.service.test.ts'
      - 'src/distribution/channex-airbnb-transport-readiness.policy.ts'
      - 'src/distribution/channex-airbnb-transport-readiness.policy.test.ts'
      - 'src/distribution/channex-canonical-readiness.service.ts'
      - 'src/distribution/channex-canonical-readiness.service.test.ts'
      - 'src/distribution/channex-channel-identity.ts'
      - 'src/distribution/channex-channel-identity.test.ts'
      - 'src/distribution/channex-channel-lifecycle.evidence.ts'
      - 'src/distribution/channex-channel-lifecycle.evidence.test.ts'
      - 'src/routes/dashboard.airbnb-host-self-service.route.ts'
      - 'src/routes/dashboard.airbnb-host-self-service.activation.route.test.ts'
      - 'src/routes/dashboard.airbnb-host-self-service.mapping.route.test.ts'
      - 'src/distribution/ota-connection-center.runtime-composition.ts'
      - 'src/distribution/ota-connection-center.runtime-composition.test.ts'
      - '.github/workflows/ota-airbnb-host-confirmed-mapping.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-confirmed-mapping-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/pingo_test
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate and validate Prisma client
        run: |
          npx prisma generate
          npx prisma validate --schema ./prisma/schema.prisma

      - name: Prove exact narrow diff allowlist
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | sort > "$RUNNER_TEMP/actual.txt"
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/vrbo-self-service-connection-center" ]; then
            cat > "$RUNNER_TEMP/vrbo-allowed.txt" <<'EOF'
          .github/workflows/booking-com-transport-readiness.yml
          .github/workflows/booking-com-white-label-safe.yml
          .github/workflows/ota-airbnb-host-confirmed-mapping.yml
          .github/workflows/ota-airbnb-listing-discovery.yml
          package.json
          src/contracts/channex-certified-core.freeze.test.ts
          src/distribution/channex-canonical-readiness.service.ts
          src/distribution/channex-vrbo-transport-readiness.policy.test.ts
          src/distribution/channex-vrbo-transport-readiness.policy.ts
          src/distribution/channex-white-label.adapter.test.ts
          src/distribution/channex-white-label.adapter.ts
          src/distribution/connection-center.read-model.test.ts
          src/distribution/connection-center.read-model.ts
          src/distribution/ota-connection-center.config.test.ts
          src/distribution/ota-connection-center.config.ts
          src/distribution/ota-connection-center.runtime-composition.test.ts
          src/distribution/ota-connection-session.service.ts
          src/distribution/ota-distribution-persistence.service.test.ts
          src/distribution/ota-distribution-persistence.service.ts
          src/routes/dashboard.distribution-connection-center.route.ts
          EOF
            sort "$RUNNER_TEMP/vrbo-allowed.txt" -o "$RUNNER_TEMP/vrbo-allowed.txt"
            diff -u "$RUNNER_TEMP/vrbo-allowed.txt" "$RUNNER_TEMP/actual.txt"
            exit 0
          fi
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/expedia-connection-center-backend" ]; then
            cat > "$RUNNER_TEMP/expedia-allowed.txt" <<'EOF'
          .github/workflows/booking-com-transport-readiness.yml
          .github/workflows/booking-com-white-label-safe.yml
          .github/workflows/ota-airbnb-host-confirmed-mapping.yml
          .github/workflows/ota-airbnb-listing-discovery.yml
          package.json
          src/contracts/channex-certified-core.freeze.test.ts
          src/distribution/channex-canonical-readiness.service.test.ts
          src/distribution/channex-canonical-readiness.service.ts
          src/distribution/channex-channel-lifecycle.evidence.test.ts
          src/distribution/channex-channel-lifecycle.evidence.ts
          src/distribution/channex-expedia-transport-readiness.policy.test.ts
          src/distribution/channex-expedia-transport-readiness.policy.ts
          src/distribution/channex-white-label.adapter.test.ts
          src/distribution/channex-white-label.adapter.ts
          src/distribution/connection-center.read-model.test.ts
          src/distribution/connection-center.read-model.ts
          src/distribution/ota-connection-center.config.test.ts
          src/distribution/ota-connection-center.config.ts
          src/distribution/ota-connection-session.service.test.ts
          src/distribution/ota-connection-session.service.ts
          src/distribution/ota-distribution-persistence.service.test.ts
          src/distribution/ota-distribution-persistence.service.ts
          src/routes/dashboard.distribution-connection-center.route.test.ts
          src/routes/dashboard.distribution-connection-center.route.ts
          EOF
            sort "$RUNNER_TEMP/expedia-allowed.txt" -o "$RUNNER_TEMP/expedia-allowed.txt"
            diff -u "$RUNNER_TEMP/expedia-allowed.txt" "$RUNNER_TEMP/actual.txt"
            exit 0
          fi
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          .github/workflows/ota-airbnb-host-confirmed-mapping.yml
          .github/workflows/ota-airbnb-listing-discovery.yml
          package.json
          prisma/migrations/20260911153000_add_property_postal_code/migration.sql
          prisma/schema.prisma
          src/distribution/airbnb-host-activation.http-transport.test.ts
          src/distribution/airbnb-host-activation.http-transport.ts
          src/distribution/airbnb-host-activation.service.test.ts
          src/distribution/airbnb-host-activation.service.ts
          src/distribution/airbnb-host-confirmed-mapping.http-transport.test.ts
          src/distribution/airbnb-host-confirmed-mapping.http-transport.ts
          src/distribution/airbnb-host-confirmed-mapping.service.test.ts
          src/distribution/airbnb-host-confirmed-mapping.service.ts
          src/distribution/airbnb-host-self-service.listings.http-transport.ts
          src/distribution/airbnb-host-self-service.listings.service.test.ts
          src/distribution/airbnb-host-self-service.listings.service.ts
          src/distribution/airbnb-property-auto-matching.test.ts
          src/distribution/airbnb-property-auto-matching.ts
          src/distribution/channex-airbnb-listings.transport.test.ts
          src/distribution/channex-airbnb-transport-readiness.policy.test.ts
          src/distribution/channex-airbnb-transport-readiness.policy.ts
          src/distribution/channex-canonical-readiness.service.test.ts
          src/distribution/channex-canonical-readiness.service.ts
          src/distribution/channex-channel-lifecycle-webhook-registration.http-transport.test.ts
          src/distribution/channex-channel-lifecycle-webhook-registration.http-transport.ts
          src/distribution/channex-channel-lifecycle-webhook-registration.test.ts
          src/distribution/channex-channel-lifecycle-webhook-registration.ts
          src/distribution/channex-channel-identity.test.ts
          src/distribution/channex-channel-identity.ts
          src/distribution/channex-channel-lifecycle.evidence.test.ts
          src/distribution/channex-channel-lifecycle.evidence.ts
          src/distribution/ota-connection-center.runtime-composition.test.ts
          src/distribution/ota-connection-center.runtime-composition.ts
          src/distribution/ota-connection-center.composition.test.ts
          src/distribution/ota-connection-center.composition.ts
          src/routes/dashboard.airbnb-host-self-service.activation.route.test.ts
          src/routes/dashboard.airbnb-host-self-service.listings.route.test.ts
          src/routes/dashboard.airbnb-host-self-service.mapping.route.test.ts
          src/routes/dashboard.airbnb-host-self-service.route.ts
          src/routes/dashboard.properties.route.ts
          src/routes/properties.route.ts
          EOF
          sort "$RUNNER_TEMP/allowed.txt" -o "$RUNNER_TEMP/allowed.txt"
          comm -23 "$RUNNER_TEMP/actual.txt" "$RUNNER_TEMP/allowed.txt" > "$RUNNER_TEMP/outside.txt"
          test ! -s "$RUNNER_TEMP/outside.txt" || {
            echo "OUT_OF_SCOPE_FILES"
            cat "$RUNNER_TEMP/outside.txt"
            exit 1
          }

      - name: Prove unaffected certified Channex transports and workers remain frozen
        run: |
          git diff --exit-code origin/main...HEAD -- \
            prisma \
            src/pms \
            src/workers \
            src/distribution/channex-readonly.http-transport.ts \
            src/distribution/channex-white-label.http-transport.ts

      - name: Verify certified Channex core fingerprint
        run: npm run test:channex-certified-core-freeze

      - name: Type-check coordinated lifecycle, readiness and activation boundaries
        run: |
          npx tsc -p tsconfig.ota-connection-reconciliation-e1.json --noEmit
          npx tsc -p tsconfig.ota-connection-reconciliation-e2.json --noEmit
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution Bundler --types node --skipLibCheck \
            src/distribution/airbnb-host-activation.http-transport.ts \
            src/distribution/airbnb-host-activation.service.ts

      - name: Run coordinated lifecycle, readiness and activation certification
        run: |
          node --import tsx --test \
            src/distribution/channex-channel-identity.test.ts \
            src/distribution/channex-channel-lifecycle.evidence.test.ts \
            src/distribution/channex-airbnb-transport-readiness.policy.test.ts \
            src/distribution/channex-canonical-readiness.service.test.ts \
            src/distribution/airbnb-host-activation.service.test.ts \
            src/distribution/ota-connection-center.runtime-composition.test.ts

      - name: Prove mapping-only documented provider surface
        shell: bash
        run: |
          grep -F '/api/v1/channels/' src/distribution/airbnb-host-confirmed-mapping.http-transport.ts
          grep -F '/mappings' src/distribution/airbnb-host-confirmed-mapping.http-transport.ts
          grep -F 'rate_plan_id' src/distribution/airbnb-host-confirmed-mapping.http-transport.ts
          grep -F 'listing_id' src/distribution/airbnb-host-confirmed-mapping.http-transport.ts
          grep -F 'CONFIRM_AIRBNB_PROPERTY_MAPPING' src/distribution/airbnb-host-confirmed-mapping.service.ts
          grep -F 'channelId !== args.channelId' src/distribution/airbnb-host-confirmed-mapping.service.ts
          ! grep -E 'attributeId.*args\.channelId|attributes\.id.*args\.channelId' \
            src/distribution/airbnb-host-confirmed-mapping.service.ts
          ! grep -R -E '/activate|load_future_reservations|check_readiness|/restrictions|/availability' \
            src/distribution/airbnb-host-confirmed-mapping.http-transport.ts \
            src/distribution/airbnb-host-confirmed-mapping.service.ts \
            src/routes/dashboard.airbnb-host-self-service.mapping.route.test.ts

      - name: Type-check isolated mapping modules
        run: |
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --types node \
            src/distribution/airbnb-host-confirmed-mapping.http-transport.ts \
            src/distribution/airbnb-host-confirmed-mapping.service.ts

      - name: Run mapping and retained Airbnb regressions
        run: |
          node --import tsx --test \
            src/distribution/airbnb-host-confirmed-mapping.http-transport.test.ts \
            src/distribution/airbnb-host-confirmed-mapping.service.test.ts \
            src/routes/dashboard.airbnb-host-self-service.mapping.route.test.ts \
            src/routes/dashboard.airbnb-host-self-service.listings.route.test.ts \
            src/distribution/airbnb-host-self-service.listings.service.test.ts \
            src/distribution/airbnb-property-auto-matching.test.ts

      - name: Prove activation is isolated from mapping, ARI mutation and reservation import
        shell: bash
        run: |
          grep -F '/api/v1/channels/${channelId}/activate' \
            src/distribution/airbnb-host-activation.http-transport.ts
          grep -F 'CONFIRM_AIRBNB_ACTIVATION' \
            src/distribution/airbnb-host-activation.service.ts
          ! grep -R -E 'load_future_reservations|/mappings' \
            src/distribution/airbnb-host-activation.http-transport.ts \
            src/distribution/airbnb-host-activation.service.ts
          ! grep -R -E '(distributionOutboxEvent|channexAriDelivery|channexAriDeliveryAttempt|channexAriPropertyState|pmsListing|distributionProperty)\.(create|createMany|update|updateMany|upsert|delete|deleteMany)' \
            src/distribution/airbnb-host-activation.http-transport.ts \
            src/distribution/airbnb-host-activation.service.ts

      - name: Run host activation certification
        run: |
          node --import tsx --test \
            src/distribution/airbnb-host-activation.http-transport.test.ts \
            src/routes/dashboard.airbnb-host-self-service.activation.route.test.ts
