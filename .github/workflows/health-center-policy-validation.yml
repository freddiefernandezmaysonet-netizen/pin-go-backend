name: Health Center Policy Validation

on:
  push:
    branches:
      - agent/health-center-policy-alignment
    paths:
      - ".github/workflows/health-center-policy-validation.yml"
      - "src/domain/computeOperationalRisk.ts"
      - "src/domain/computeOperationalRisk.test.ts"
      - "src/routes/dashboard.health.routes.ts"
      - "src/routes/dashboard.health.routes.contract.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Focused tests
        run: npx tsx --test src/domain/computeOperationalRisk.test.ts src/routes/dashboard.health.routes.contract.test.ts
      - name: Bundle runtime boundaries
        run: |
          npx esbuild src/domain/computeOperationalRisk.ts --bundle --platform=node --packages=external --outfile=/tmp/computeOperationalRisk.js
          npx esbuild src/routes/dashboard.health.routes.ts --bundle --platform=node --packages=external --outfile=/tmp/dashboard.health.routes.js
          npx esbuild src/workers/deviceHealth.hardened.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/deviceHealth.hardened.worker.js
