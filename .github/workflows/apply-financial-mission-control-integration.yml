name: Apply Financial Mission Control Integration

on:
  push:
    branches:
      - agent/mission-control-engine-readiness-v1-backend
    paths:
      - ".github/workflows/apply-financial-mission-control-integration.yml"
      - ".github/patches/financial-mission-control-integration.patch"

permissions:
  contents: write

jobs:
  apply-financial-integration:
    name: Apply reviewed Financial integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout sprint branch
        uses: actions/checkout@v4
        with:
          ref: agent/mission-control-engine-readiness-v1-backend
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pingo

      - name: Verify patch applies cleanly
        run: git apply --check .github/patches/financial-mission-control-integration.patch

      - name: Apply reviewed patch
        run: git apply .github/patches/financial-mission-control-integration.patch

      - name: Verify only Mission Control service changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(git diff --name-only)

          if (( ${#changed_files[@]} != 1 )); then
            printf 'Unexpected changed files:\n%s\n' "${changed_files[*]}"
            exit 1
          fi

          if [[ "${changed_files[0]}" != "src/apms/mission-control.service.ts" ]]; then
            printf 'Unexpected changed file: %s\n' "${changed_files[0]}"
            exit 1
          fi

          git diff --check

      - name: Compile Mission Control service
        run: |
          npx --yes esbuild@0.28.1 src/apms/mission-control.service.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --target=node22 \
            --packages=external \
            --log-level=warning \
            --outfile=/tmp/mission-control-service.mjs

      - name: Run Mission Control Engine tests
        run: |
          npx tsx --test \
            src/apms/__tests__/mission-control-read-model.test.ts \
            src/apms/__tests__/device-health-ownership.test.ts \
            src/apms/__tests__/financial-mission-control.adapter.test.ts \
            src/services/__tests__/access-recovery-operational.test.ts

      - name: Commit only the reviewed service change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apms/mission-control.service.ts
          git diff --cached --check
          git commit -m "feat: integrate financial mission control states"
          git push origin HEAD:agent/mission-control-engine-readiness-v1-backend
