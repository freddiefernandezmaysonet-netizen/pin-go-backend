name: OTA Initial Distribution Enablement
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/distribution/ota-initial-distribution-enablement.service.ts'
      - 'src/distribution/ota-initial-distribution-enablement.service.test.ts'
      - 'src/distribution/ota-connection-center.composition.ts'
      - 'src/distribution/ota-connection-center.runtime-composition.ts'
      - '.github/workflows/ota-initial-distribution-enablement.yml'
      - '.github/workflows/ota-airbnb-listing-discovery.yml'
      - '.github/workflows/ota-airbnb-host-confirmed-mapping.yml'
permissions:
  contents: read
concurrency:
  group: ota-initial-enablement-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/test
      NODE_ENV: test
      OTA_CONNECTION_CENTER_ENABLED: 'false'
      OTA_CHANNEL_LIFECYCLE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma validate --schema ./prisma
      - name: Focused first-enablement and orchestration tests (mocked I/O)
        run: node --import tsx --test src/distribution/ota-initial-distribution-enablement.service.test.ts src/distribution/ota-connection-center.composition.test.ts src/distribution/ota-connection-center.runtime-composition.test.ts src/distribution/ota-provisioning.repository.test.ts
      - name: Typecheck runtime and focused tests
        run: |
          npx tsc -p tsconfig.ota-commercial-closure.json
          node -e 'require("fs").writeFileSync("tsconfig.ota-initial-ci.json", JSON.stringify({extends:"./tsconfig.ota-commercial-closure.json",include:["src/distribution/ota-initial-distribution-enablement.service.test.ts"]}))'
          npx tsc -p tsconfig.ota-initial-ci.json
          rm tsconfig.ota-initial-ci.json
      - name: Existing activation, Full Sync and certified-core protections
        run: node --import tsx --test src/distribution/airbnb-host-activation.service.test.ts src/routes/dashboard.channex-full-sync.route.test.ts src/contracts/channex-certified-core.freeze.test.ts
      - name: Exact scope and whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCOPE_PR_NUMBER: ${{ github.event.pull_request.number }}
          SCOPE_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SCOPE_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          git diff --check "$BASE_SHA"...HEAD
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/ota-initial-changed.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          allowed = {
            'src/distribution/ota-initial-distribution-enablement.service.ts',
            'src/distribution/ota-initial-distribution-enablement.service.test.ts',
            'src/distribution/ota-connection-center.composition.ts',
            'src/distribution/ota-connection-center.runtime-composition.ts',
            '.github/workflows/ota-initial-distribution-enablement.yml',
          }
          changed = set(Path('/tmp/ota-initial-changed.txt').read_text().splitlines())
          if os.environ.get('GITHUB_HEAD_REF') == 'agent/message-delivery-outcomes-v1':
            repo = 'freddiefernandezmaysonet-netizen/pin-go-backend'
            if not (
              os.environ.get('GITHUB_EVENT_NAME') == 'pull_request'
              and os.environ.get('GITHUB_REPOSITORY') == repo
              and os.environ.get('SCOPE_HEAD_REPO') == repo
              and os.environ.get('SCOPE_BASE_REPO') == repo
              and os.environ.get('GITHUB_BASE_REF') == 'main'
            ):
              raise SystemExit('Message Delivery Outcomes V1 repository/branch scope mismatch')
            allowed = {
              '.github/workflows/message-delivery-outcomes-v1-certification.yml',
              '.github/workflows/ota-airbnb-listing-discovery.yml',
              '.github/workflows/ota-initial-distribution-enablement.yml',
              'prisma/migrations/20260926174500_add_message_delivery_outcomes_v1/migration.sql',
              'prisma/schema.prisma',
              'src/integrations/twilio/twilio.client.ts',
              'src/routes/message-delivery.webhooks.routes.ts',
              'src/server.ts',
              'src/services/guest-journey-communications-delivery-outcome.contract.test.ts',
              'src/services/guest-journey-communications-delivery-outcome.service.test.ts',
              'src/services/guest-journey-communications-delivery-outcome.service.ts',
              'tsconfig.message-delivery-outcomes-v1.json',
            }
            if changed != allowed:
              raise SystemExit(f'Message Delivery Outcomes V1 exact twelve-file scope required: {sorted(changed ^ allowed)}')
            raise SystemExit(0)
          if os.environ.get('GITHUB_HEAD_REF') == 'agent/listing-experience-tags-v1':
            repo = 'freddiefernandezmaysonet-netizen/pin-go-backend'
            if not (
              os.environ.get('GITHUB_EVENT_NAME') == 'pull_request'
              and os.environ.get('GITHUB_REPOSITORY') == repo
              and os.environ.get('SCOPE_PR_NUMBER') == '260'
              and os.environ.get('SCOPE_HEAD_REPO') == repo
              and os.environ.get('SCOPE_BASE_REPO') == repo
              and os.environ.get('GITHUB_BASE_REF') == 'main'
            ):
              raise SystemExit('PR #260 repository/branch scope mismatch')
            allowed = {
              '.github/workflows/listing-experience-tags-v1.yml',
              '.github/workflows/ota-airbnb-listing-discovery.yml',
              '.github/workflows/ota-initial-distribution-enablement.yml',
              'prisma/migrations/20260925221500_add_listing_experience_tags_v1/migration.sql',
              'prisma/schema.prisma',
              'src/routes/dashboard.property-listing-details.routes.test.ts',
              'src/routes/dashboard.property-listing-details.routes.ts',
              'src/services/property-listing-details.service.test.ts',
              'src/services/property-listing-details.service.ts',
            }
            if changed != allowed:
              raise SystemExit(f'PR #260 exact nine-file scope required: {sorted(changed ^ allowed)}')
            raise SystemExit(0)
          if os.environ.get('GITHUB_HEAD_REF') == 'agent/listing-discovery-schema-main-sync':
            repo = 'freddiefernandezmaysonet-netizen/pin-go-backend'
            if not (
              os.environ.get('GITHUB_EVENT_NAME') == 'pull_request'
              and os.environ.get('GITHUB_REPOSITORY') == repo
              and os.environ.get('SCOPE_PR_NUMBER') == '258'
              and os.environ.get('SCOPE_HEAD_REPO') == repo
              and os.environ.get('SCOPE_BASE_REPO') == repo
              and os.environ.get('GITHUB_BASE_REF') == 'main'
            ):
              raise SystemExit('PR #258 repository/branch scope mismatch')
            allowed = {
              '.github/workflows/listing-discovery-schema-main-sync.yml',
              '.github/workflows/ota-airbnb-listing-discovery.yml',
              '.github/workflows/ota-initial-distribution-enablement.yml',
              'prisma/migrations/20260924131500_add_listing_property_type/migration.sql',
              'prisma/migrations/20260924133000_add_listing_features_v1/migration.sql',
              'prisma/schema.prisma',
            }
            if changed != allowed:
              raise SystemExit(f'PR #258 exact six-file scope required: {sorted(changed ^ allowed)}')
            raise SystemExit(0)
          if os.environ.get('GITHUB_HEAD_REF') == 'agent/property-protection-v1-payment-attempt-foundation':
            repo = 'freddiefernandezmaysonet-netizen/pin-go-backend'
            if not (
              os.environ.get('GITHUB_EVENT_NAME') == 'pull_request'
              and os.environ.get('GITHUB_REPOSITORY') == repo
              and os.environ.get('SCOPE_PR_NUMBER') == '256'
              and os.environ.get('SCOPE_HEAD_REPO') == repo
              and os.environ.get('SCOPE_BASE_REPO') == repo
              and os.environ.get('GITHUB_BASE_REF') == 'main'
            ):
              raise SystemExit('PR #256 repository/branch scope mismatch')
            allowed = {
              '.github/workflows/ota-airbnb-listing-discovery.yml',
              '.github/workflows/ota-initial-distribution-enablement.yml',
              '.github/workflows/property-protection-payment-authorization.yml',
              '.github/workflows/property-protection-v1-certification.yml',
              'prisma/migrations/20260925170000_damage_case_payment_attempt/migration.sql',
              'prisma/schema.prisma',
              'src/routes/dashboard.damage-cases.contract.test.ts',
              'src/routes/dashboard.damage-cases.routes.ts',
              'src/routes/dashboard.reservations.property-protection.contract.test.ts',
              'src/routes/dashboard.reservations.route.ts',
              'src/services/damage-case-mission-control.service.test.ts',
              'src/services/damage-case-mission-control.service.ts',
              'src/services/damage-case-payment-authorization.db.test.ts',
              'src/services/damage-case-payment-authorization.service.ts',
              'src/services/damage-case-payment-execution.service.ts',
              'src/services/damage-case-payment-execution.test.ts',
              'src/services/damage-case-payment-webhook.service.ts',
              'src/webhooks/stripe.webhook.ts',
            }
            if changed != allowed:
              raise SystemExit(f'PR #256 exact eighteen-file scope required: {sorted(changed ^ allowed)}')
            raise SystemExit(0)
          if os.environ.get('GITHUB_HEAD_REF') == 'agent/vrbo-channel-token-fix':
            repo = 'freddiefernandezmaysonet-netizen/pin-go-backend'
            if not (
              os.environ.get('GITHUB_EVENT_NAME') == 'pull_request'
              and os.environ.get('GITHUB_REPOSITORY') == repo
              and os.environ.get('SCOPE_PR_NUMBER') == '238'
              and os.environ.get('SCOPE_HEAD_REPO') == repo
              and os.environ.get('SCOPE_BASE_REPO') == repo
              and os.environ.get('GITHUB_BASE_REF') == 'main'
            ):
              raise SystemExit('PR #238 repository/branch scope mismatch')
            allowed = {
              '.github/workflows/booking-com-transport-readiness.yml',
              '.github/workflows/ota-airbnb-host-confirmed-mapping.yml',
              '.github/workflows/ota-airbnb-listing-discovery.yml',
              '.github/workflows/ota-initial-distribution-enablement.yml',
              'src/distribution/channex-canonical-readiness.service.ts',
              'src/distribution/channex-channel-identity.test.ts',
              'src/distribution/channex-channel-identity.ts',
            }
            if changed != allowed:
              raise SystemExit(f'PR #238 exact seven-file scope required: {sorted(changed ^ allowed)}')
          if os.environ.get('GITHUB_HEAD_REF') == 'agent/property-checkout-time-regex-hotfix':
            repo = 'freddiefernandezmaysonet-netizen/pin-go-backend'
            if not (
              os.environ.get('GITHUB_EVENT_NAME') == 'pull_request'
              and os.environ.get('GITHUB_REPOSITORY') == repo
              and os.environ.get('SCOPE_PR_NUMBER') == '247'
              and os.environ.get('SCOPE_HEAD_REPO') == repo
              and os.environ.get('SCOPE_BASE_REPO') == repo
              and os.environ.get('GITHUB_BASE_REF') == 'main'
            ):
              raise SystemExit('PR #247 repository/branch scope mismatch')
            allowed = {
              '.github/workflows/ota-airbnb-listing-discovery.yml',
              '.github/workflows/ota-initial-distribution-enablement.yml',
              'src/routes/dashboard.properties.route.ts',
              'src/services/property-checkout-time-validation.test.ts',
            }
            if changed != allowed:
              raise SystemExit(f'PR #247 exact four-file scope required: {sorted(changed ^ allowed)}')
            raise SystemExit(0)
          # The expanded scope is not available to other PRs, repos or branches.
          if os.environ.get('GITHUB_HEAD_REF') == 'agent/ota-initial-distribution-enablement-v1':
            repo = 'freddiefernandezmaysonet-netizen/pin-go-backend'
            if not (
              os.environ.get('GITHUB_EVENT_NAME') == 'pull_request'
              and os.environ.get('GITHUB_REPOSITORY') == repo
              and os.environ.get('SCOPE_PR_NUMBER') == '230'
              and os.environ.get('SCOPE_HEAD_REPO') == repo
              and os.environ.get('SCOPE_BASE_REPO') == repo
              and os.environ.get('GITHUB_BASE_REF') == 'main'
            ):
              raise SystemExit('PR #230 repository/branch scope mismatch')
            allowed.update({
              '.github/workflows/ota-airbnb-listing-discovery.yml',
              '.github/workflows/ota-airbnb-host-confirmed-mapping.yml',
            })
            if changed != allowed:
              raise SystemExit(f'Exact seven-file scope required: {sorted(changed ^ allowed)}')
          assert changed <= allowed, f'Unexpected scope: {sorted(changed - allowed)}'
          PY
