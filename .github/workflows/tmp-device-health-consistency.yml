name: tmp-device-health-consistency

on:
  push:
    branches:
      - agent/device-health-consistency-guard

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused tests
        run: >-
          npx tsx --test
          src/services/deviceHealthStoredStatusReconciliation.service.test.ts
          src/routes/deviceGateway.retired.contract.test.ts
          src/domain/computeOperationalRisk.test.ts
      - name: Bundle server
        run: npx esbuild src/server.ts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/server.mjs
      - name: Bundle device health worker
        run: npx esbuild src/workers/runDeviceHealth.worker.ts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/device-health-worker.mjs
