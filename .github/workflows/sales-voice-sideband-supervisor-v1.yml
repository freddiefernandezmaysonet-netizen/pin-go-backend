name: Sales Voice Sideband Supervisor V1

on:
  pull_request:
    branches:
      - agent/sales-voice-live-watchdog-v1-20261013
    paths:
      - 'src/services/sales-voice-sideband-supervisor.service.ts'
      - 'src/services/sales-voice-sideband-supervisor.service.test.ts'
      - 'src/workers/sales-voice-live-watchdog.worker.ts'
      - 'src/workers/sales-voice-live-watchdog.worker.test.ts'
      - '.github/workflows/sales-voice-sideband-supervisor-v1.yml'

permissions:
  contents: read

jobs:
  certify:
    name: Sideband binding and disabled worker contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingo_sales_sideband_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pingo_sales_sideband_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_sales_sideband_test
      SALES_SIDEBAND_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_sales_sideband_test
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact sideband/worker scope and whitespace
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const names=execFileSync('git',['diff','--name-only',process.env.BASE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          assert.deepEqual(names,[
            '.github/workflows/sales-voice-sideband-supervisor-v1.yml',
            'src/services/sales-voice-sideband-supervisor.service.test.ts',
            'src/services/sales-voice-sideband-supervisor.service.ts',
            'src/workers/sales-voice-live-watchdog.worker.test.ts',
            'src/workers/sales-voice-live-watchdog.worker.ts',
          ]);
          NODE
          git diff --check "$BASE_SHA" HEAD
      - name: Locked install and Prisma generate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/prisma validate
          ./node_modules/.bin/prisma generate
      - name: Focused compile and type-check
        run: |
          ./node_modules/.bin/tsc --noEmit --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext --esModuleInterop src/services/sales-voice-sideband-supervisor.service.ts src/services/sales-voice-sideband-supervisor.service.test.ts src/workers/sales-voice-live-watchdog.worker.ts src/workers/sales-voice-live-watchdog.worker.test.ts
      - name: Validate disposable database target only
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const u=new URL(process.env.DATABASE_URL);
          assert.equal(u.hostname,'127.0.0.1');
          assert.equal(u.pathname,'/pingo_sales_sideband_test');
          assert.equal(process.env.DATABASE_URL,process.env.SALES_SIDEBAND_TEST_DATABASE_URL);
          NODE
          ./node_modules/.bin/prisma db push --skip-generate
      - name: Fake WebSocket contract + real PostgreSQL call lifecycle
        run: node --import tsx --test src/services/sales-voice-sideband-supervisor.service.test.ts
      - name: Worker fail-closed startup tests
        run: node --import tsx --test src/workers/sales-voice-live-watchdog.worker.test.ts
      - name: Publish exact test limits
        run: |
          echo '## Sideband Supervisor + Watchdog worker draft' >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic WebSocket events + disposable PostgreSQL and disabled worker tests only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No network connection, no ws HTTP-header factory, no live OpenAI provider event, no Railway deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Worker explicitly requires 3 staging gates and cannot run in NODE_ENV=production.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sideband capacity still requires verified end-to-end real session.closed before production.' >> "$GITHUB_STEP_SUMMARY"
