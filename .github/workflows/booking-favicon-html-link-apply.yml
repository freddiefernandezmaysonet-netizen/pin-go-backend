name: Temporary Booking Favicon HTML Link Apply
on:
  push:
    branches: [agent/booking-favicon-html-link]
    paths: [.github/workflows/booking-favicon-html-link-apply.yml]
permissions:
  contents: write
jobs:
  apply-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/booking-favicon-html-link
          fetch-depth: 0
      - name: Add explicit favicon metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/booking-search.preview.html')
          s=p.read_text()
          anchor='<title>Pin&Go Booking</title>'
          links='<link rel="icon" type="image/png" href="/favicon.ico"><link rel="shortcut icon" type="image/png" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png">'
          if s.count(anchor) != 1: raise SystemExit(f'expected one title anchor, found {s.count(anchor)}')
          if 'rel="icon"' in s or 'rel="apple-touch-icon"' in s: raise SystemExit('favicon metadata already present')
          p.write_text(s.replace(anchor, anchor+links, 1))
          PY
      - name: Verify exact scope
        run: |
          grep -F '<link rel="icon" type="image/png" href="/favicon.ico">' src/booking-search.preview.html
          grep -F '<link rel="shortcut icon" type="image/png" href="/favicon.ico">' src/booking-search.preview.html
          grep -F '<link rel="apple-touch-icon" href="/apple-touch-icon.png">' src/booking-search.preview.html
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/booking-search.preview.html"
      - name: Commit only HTML metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/booking-search.preview.html
          git commit -m "Declare Booking favicon in public HTML"
          git push origin HEAD:agent/booking-favicon-html-link
