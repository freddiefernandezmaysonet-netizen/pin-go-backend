name: E13 Authorized Pre-Merge Corrections V2

on:
  push:
    branches:
      - agent/apms-enterprise-guest-journey-e13-runtime-truth
    paths:
      - ".github/workflows/e13-authorized-premerge-fix-v2.yml"

permissions:
  contents: write

jobs:
  correct-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingo_e13_fix_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pingo_e13_fix_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pingo_e13_fix_v2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply authorized E13 corrections
