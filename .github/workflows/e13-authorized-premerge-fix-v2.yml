      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma without production access
        run: |
          npx prisma generate --schema prisma/schema.prisma
          npx prisma validate --schema prisma/schema.prisma

      - name: Apply complete migration history to empty ephemeral PostgreSQL
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Certify E13 and regress E1 through E12
        run: |
          npm run test:guest-journey-enterprise-e13-runtime-truth
          npm run test:guest-journey-enterprise-contract
          npm run test:guest-journey-enterprise-e2-shadow
          npm run test:guest-journey-enterprise-e3-reconciler
          npm run test:guest-journey-enterprise-e4-coordination
          npm run test:guest-journey-enterprise-e5-owner-runtime
          npm run test:guest-journey-enterprise-e6-mission-control
          npm run test:guest-journey-enterprise-e7-communications
          npm run test:guest-journey-enterprise-e8-access-owner
          npm run test:guest-journey-enterprise-e9-financial-owner
          npm run test:guest-journey-enterprise-e10-compliance-owner
          npm run test:guest-journey-enterprise-e11-activation-control-plane
          npm run test:guest-journey-enterprise-e12-runtime-enforcement
          npm run test:canonical-operational-contract

      - name: Bundle worker and API wiring
        run: |
          npx esbuild src/workers/reservation.worker.ts --bundle --platform=node --packages=external --outfile=/tmp/reservation.worker.e13-fix.js
          npx esbuild src/server.ts --bundle --platform=node --packages=external --outfile=/tmp/server.e13-fix.js

      - name: Review final scope and patch integrity
        run: |
          git diff --check
          git diff --name-status
          ! git diff --name-only | grep -E '(^|/)(ttlock|stripe|twilio|channex)(/|\.)'

      - name: Commit and publish authorized corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E13 harden multi-replica runtime truth"
          git push origin HEAD:${{ github.ref_name }}
