name: Remove Organization Channel Distribution Validation

on:
  push:
    branches:
      - agent/remove-organization-channel-distribution
    paths:
      - ".github/workflows/remove-organization-channel-distribution-validation.yml"
      - "src/routes/dashboard.organization.route.ts"
      - "src/routes/dashboard.organization.no-legacy-distribution.contract.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Legacy distribution removal contract
        run: npx tsx --test src/routes/dashboard.organization.no-legacy-distribution.contract.test.ts
      - name: Bundle organization route
        run: npx esbuild src/routes/dashboard.organization.route.ts --bundle --platform=node --packages=external --outfile=/tmp/dashboard.organization.route.js
