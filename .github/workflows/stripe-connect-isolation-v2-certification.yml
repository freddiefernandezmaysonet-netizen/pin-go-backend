name: Stripe Connect Isolation V2 Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/services/stripe-connect-provisioning*"
      - "src/services/stripe-connect.service.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20260923180000_stripe_connect_provisioning/migration.sql"
      - "src/services/stripe-connect-isolation-v2.service.ts"
      - "src/services/stripe-connect-isolation-v2.service.test.ts"
      - "src/routes/dashboard-payouts.routes.ts"
      - "tsconfig.stripe-connect-isolation-v2.json"
      - ".github/workflows/stripe-connect-isolation-v2-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Tenant isolation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pingo_connect_isolation_v2?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Test Stripe Connect tenant isolation
        run: npx tsx --test src/services/stripe-connect-isolation-v2.service.test.ts src/services/stripe-connect-provisioning.service.test.ts

      - name: Test migration in disposable in-memory PostgreSQL
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/pingo-pglite" @electric-sql/pglite@0.3.14
          PINGO_PGLITE_MODULE="$RUNNER_TEMP/pingo-pglite/node_modules/@electric-sql/pglite/dist/index.js" node --test src/services/stripe-connect-provisioning.migration.test.mjs

      - name: TypeScript isolation contract
        run: npx tsc -p tsconfig.stripe-connect-isolation-v2.json

      - name: Certify safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'STRIPE_CONNECT_V2_ACCOUNT_CREATION_ENABLED' src/services/stripe-connect-isolation-v2.service.ts
          ! grep -q 'STRIPE_CONNECT_V2_CANARY_ORGANIZATION_IDS' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'STRIPE_CONNECT_TENANT_MISMATCH' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'fees: { payer: "account" }' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'losses: { payments: "stripe" }' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'requirement_collection: "stripe"' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'stripe_dashboard: { type: "none" }' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'detailsSubmitted: boolean' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'input.detailsSubmitted' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'account_onboarding' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'external_account_collection: true' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'disable_stripe_user_authentication: false' src/services/stripe-connect-isolation-v2.service.ts
          grep -q '2026-03-25.dahlia' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'buildStripeConnectIsolationV2AccountSessionRequestOptions' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'Boolean(account.details_submitted)' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'stripeClient = new Stripe(secretKey);' src/services/stripe-connect-isolation-v2.service.ts
          ! grep -q 'new Stripe(secretKey,.*apiVersion' src/services/stripe-connect-isolation-v2.service.ts
          grep -q 'pre-onboarding V2 Account Session enables only account onboarding' src/services/stripe-connect-isolation-v2.service.test.ts
          grep -q 'components.notification_banner, undefined' src/services/stripe-connect-isolation-v2.service.test.ts
          grep -q 'post-onboarding V2 Account Session enables remediation, account, payment and payout surfaces without onboarding' src/services/stripe-connect-isolation-v2.service.test.ts
          grep -q '/api/dashboard/payouts/connect-isolation-v2/eligibility' src/routes/dashboard-payouts.routes.ts
          grep -q '/api/dashboard/payouts/connect-isolation-v2/account' src/routes/dashboard-payouts.routes.ts
          grep -q '/api/dashboard/payouts/connect-isolation-v2/account-session' src/routes/dashboard-payouts.routes.ts
          ! grep -q 'req.body.*account' src/routes/dashboard-payouts.routes.ts
          ! grep -q 'stripe.accounts.create' src/services/stripe-connect.service.ts
