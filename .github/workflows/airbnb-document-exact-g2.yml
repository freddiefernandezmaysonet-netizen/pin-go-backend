name: Airbnb Document-Exact Gate 2 (backend)

on:
  push:
    branches:
      - agent/airbnb-document-exact-closure

permissions:
  contents: read

jobs:
  callback-resource-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact working branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run mocked handoff and callback resource-read tests
        run: node --import tsx --test src/distribution/airbnb-host-self-service.service.test.ts src/distribution/airbnb-host-self-service.callback-verifier.test.ts
      - name: Typecheck only isolated callback production modules
        run: ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --types node src/distribution/airbnb-host-self-service.service.ts src/distribution/airbnb-host-self-service.callback-verifier.ts
      - name: Prove shared core and protected surfaces unchanged
        run: git diff --exit-code 2c82832fb84b112ea81037efff8f526dd48470ab -- src/distribution/channex-channel-identity.ts src/distribution/channex-readonly.http-transport.ts src/distribution/channex-white-label.http-transport.ts src/distribution/distribution-mutation-security.ts src/middleware/requireAuth.ts prisma src/workers
