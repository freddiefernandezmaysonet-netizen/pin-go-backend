name: Canonical Operational Contract Certification

on:
  push:
    branches:
      - sprint/canonical-operational-contract-v1
    paths:
      - ".github/workflows/canonical-engine-catalog-certification.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.engine-catalog.json"
      - "src/apms/engine-catalog.ts"
      - "src/apms/engine-catalog.test.ts"
      - "src/apms/audit-types.ts"
      - "src/apms/audit-persistence.service.ts"
      - "src/apms/audit-persistence.service.test.ts"
      - "src/apms/operational-intelligence-types.ts"
      - "src/apms/operational-transition-policy.ts"
      - "src/apms/operational-transition-policy.test.ts"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/canonical-engine-catalog-certification.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.engine-catalog.json"
      - "src/apms/engine-catalog.ts"
      - "src/apms/engine-catalog.test.ts"
      - "src/apms/audit-types.ts"
      - "src/apms/audit-persistence.service.ts"
      - "src/apms/audit-persistence.service.test.ts"
      - "src/apms/operational-intelligence-types.ts"
      - "src/apms/operational-transition-policy.ts"
      - "src/apms/operational-transition-policy.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Operational Contract Tests and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical Engine catalog tests
        run: npm run test:engine-catalog

      - name: Run immutable audit persistence tests
        run: npm run test:audit-persistence

      - name: Run operational transition policy tests
        run: npm run test:operational-transition-policy

      - name: Run TypeScript typecheck
        run: npx tsc --project tsconfig.engine-catalog.json --noEmit
