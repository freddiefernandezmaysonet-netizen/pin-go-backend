name: Canonical Operational Contract Certification

on:
  push:
    branches:
      - sprint/canonical-operational-contract-v1
    paths:
      - ".github/workflows/canonical-engine-catalog-certification.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.engine-catalog.json"
      - "src/apms/**"
      - "src/routes/dashboard.properties.route.ts"
      - "src/routes/guest.routes.ts"
      - "src/routes/org.tuya.routes.ts"

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/canonical-engine-catalog-certification.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.engine-catalog.json"
      - "src/apms/**"
      - "src/routes/dashboard.properties.route.ts"
      - "src/routes/guest.routes.ts"
      - "src/routes/org.tuya.routes.ts"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Canonical Operational Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical operational contract certification
        run: npm run test:canonical-operational-contract
