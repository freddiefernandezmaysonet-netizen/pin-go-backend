<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pin&Go Booking</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f6;color:#10231e;font-family:Inter,system-ui,-apple-system,sans-serif}header{height:74px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #dde3df}header strong{font-size:21px}.hr{display:flex;align-items:center;gap:14px}header span{font-size:13px;color:#66736e}.lang{display:flex;border:1px solid #d9e2dd;border-radius:999px;padding:3px;background:#f7f9f8}.lang button{border:0;background:transparent;border-radius:999px;padding:6px 9px;font-weight:800;font-size:12px;color:#53645e}.lang button.active{background:#153d32;color:#fff}.hero{min-height:560px;background:linear-gradient(135deg,#17483b,#0b251e);color:#fff;padding:90px max(20px,calc((100% - 1160px)/2)) 65px}.eye{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#d4f4e7}.hero h1{max-width:760px;margin:18px 0;font:500 clamp(45px,7vw,78px)/.98 Georgia,serif;letter-spacing:-.045em}.hero>p{max-width:650px;line-height:1.65;color:#ffffffdc}.search{position:relative;z-index:5;display:grid;grid-template-columns:1.4fr repeat(3,.85fr) auto;max-width:1120px;margin-top:40px;padding:8px;background:#fff;border-radius:18px;box-shadow:0 24px 60px #00150d55;color:#18362e}.field{display:flex;align-items:center;gap:9px;padding:8px 14px;border-right:1px solid #e3e8e5}.field span{width:100%;min-width:0}.field b{display:block;font-size:13px}.field input{width:100%;border:0;outline:0;margin-top:4px;font:inherit;font-size:14px}.locwrap{position:relative}.menu{display:none;position:absolute;top:calc(100% + 18px);left:-40px;width:min(450px,calc(100vw - 44px));background:#fff;border:1px solid #dce5e0;border-radius:16px;overflow:hidden;box-shadow:0 22px 55px #061c1538}.menu.open{display:block}.opt{display:grid;grid-template-column ></div></section><section class="trust"><span id="trust1"></span><span id="trust2"></span><span id="trust3"></span></section><section class="section featured"><small id="featuredEye"></small><h2 id="featuredTitle"></h2><p id="featuredText"></p><div id="featuredCards" class="cards"></div></section><section id="results" class="section results" aria-live="polite"><div class="resultsHead"><div><small id="resultsEye"></small><h2 id="resultsTitle"></h2></div><p id="resultsCount"></p></div><div id="resultCards" class="cards"></div></section><div class="host"><a id="hostLink" href="https://pin-ngo.com"></a></div></main><script>const API=location.origin;const T={es:{tag:'Reserva directo. Viaja tranquilo.',eye:'✦ Encuentra tu próxima estadía',heroTitle:'Encuentra un lugar que se sienta tuyo.',heroText:'Estadías seleccionadas con reservación directa, información clara y una experiencia coordinada por Pin&Go.',dest:'Destino',destPh:'Ciudad, destino o alojamiento',arrive:'Llegada',depart:'Salida',guests:'Huéspedes',search:'Buscar',searching:'Buscando…',trust1:'✓ Reservación directa',trust2:'✦ Información clara',trust3:'▣ Estadía coordinada',featuredEye:'DESCUBRE PIN&GO',featuredTitle:'Estadías destacadas',featuredText:'Una selección de propiedades para descubrir antes de comenzar tu búsqueda.',resultsEye:'RESULTADOS DE BÚSQUEDA',available:'Alojamientos disponibles',destination:'Destino',stay:'Alojamiento',noSuggest:'Todavía no hay alojamientos Pin&Go en ese destino.',upTo:'Hasta',guestWord:'huéspedes',minimum:'Mínimo',maximum:'Máximo',night:'noche',nights:'noches',from:'Desde',view:'Ver disponibilidad y reservar →',loading:'Buscando disponibilidad real…',found:n=>`Encontramos ${n} alojamiento${n===1?'':'s'} disponible${n===1?'':'s'}.`,count:n=>`${n} resultado${n===1?'':'s'}`,inPlace:q=>`Alojamientos en ${q}`,looking:q=>`Buscando en ${q}`,zeroTitle:'No encontramos disponibilidad para esas fechas.',zeroText:'Prueba otras fechas, cambia el número de huéspedes o busca otro destino. Tus criterios permanecen en el buscador para que puedas ajustarlos fácilmente.',zeroStatus:'No encontramos alojamientos disponibles con esos criterios.',errorTitle:'No pudimos completar la búsqueda',errorHead:'Hubo un problema al consultar disponibilidad.',errorText:'No se modificó tu búsqueda. Puedes intentarlo nuevamente.',retry:'Intentar de nuevo',complete:'Completa destino, llegada y salida para buscar.',guestFavorite:'Favorita de huéspedes',popular:'Popular en Pin&Go',pinGoPick:'Selección Pin&Go',host:'¿Administras una propiedad? Conoce Pin&Go APMS →'},en:{tag:'Book direct. Travel easy.',eye:'✦ Find your next stay',heroTitle:'Find a place that feels like yours.',heroText:'Selected stays with direct booking, clear information, and a coordinated experience powered by Pin&Go.',dest:'Destination',destPh:'City, destination, or property',arrive:'Check-in',depart:'Check-out',guests:'Guests',search:'Search',searching:'Searching…',trust1:'✓ Direct booking',trust2:'✦ Clear information',trust3:'▣ Coordinated stay',featuredEye:'DISCOVER PIN&GO',featuredTitle:'Featured stays',featuredText:'A selection of properties to discover before you begin your search.',resultsEye:'SEARCH RESULTS',available:'Available stays',destination:'Destination',stay:'Property',noSuggest:'Pin&Go does not have stays in that destination yet.',upTo:'Up to',guestWord:'guests',minimum:'Minimum',maximum:'Maximum',night:'night',nights:'nights',from:'From',view:'View availability and book →',loading:'Checking real availability…',found:n=>`We found ${n} available ${n===1?'stay':'stays'}.`,count:n=>`${n} result${n===1?'':'s'}`,inPlace:q=>`Stays in ${q}`,looking:q=>`Searching in ${q}`,zeroTitle:'No availability for those dates.',zeroText:'Try different dates, change the number of guests, or search another destination. Your criteria stay in the search form so you can adjust them easily.',zeroStatus:'No available stays match those criteria.',errorTitle:'We could not complete the search',errorHead:'There was a problem checking availability.',errorText:'Your search was not changed. You can try again.',retry:'Try again',complete:'Enter a destination, check-in, and check-out to search.',guestFavorite:'Guest favorite',popular:'Popular on Pin&Go',pinGoPick:'Pin&Go pick',host:'Manage a property? Discover Pin&Go APMS →'}};let lang='es',catalog=[],featured=[],suggestions=[],active=-1,lastQuery=null;try{lang=localStorage.getItem('pingo_guest_preferred_language')==='en'?'en':'es'}catch{}const $=id=>document.getElementById(id),dest=$('destination'),menu=$('menu'),featuredCards=$('featuredCards'),resultCards=$('resultCards'),results=$('results'),status=$('status'),go=$('go');function tr(){return T[lang]}function applyLanguage(){document.documentElement.lang=lang;const t=tr();$('tag').textContent=t.tag;$('eye').textContent=t.eye;$('heroTitle').textContent=t.heroTitle;$('heroText').textContent=t.heroText;$('destLabel').textContent=t.dest;dest.placeholder=t.destPh;$('inLabel').textContent=t.arrive;$('outLabel').textContent=t.depart;$('guestsLabel').textContent=t.guests;go.textContent=t.search;$('trust1').textContent=t.trust1;$('trust2').textContent=t.trust2;$('trust3').textContent=t.trust3;$('featuredEye').textContent=t.featuredEye;$('featuredTitle').textContent=t.featuredTitle;$('featuredText').textContent=t.featuredText;$('resultsEye').textContent=t.resultsEye;$('hostLink').textContent=t.host;$('esBtn').classList.toggle('active',lang==='es');$('enBtn').classList.toggle('active',lang==='en');if(results.classList.contains('show')&&lastQuery){$('resultsTitle').textContent=t.inPlace(lastQuery.destination)}renderFeatured();if(menu.classList.contains('open'))renderMenu()}function setLang(v){lang=v;try{localStorage.setItem('pingo_guest_preferred_language',v)}catch{}applyLanguage()}$('esBtn').onclick=()=>setLang('es');$('enBtn').onclick=()=>setLang('en');function norm(v=''){return v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ')}function makeSuggestions(q){q=norm(q);if(!q)return[];const destinations=new Map(),stays=[];catalog.forEach(p=>{const place=[p.city,p.region,p.country].filter(Boolean).join(', ');const shortPlace=[p.city,p.region].filter(Boolean).join(', ');if((norm(place).includes(q)||norm(shortPlace).includes(q))&&!destinations.has(norm(shortPlace)))destinations.set(norm(shortPlace),{label:shortPlace||place,meta:tr().destination,type:'destination'});if(norm((p.title||'')+' '+place).includes(q))stays.push({label:p.title,meta:shortPlace||place,type:'property'})});return[...destinations.values(),...stays]}function close(){menu.className='menu';active=-1}function renderMenu(){suggestions=makeSuggestions(dest.value);active=-1;if(!dest.value.trim()){close();return}if(!suggestions.length){menu.innerHTML=`<div class="empty">${tr().noSuggest}</div>`;menu.className='menu open';return}menu.innerHTML=suggestions.map((s,i)=>`<button type="button" class="opt" data-i="${i}"><span><b>${s.label}</b><small>${s.type==='property'?s.meta:''}</small></span><span class="kind">${s.type==='destination'?tr().destination:tr().stay}</span></button>`).join('');menu.className='menu open';[...menu.querySelectorAll('.opt')].forEach(b=>b.onclick=()=>select(+b.dataset.i))}function select(i){if(!suggestions[i])return;dest.value=suggestions[i].label;close()}function paint(){[...menu.querySelectorAll('.opt')].forEach((b,i)=>b.classList.toggle('active',i===active))}dest.oninput=renderMenu;dest.onfocus=()=>dest.value.trim()&&renderMenu();dest.onkeydown=e=>{if(e.key==='ArrowDown'&&suggestions.length){e.preventDefault();active=(active+1)%suggestions.length;paint()}else if(e.key==='ArrowUp'&&suggestions.length){e.preventDefault();active=(active-1+suggestions.length)%suggestions.length;paint()}else if(e.key==='Enter'&&active>=0){e.preventDefault();select(active)}else if(e.key==='Escape')close()};document.addEventListener('pointerdown',e=>{if(!e.target.closest('.locwrap'))close()});const ci=$('checkin'),co=$('checkout');const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());const today=d.toISOString().slice(0,10);ci.min=today;co.min=today;ci.onchange=()=>{if(!ci.value){co.min=today;return}const n=new Date(ci.value+'T00:00:00Z');n.setUTCDate(n.getUTCDate()+1);co.min=n.toISOString().slice(0,10);if(co.value&&co.value<co.min)co.value=''};function rules(p){const t=tr(),parts=[];if(Number(p.minimumNights)>0)parts.push(`${t.minimum} ${p.minimumNights} ${Number(p.minimumNights)===1?t.night:t.nights}`);if(Number(p.maximumNights)>0)parts.push(`${t.maximum} ${p.maximumNights} ${Number(p.maximumNights)===1?t.night:t.nights}`);return parts.join(' · ')}function featuredLabel(p){const t=tr();return p.featuredReason==='GUEST_FAVORITE'?t.guestFavorite:p.featuredReason==='POPULAR'?t.popular:p.featuredReason==='PIN_GO_PICK'?t.pinGoPick:''}function card(p){const t=tr(),href='https://app.pin-ngo.com'+p.bookingPath,rate=Number(p.baseNightlyRate),price=Number.isFinite(rate)&&rate>0?`<div class="price">${t.from} $${rate.toLocaleString('en-US',{maximumFractionDigits:2})} <span>/ ${t.night}</span></div>`:'',rule=rules(p),badge=featuredLabel(p);return `<article class="card">${p.photoUrl?`<a href="${href}"><img src="${p.photoUrl}" alt="${p.title}"></a>`:'<div class="ph"></div>'}<div class="body">${badge?`<div class="featuredbadge">${badge}</div>`:''}<small>${[p.city,p.region].filter(Boolean).join(', ')}</small><h3>${p.title}</h3><p>${t.upTo} ${p.maxGuests||'—'} ${t.guestWord}</p>${rule?`<div class="rules">${rule}</div>`:''}${price}<a href="${href}">${t.view}</a></div></article>`}function renderFeatured(){const items=featured.length?featured.slice(0,6):[];if(items.length){featuredCards.innerHTML=items.map(card).join('');return}if(!catalog.length)return;const remanso=catalog.find(p=>p.organizationSlug==='remansodepaz')||catalog[0];featuredCards.innerHTML=remanso?card(remanso):''}async function load(){try{const [catalogResponse,featuredResponse]=await Promise.all([fetch(API+'/api/public-booking/catalog'),fetch(API+'/api/public-booking/featured-audit')]);if(!catalogResponse.ok)throw 0;const j=await catalogResponse.json();catalog=j.results||[];if(featuredResponse.ok){const f=await featuredResponse.json();featured=Array.isArray(f.results)?f.results.slice(0,6):[]}renderFeatured()}catch{featured=[];renderFeatured();if(!catalog.length)featuredCards.innerHTML='<div class="statebox"><p>—</p></div>'}}function showLoading(q){const t=tr();results.className='section results show';$('resultsTitle').textContent=t.looking(q.destination);$('resultsCount').textContent='';resultCards.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';status.textContent=t.loading;go.disabled=true;go.textContent=t.searching}function finish(){go.disabled=false;go.textContent=tr().search}function showZero(q){const t=tr();$('resultsTitle').textContent=t.inPlace(q.destination);$('resultsCount').textContent=t.count(0);resultCards.innerHTML=`<div class="statebox"><h3>${t.zeroTitle}</h3><p>${t.zeroText}</p></div>`;status.textContent=t.zeroStatus}function showError(){const t=tr();$('resultsTitle').textContent=t.errorTitle;$('resultsCount').textContent='';resultCards.innerHTML=`<div class="statebox"><h3>${t.errorHead}</h3><p>${t.errorText}</p><button id="retry" class="retry">${t.retry}</button></div>`;status.textContent=t.errorHead;setTimeout(()=>{const b=$('retry');if(b)b.onclick=()=>lastQuery&&runSearch(lastQuery)},0)}async function runSearch(q){lastQuery=q;showLoading(q);try{const params=new URLSearchParams(q);const r=await fetch(API+'/api/public-booking/search?'+params);const j=await r.json();if(!r.ok)throw new Error();const found=j.results||[],t=tr();if(!found.length)showZero(q);else{$('resultsTitle').textContent=t.inPlace(q.destination);$('resultsCount').textContent=t.count(found.length);resultCards.innerHTML=found.map(card).join('');status.textContent=t.found(found.length)}results.scrollIntoView({behavior:'smooth',block:'start'})}catch{showError()}finally{finish()}}$('form').onsubmit=e=>{e.preventDefault();close();const q={destination:dest.value.trim(),checkIn:ci.value,checkOut:co.value,guests:$('guests').value};if(!q.destination||!q.checkIn||!q.checkOut){status.textContent=tr().complete;return}runSearch(q)};applyLanguage();load();</script></body></html>
